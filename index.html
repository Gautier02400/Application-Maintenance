<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutos Maintenance – Tri optique verre</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2f5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tutos Maintenance">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f5f9;--card:#ffffff;--text:#1b2733;--muted:#5d6b78;--line:#dbe1e7;
  --brand:#0a2f5a;--accent:#0a5aa8;--accent-text:#ffffff;--ok:#1a8a4a;--warn-bg:#fff4d6;--warn-line:#e0a800;--warn-text:#5c4300;
  --danger-bg:#fde8e8;--danger-line:#d33;--danger-text:#7a1414;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c;--card:#19222b;--text:#e8edf2;--muted:#9aa9b6;--line:#2c3a47;
    --brand:#0a2540;--accent:#5aaeea;--accent-text:#04121f;--ok:#4cc57f;--warn-bg:#3a2f0b;--warn-line:#c99a00;--warn-text:#ffe29a;
    --danger-bg:#3d1717;--danger-line:#e66;--danger-text:#ffb3b3;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c;--card:#19222b;--text:#e8edf2;--muted:#9aa9b6;--line:#2c3a47;
  --brand:#0a2540;--accent:#5aaeea;--accent-text:#04121f;--ok:#4cc57f;--warn-bg:#3a2f0b;--warn-line:#c99a00;--warn-text:#ffe29a;
  --danger-bg:#3d1717;--danger-line:#e66;--danger-text:#ffb3b3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
header{background:var(--brand);color:#fff;border-bottom:3px solid #2d8fe0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{font-size:1.15rem;margin:0}
h1 small{display:block;font-weight:400;color:#c5d6ea;font-size:.8rem}
header button.primary,header .lang button.on{background:#2d8fe0;border-color:#2d8fe0;color:#fff}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger-line);border-color:var(--danger-line)}
button.small{padding:4px 8px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:640px){.filters{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border-radius:999px;padding:4px 12px;font-size:.85rem}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:1rem}
.meta{color:var(--muted);font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.valide{color:var(--ok);border-color:var(--ok)}
.tag.avalider{color:var(--warn-line);border-color:var(--warn-line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.box{border-left:4px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-text);padding:10px 12px;border-radius:6px;margin:10px 0}
.box.danger{border-left-color:var(--danger-line);background:var(--danger-bg);color:var(--danger-text)}
.box ul{margin:4px 0 0 18px;padding:0}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .2s}
.step{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700}
.step.done .num{background:var(--ok)}
.step.done .txt{color:var(--muted);text-decoration:line-through}
.step .body{flex:1;min-width:0}
.step img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
.step label.chk{display:flex;gap:8px;align-items:center;margin:8px 0 0;color:var(--muted);cursor:pointer}
.step input[type=checkbox]{width:20px;height:20px;padding:0}
.edit-step{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--bg)}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.disclaimer{font-size:.8rem;color:var(--muted);margin-top:24px}
.lang{display:flex}
.lang button{border-radius:0;padding:8px 10px;font-size:.85rem}
.lang button:first-child{border-radius:8px 0 0 8px}
.lang button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.lang button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
@media print{
  header,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000}
  .panel,.card{border-color:#999}
}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:40px;width:auto;background:#fff;padding:4px 8px;border-radius:6px}
</style>
</head>
<body>

<header class="noprint">
  <div class="wrap">
    <div class="top">
      <h1 class="brand">
      <img src="icon-512.png" alt="Sibelco" class="logo">
      <span><span data-i18n="app_title"></span> <small data-i18n="app_sub"></small></span>
      </h1>
      <div class="row">
        <div class="lang" role="group" aria-label="Langue / Language">
          <button id="bFr" onclick="setLang('fr')">FR</button>
          <button id="bEn" onclick="setLang('en')">EN</button>
        </div>
        <button class="primary" onclick="newTuto()" data-i18n="new"></button>
        <button onclick="exportJSON()" data-i18n="export"></button>
        <button onclick="document.getElementById('imp').click()" data-i18n="import"></button>
        <input id="imp" type="file" accept="application/json" class="hidden" onchange="importJSON(event)">
      </div>
    </div>
    <div class="filters" id="filters">
      <input id="q" type="search" data-i18n-ph="search" oninput="renderList()">
      <select id="fMachine" onchange="renderList()"></select>
      <select id="fStatus" onchange="renderList()"></select>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
const KEY = 'sibelco_tutos_v1';
const LANG_KEY = 'sibelco_lang';

/* ---------- TRADUCTIONS DE L'INTERFACE ---------- */
const I18N = {
 fr:{
  app_title:'Tutos Maintenance', app_sub:'Trieurs optiques – verre · Sibelco Reims',
  new:'+ Nouveau tutoriel', export:'Exporter', import:'Importer',
  search:'Rechercher (ex : buse, vitre, calibration…)',
  all_machines:'Toutes les machines', all_status:'Tous les statuts', all:'Toutes',
  none_found:'Aucun tutoriel trouvé.<br>Clique sur « + Nouveau tutoriel » pour en créer un.',
  steps_n:n=>n+' étape'+(n>1?'s':''), min:'min',
  back:'← Retour', print:'Imprimer / PDF', edit:'Modifier',
  safety:'Sécurité', tools:'Matériel / outils', progress:'Progression',
  step_done:'Étape réalisée', no_steps:'Aucune étape.',
  prog:(d,n,p)=>`${d}/${n} étapes (${p}%)`, finished:'Tutoriel terminé !',
  new_title:'Nouveau tutoriel', edit_title:'Modifier le tutoriel',
  cancel:'← Annuler', delete:'Supprimer', save:'Enregistrer',
  f_title:'Titre', ph_title:"Ex : Remplacement d'une buse d'éjection",
  f_machine:'Machine (modèle / ligne)', ph_machine:'Ex : Trieur ligne 2',
  f_cat:'Catégorie', f_level:'Niveau', f_duration:'Durée (min)', f_status:'Statut',
  f_safety:'Consignes de sécurité (une par ligne)', f_tools:'Matériel / outils (un par ligne)',
  steps:'Étapes', add_step:'+ Ajouter une étape', step:'Étape', remove:'Suppr.',
  f_instr:'Instruction', ph_instr:"Décris précisément l'action à réaliser",
  f_warn:"Avertissement / point d'attention (facultatif)",
  f_photo:'Photo (facultatif)', rm_photo:'Retirer la photo',
  need_title:'Donne un titre au tutoriel', saved:'Tutoriel enregistré', deleted:'Tutoriel supprimé',
  confirm_del:'Supprimer définitivement ce tutoriel ?',
  export_started:'Export lancé', imported:n=>n+' tutoriel(s) importé(s)', invalid:'Fichier invalide',
  storage_full:'Stockage plein ou indisponible : pensez à exporter en JSON',
  footer:'Projet réalisé par Lecertisseur Gautier, Coordinateur Tri Optiques · Sibelco Reims',
  unspecified:'Non précisée'
 },
 en:{
  app_title:'Maintenance Tutorials', app_sub:'Optical glass sorters · Sibelco Reims',
  new:'+ New tutorial', export:'Export', import:'Import',
  search:'Search (e.g. nozzle, window, calibration…)',
  all_machines:'All machines', all_status:'All statuses', all:'All',
  none_found:'No tutorial found.<br>Click “+ New tutorial” to create one.',
  steps_n:n=>n+' step'+(n>1?'s':''), min:'min',
  back:'← Back', print:'Print / PDF', edit:'Edit',
  safety:'Safety', tools:'Tools / equipment', progress:'Progress',
  step_done:'Step completed', no_steps:'No steps.',
  prog:(d,n,p)=>`${d}/${n} steps (${p}%)`, finished:'Tutorial completed!',
  new_title:'New tutorial', edit_title:'Edit tutorial',
  cancel:'← Cancel', delete:'Delete', save:'Save',
  f_title:'Title', ph_title:'E.g. Replacing an ejection nozzle',
  f_machine:'Machine (model / line)', ph_machine:'E.g. Sorter line 2',
  f_cat:'Category', f_level:'Level', f_duration:'Duration (min)', f_status:'Status',
  f_safety:'Safety instructions (one per line)', f_tools:'Tools / equipment (one per line)',
  steps:'Steps', add_step:'+ Add a step', step:'Step', remove:'Delete',
  f_instr:'Instruction', ph_instr:'Describe the action to perform precisely',
  f_warn:'Warning / point of attention (optional)',
  f_photo:'Photo (optional)', rm_photo:'Remove photo',
  need_title:'Please give the tutorial a title', saved:'Tutorial saved', deleted:'Tutorial deleted',
  confirm_del:'Permanently delete this tutorial?',
  export_started:'Export started', imported:n=>n+' tutorial(s) imported', invalid:'Invalid file',
  storage_full:'Storage full or unavailable: please export to JSON',
  footer:'Project by Lecertisseur Gautier, Optical Sorting Coordinator · Sibelco Reims',
  unspecified:'Not specified'
 }
};
let lang = (()=>{ try{ const l=localStorage.getItem(LANG_KEY); if(l==='fr'||l==='en') return l; }catch(e){} return (navigator.language||'fr').toLowerCase().startsWith('en')?'en':'fr'; })();
const T = (k,...a)=>{ const v=I18N[lang][k]; return typeof v==='function'?v(...a):v; };

/* Valeurs stockées en français, affichées selon la langue */
const CATS = ['Sécurité','Nettoyage','Contrôle','Réglage / Calibration','Remplacement','Dépannage'];
const CAT_EN = {'Sécurité':'Safety','Nettoyage':'Cleaning','Contrôle':'Inspection','Réglage / Calibration':'Adjustment / Calibration','Remplacement':'Replacement','Dépannage':'Troubleshooting'};
const LEVELS = ['Facile','Moyen','Avancé','Obligatoire'];
const LEVEL_EN = {'Facile':'Easy','Moyen':'Medium','Avancé':'Advanced','Obligatoire':'Mandatory'};
const STATUS_L = {fr:{brouillon:'Brouillon',avalider:'À valider',valide:'Validé'}, en:{brouillon:'Draft',avalider:'To validate',valide:'Validated'}};
const MACHINE_TR = {'Tous trieurs':'All sorters','Non précisée':'Not specified'};
const catL = c => lang==='en'?(CAT_EN[c]||c):c;
const levelL = l => lang==='en'?(LEVEL_EN[l]||l):l;
const statusL = s => STATUS_L[lang][s]||'';
const machineL = m => lang==='en'?(MACHINE_TR[m]||m):m;

/* ---------- TUTORIELS D'EXEMPLE ---------- */
const SEED = [
 {id:'t1',title:'Consignation avant intervention (LOTO)',machine:'Tous trieurs',category:'Sécurité',level:'Obligatoire',duration:15,
  tools:['Cadenas personnel','Étiquettes de consignation','Fiche de consignation du site'],
  safety:['Aucune intervention sans consignation complète','Procédure à adapter aux règles de consignation du site'],
  steps:[
   {text:'Prévenir le poste de conduite et arrêter l\'alimentation en verre du trieur.',warn:'',img:''},
   {text:'Arrêter la machine par la séquence d\'arrêt normale (pas par l\'arrêt d\'urgence).',warn:'',img:''},
   {text:'Ouvrir le sectionneur général électrique et poser son cadenas personnel + étiquette.',warn:'Un cadenas = une personne.',img:''},
   {text:'Isoler et purger l\'air comprimé (vanne d\'isolement fermée et cadenassée, purge du circuit).',warn:'L\'air comprimé stocke de l\'énergie : vérifier le manomètre à 0 bar.',img:''},
   {text:'Faire un essai de démarrage (VAT : Vérification d\'Absence de Tension) pour confirmer que la machine ne démarre pas.',warn:'',img:''}
  ],status:'brouillon',updated:0},
 {id:'t2',title:'Nettoyage des vitres et de la zone optique (caméras / éclairage)',machine:'Tous trieurs',category:'Nettoyage',level:'Facile',duration:30,
  tools:['Chiffons non pelucheux','Produit de nettoyage vitres validé par le constructeur','Aspirateur industriel','EPI : lunettes, gants, masque anti-poussière'],
  safety:['Machine consignée (voir tuto LOTO)','Poussières de verre : port des EPI obligatoire','Ne jamais utiliser de solvant non validé sur les optiques'],
  steps:[
   {text:'Consigner la machine (voir tutoriel « Consignation avant intervention »).',warn:'Intervention interdite sans consignation.',img:''},
   {text:'Retirer les poussières et éclats de verre à l\'aspirateur industriel autour de la zone de détection.',warn:'Ne pas souffler à l\'air comprimé : risque de projection de particules.',img:''},
   {text:'Nettoyer délicatement les vitres de protection des caméras et de l\'éclairage avec un chiffon propre et le produit adapté.',warn:'Ne pas rayer les vitres.',img:''},
   {text:'Contrôler visuellement l\'absence de traces, de buée ou de rayures.',warn:'',img:''},
   {text:'Remettre les protections en place, déconsigner, redémarrer et vérifier l\'image / les alarmes sur l\'écran.',warn:'',img:''}
  ],status:'brouillon',updated:0},
 {id:'t3',title:'Contrôle des buses d\'éjection et de l\'air comprimé',machine:'Tous trieurs',category:'Contrôle',level:'Moyen',duration:45,
  tools:['Test d\'éjection de la machine (menu maintenance)','Manomètre','Clé / outillage selon constructeur','Buses de rechange'],
  safety:['Consignation + purge d\'air avant démontage','Lunettes de protection','Test d\'éjection : zone dégagée, protections fermées'],
  steps:[
   {text:'Vérifier la pression d\'air d\'alimentation du trieur et la comparer à la valeur préconisée par le constructeur.',warn:'',img:''},
   {text:'Contrôler l\'état des filtres / purgeurs de la ligne d\'air (eau, huile).',warn:'',img:''},
   {text:'Lancer le test d\'éjection depuis le menu maintenance et repérer les buses qui ne claquent pas ou qui fuient.',warn:'Mains et outils hors de la zone d\'éjection pendant le test.',img:''},
   {text:'Consigner et purger, puis nettoyer ou remplacer les buses défaillantes.',warn:'',img:''},
   {text:'Relancer le test d\'éjection pour valider et noter l\'intervention dans la GMAO / le cahier de maintenance.',warn:'',img:''}
  ],status:'brouillon',updated:0},
 {id:'t4',title:'Contrôle du fond de référence et calibration (trame générale)',machine:'Tous trieurs',category:'Réglage / Calibration',level:'Avancé',duration:40,
  tools:['Procédure constructeur','Accès niveau maintenance sur la machine'],
  safety:['Réservé au personnel habilité','Suivre strictement la procédure du constructeur'],
  steps:[
   {text:'Vérifier que la zone optique est propre (voir tutoriel de nettoyage) avant toute calibration.',warn:'',img:''},
   {text:'Vider le tapis / la goulotte pour que rien ne passe devant les caméras pendant l\'apprentissage.',warn:'',img:''},
   {text:'Lancer la procédure de calibration depuis le menu prévu (à détailler selon votre machine).',warn:'',img:''},
   {text:'Contrôler les valeurs obtenues et les comparer aux valeurs habituelles / tolérances.',warn:'Valeur anormale : ne pas valider, prévenir le responsable maintenance.',img:''},
   {text:'Faire un test avec du verre connu et vérifier la qualité de tri (rejets / acceptés).',warn:'',img:''}
  ],status:'brouillon',updated:0}
];
/* Traductions anglaises des exemples (affichées tant qu'ils ne sont pas modifiés) */
const SEED_EN = {
 t1:{title:'Lockout / tagout before intervention (LOTO)',machine:'All sorters',
  tools:['Personal padlock','Lockout tags','Site lockout form'],
  safety:['No intervention without full lockout','Adapt the procedure to the site lockout rules'],
  steps:[
   ['Inform the control room and stop the glass feed to the sorter.',''],
   ['Stop the machine using the normal stop sequence (not the emergency stop).',''],
   ['Open the main electrical disconnect and fit your personal padlock + tag.','One padlock = one person.'],
   ['Isolate and bleed the compressed air (isolation valve closed and locked, circuit purged).','Compressed air stores energy: check the pressure gauge reads 0 bar.'],
   ['Perform a start test (zero-voltage verification) to confirm the machine does not start.','']
  ]},
 t2:{title:'Cleaning the windows and optical area (cameras / lighting)',machine:'All sorters',
  tools:['Lint-free cloths','Window cleaner approved by the manufacturer','Industrial vacuum cleaner','PPE: glasses, gloves, dust mask'],
  safety:['Machine locked out (see LOTO tutorial)','Glass dust: PPE is mandatory','Never use an unapproved solvent on the optics'],
  steps:[
   ['Lock out the machine (see the “Lockout / tagout before intervention” tutorial).','No intervention without lockout.'],
   ['Remove dust and glass splinters around the detection area with an industrial vacuum cleaner.','Do not blow with compressed air: risk of particle projection.'],
   ['Gently clean the protective windows of the cameras and lighting with a clean cloth and the suitable product.','Do not scratch the windows.'],
   ['Visually check for marks, condensation or scratches.',''],
   ['Refit the guards, remove the lockout, restart and check the image / alarms on the screen.','']
  ]},
 t3:{title:'Checking the ejection nozzles and compressed air',machine:'All sorters',
  tools:['Machine ejection test (maintenance menu)','Pressure gauge','Wrench / tools as per manufacturer','Spare nozzles'],
  safety:['Lockout + air bleed before disassembly','Safety glasses','Ejection test: clear area, guards closed'],
  steps:[
   ['Check the sorter air supply pressure and compare it with the value recommended by the manufacturer.',''],
   ['Check the condition of the air line filters / drains (water, oil).',''],
   ['Run the ejection test from the maintenance menu and identify nozzles that do not fire or that leak.','Keep hands and tools out of the ejection area during the test.'],
   ['Lock out and bleed, then clean or replace the faulty nozzles.',''],
   ['Run the ejection test again to validate and record the intervention in the CMMS / maintenance log.','']
  ]},
 t4:{title:'Checking the reference background and calibration (general outline)',machine:'All sorters',
  tools:['Manufacturer procedure','Maintenance-level access on the machine'],
  safety:['Authorised personnel only','Strictly follow the manufacturer procedure'],
  steps:[
   ['Check that the optical area is clean (see the cleaning tutorial) before any calibration.',''],
   ['Empty the belt / chute so that nothing passes in front of the cameras during learning.',''],
   ['Start the calibration procedure from the relevant menu (to be detailed for your machine).',''],
   ['Check the values obtained and compare them with the usual values / tolerances.','Abnormal value: do not validate, inform the maintenance manager.'],
   ['Run a test with known glass and check the sorting quality (rejected / accepted).','']
  ]}
};
function view(t){
  if(lang==='en' && t.updated===0 && SEED_EN[t.id]){
    const e=SEED_EN[t.id];
    return Object.assign({},t,{title:e.title,machine:e.machine,tools:e.tools,safety:e.safety,
      steps:e.steps.map((s,i)=>({text:s[0],warn:s[1],img:(t.steps[i]&&t.steps[i].img)||''}))});
  }
  return t;
}

/* ---------- ÉTAT ---------- */
let tutos = load();
let state = {view:'list', id:null, cat:'', draft:null, done:{}};

function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); if(Array.isArray(d)) return d; } }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(tutos)); }
  catch(e){ toast(T('storage_full')); }
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const uid = () => 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- LANGUE ---------- */
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>{ e.textContent=T(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{ e.placeholder=T(e.dataset.i18nPh); });
  $('bFr').classList.toggle('on',lang==='fr');
  $('bEn').classList.toggle('on',lang==='en');
  const fs=$('fStatus'), cur=fs.value;
  fs.innerHTML=`<option value="">${esc(T('all_status'))}</option>`+Object.keys(STATUS_L.fr).map(k=>`<option value="${k}" ${k===cur?'selected':''}>${esc(statusL(k))}</option>`).join('');
}
function setLang(l){
  lang=l;
  try{ localStorage.setItem(LANG_KEY,l); }catch(e){}
  $('fMachine').value='';
  applyStatic();
  if(state.view==='view' && state.id) openTuto(state.id);
  else if(state.view==='edit') renderEditor();
  else renderList();
}

/* ---------- LISTE ---------- */
function machines(){ return [...new Set(tutos.map(t=>machineL(view(t).machine)).filter(Boolean))].sort(); }
function refreshMachineFilter(){
  const sel=$('fMachine'), cur=sel.value;
  sel.innerHTML = `<option value="">${esc(T('all_machines'))}</option>`+machines().map(m=>`<option ${m===cur?'selected':''} value="${esc(m)}">${esc(m)}</option>`).join('');
}
function renderList(){
  state.view='list';
  $('filters').classList.remove('hidden');
  refreshMachineFilter();
  const q=($('q').value||'').toLowerCase(), fm=$('fMachine').value, fs=$('fStatus').value;
  const list = tutos.map(view).filter(t=>{
    if(state.cat && t.category!==state.cat) return false;
    if(fm && machineL(t.machine)!==fm) return false;
    if(fs && t.status!==fs) return false;
    if(q){
      const hay=[t.title,machineL(t.machine),catL(t.category),(t.tools||[]).join(' '),(t.steps||[]).map(s=>s.text).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const chips = [-1,...CATS.keys()].map(i=>{
    const c = i<0?'':CATS[i];
    return `<button class="chip ${state.cat===c?'on':''}" onclick="setCat(${i})">${esc(i<0?T('all'):catL(c))}</button>`;
  }).join('');
  $('app').innerHTML = `
    <div class="chips">${chips}</div>
    ${list.length?`<div class="grid">${list.map(cardHTML).join('')}</div>`:`<div class="empty">${T('none_found')}</div>`}
    <p class="disclaimer">${esc(T('footer'))}</p>`;
  window.scrollTo(0,0);
}
function cardHTML(t){
  return `<div class="card" onclick="openTuto('${t.id}')">
    <div class="row" style="justify-content:space-between"><span class="tag">${esc(catL(t.category))}</span><span class="tag ${esc(t.status)}">${esc(statusL(t.status))}</span></div>
    <h3>${esc(t.title)}</h3>
    <div class="meta"><span>${esc(machineL(t.machine))}</span><span>${esc(t.duration)} ${T('min')}</span><span>${esc(levelL(t.level))}</span><span>${T('steps_n',(t.steps||[]).length)}</span></div>
  </div>`;
}
function setCat(i){ state.cat = i<0?'':CATS[i]; renderList(); }

/* ---------- LECTURE ---------- */
function openTuto(id){
  const raw=tutos.find(x=>x.id===id); if(!raw) return;
  const t=view(raw);
  state.view='view'; state.id=id;
  if(!state.done[id]) state.done[id]=[];
  $('filters').classList.add('hidden');
  const stepsHTML=(t.steps||[]).map((s,i)=>`
    <div class="step ${state.done[id][i]?'done':''}" id="st${i}">
      <div class="num">${i+1}</div>
      <div class="body">
        <div class="txt">${esc(s.text).replace(/\n/g,'<br>')}</div>
        ${s.warn?`<div class="box danger">${esc(s.warn)}</div>`:''}
        ${s.img?`<img src="${s.img}" alt="${esc(T('step'))} ${i+1}">`:''}
        <label class="chk noprint"><input type="checkbox" ${state.done[id][i]?'checked':''} onchange="toggleStep('${id}',${i},this.checked)"> ${esc(T('step_done'))}</label>
      </div>
    </div>`).join('');
  $('app').innerHTML = `
    <div class="row noprint" style="margin:12px 0;justify-content:space-between">
      <button onclick="renderList()">${esc(T('back'))}</button>
      <div class="row">
        <button onclick="window.print()">${esc(T('print'))}</button>
        <button onclick="editTuto('${id}')">${esc(T('edit'))}</button>
      </div>
    </div>
    <div class="panel">
      <div class="row"><span class="tag">${esc(catL(t.category))}</span><span class="tag ${esc(t.status)}">${esc(statusL(t.status))}</span></div>
      <h2 style="margin:8px 0">${esc(t.title)}</h2>
      <div class="meta"><span>${esc(machineL(t.machine))}</span><span>${esc(t.duration)} ${T('min')}</span><span>${esc(levelL(t.level))}</span></div>
      ${(t.safety&&t.safety.length)?`<div class="box danger"><b>${esc(T('safety'))}</b><ul>${t.safety.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${(t.tools&&t.tools.length)?`<div class="box" style="background:transparent;color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent)"><b>${esc(T('tools'))}</b><ul>${t.tools.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><b>${esc(T('progress'))}</b><span id="pct" class="meta"></span></div>
      <div class="progress"><div id="bar"></div></div>
      ${stepsHTML||`<div class="empty">${esc(T('no_steps'))}</div>`}
    </div>`;
  updProgress(id, false);
  window.scrollTo(0,0);
}
function toggleStep(id,i,v){
  state.done[id][i]=v;
  const el=$('st'+i); if(el) el.classList.toggle('done',v);
  updProgress(id, true);
}
function updProgress(id, notify){
  const t=tutos.find(x=>x.id===id), n=(t.steps||[]).length;
  const d=(state.done[id]||[]).filter(Boolean).length;
  const p=n?Math.round(d/n*100):0;
  $('bar').style.width=p+'%';
  $('pct').textContent=T('prog',d,n,p);
  if(notify && n && d===n) toast(T('finished'));
}

/* ---------- ÉDITION ---------- */
function blankTuto(){
  return {id:uid(),title:'',machine:'',category:CATS[1],level:'Facile',duration:30,tools:[],safety:[],steps:[{text:'',warn:'',img:''}],status:'brouillon',updated:Date.now()};
}
function newTuto(){ state.draft=blankTuto(); state.isNew=true; renderEditor(); }
function editTuto(id){ state.draft=JSON.parse(JSON.stringify(view(tutos.find(t=>t.id===id)))); state.isNew=false; renderEditor(); }
function renderEditor(){
  state.view='edit';
  $('filters').classList.add('hidden');
  const d=state.draft;
  const opt=(arr,v,lab)=>arr.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(lab(x))}</option>`).join('');
  $('app').innerHTML=`
   <div class="row noprint" style="margin:12px 0;justify-content:space-between">
     <button onclick="cancelEdit()">${esc(T('cancel'))}</button>
     <div class="row">
       ${state.isNew?'':`<button class="danger" onclick="delTuto()">${esc(T('delete'))}</button>`}
       <button class="primary" onclick="saveDraft()">${esc(T('save'))}</button>
     </div>
   </div>
   <div class="panel">
     <h2 style="margin-top:0">${esc(state.isNew?T('new_title'):T('edit_title'))}</h2>
     <label>${esc(T('f_title'))}</label><input value="${esc(d.title)}" oninput="state.draft.title=this.value" placeholder="${esc(T('ph_title'))}">
     <div class="row" style="align-items:flex-start">
       <div style="flex:1;min-width:200px"><label>${esc(T('f_machine'))}</label><input list="ml" value="${esc(d.machine)}" oninput="state.draft.machine=this.value" placeholder="${esc(T('ph_machine'))}"><datalist id="ml">${machines().map(m=>`<option value="${esc(m)}">`).join('')}</datalist></div>
       <div style="flex:1;min-width:160px"><label>${esc(T('f_cat'))}</label><select onchange="state.draft.category=this.value">${opt(CATS,d.category,catL)}</select></div>
       <div style="flex:1;min-width:140px"><label>${esc(T('f_level'))}</label><select onchange="state.draft.level=this.value">${opt(LEVELS,d.level,levelL)}</select></div>
       <div style="flex:1;min-width:120px"><label>${esc(T('f_duration'))}</label><input type="number" min="1" value="${esc(d.duration)}" oninput="state.draft.duration=this.value"></div>
       <div style="flex:1;min-width:140px"><label>${esc(T('f_status'))}</label><select onchange="state.draft.status=this.value">${opt(Object.keys(STATUS_L.fr),d.status,statusL)}</select></div>
     </div>
     <label>${esc(T('f_safety'))}</label>
     <textarea oninput="state.draft.safety=lines(this.value)">${esc((d.safety||[]).join('\n'))}</textarea>
     <label>${esc(T('f_tools'))}</label>
     <textarea oninput="state.draft.tools=lines(this.value)">${esc((d.tools||[]).join('\n'))}</textarea>
   </div>
   <div class="panel">
     <div class="row" style="justify-content:space-between"><b>${esc(T('steps'))}</b><button onclick="addStep()">${esc(T('add_step'))}</button></div>
     <div id="stepsEd"></div>
   </div>`;
  renderStepsEditor();
  window.scrollTo(0,0);
}
const lines = v => v.split('\n').map(s=>s.trim()).filter(Boolean);
function renderStepsEditor(){
  $('stepsEd').innerHTML = state.draft.steps.map((s,i)=>`
   <div class="edit-step">
     <div class="row" style="justify-content:space-between"><b>${esc(T('step'))} ${i+1}</b>
       <div class="row">
         <button class="small" onclick="moveStep(${i},-1)" ${i===0?'disabled':''}>↑</button>
         <button class="small" onclick="moveStep(${i},1)" ${i===state.draft.steps.length-1?'disabled':''}>↓</button>
         <button class="small danger" onclick="delStep(${i})">${esc(T('remove'))}</button>
       </div></div>
     <label>${esc(T('f_instr'))}</label>
     <textarea oninput="state.draft.steps[${i}].text=this.value" placeholder="${esc(T('ph_instr'))}">${esc(s.text)}</textarea>
     <label>${esc(T('f_warn'))}</label>
     <input value="${esc(s.warn)}" oninput="state.draft.steps[${i}].warn=this.value">
     <label>${esc(T('f_photo'))}</label>
     <div class="row">
       <input type="file" accept="image/*" style="max-width:320px" onchange="addPhoto(${i},this)">
       ${s.img?`<button class="small danger" onclick="rmPhoto(${i})">${esc(T('rm_photo'))}</button>`:''}
     </div>
     ${s.img?`<img src="${s.img}" alt="" style="max-width:220px;border-radius:8px;margin-top:8px">`:''}
   </div>`).join('');
}
function addStep(){ state.draft.steps.push({text:'',warn:'',img:''}); renderStepsEditor(); }
function delStep(i){ if(state.draft.steps.length<=1){ state.draft.steps=[{text:'',warn:'',img:''}]; } else state.draft.steps.splice(i,1); renderStepsEditor(); }
function moveStep(i,dir){ const a=state.draft.steps, j=i+dir; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; renderStepsEditor(); }
function rmPhoto(i){ state.draft.steps[i].img=''; renderStepsEditor(); }
function addPhoto(i,input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=800, k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      state.draft.steps[i].img=c.toDataURL('image/jpeg',0.7);
      renderStepsEditor();
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
function saveDraft(){
  const d=state.draft;
  if(!d.title.trim()){ toast(T('need_title')); return; }
  if(!d.machine.trim()) d.machine='Non précisée';
  d.steps=d.steps.filter(s=>s.text.trim()||s.img);
  d.updated=Date.now();
  const i=tutos.findIndex(t=>t.id===d.id);
  if(i>=0) tutos[i]=d; else tutos.unshift(d);
  save(); toast(T('saved')); openTuto(d.id);
}
function cancelEdit(){ if(state.isNew) renderList(); else openTuto(state.draft.id); }
function delTuto(){
  if(!confirm(T('confirm_del'))) return;
  tutos=tutos.filter(t=>t.id!==state.draft.id); save(); toast(T('deleted')); renderList();
}

/* ---------- EXPORT / IMPORT ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(tutos,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='tutos-maintenance-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(T('export_started'));
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d)) throw 0;
      let n=0;
      d.forEach(t=>{
        if(!t||!t.title||!Array.isArray(t.steps)) return;
        t.id=t.id&&!tutos.some(x=>x.id===t.id)?t.id:uid();
        t.tools=t.tools||[]; t.safety=t.safety||[]; t.status=STATUS_L.fr[t.status]?t.status:'brouillon';
        tutos.push(t); n++;
      });
      save(); renderList(); toast(T('imported',n));
    }catch(e){ toast(T('invalid')); }
    ev.target.value='';
  };
  r.readAsText(f);
}

applyStatic();
renderList();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
