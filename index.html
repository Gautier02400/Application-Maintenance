<!--
============================================================================
 TUTOS MAINTENANCE - TRIEURS OPTIQUES VERRE (Sibelco Reims)
 Guide de lecture du fichier index.html
============================================================================
 C'est une application web "tout-en-un" (PWA) : TOUT le code est dans CE fichier.
 Elle fonctionne sans serveur et sans base de données : les données sont gardées
 dans le navigateur de chaque appareil.

 FICHIERS DU PROJET (à mettre ensemble dans le même dossier) :
   index.html            -> ce fichier : page, styles (CSS) et programme (JavaScript)
   sw.js                 -> "service worker" : garde l'appli en cache pour qu'elle marche hors connexion
   manifest.webmanifest  -> carte d'identité de l'appli (nom, couleurs, icônes) pour l'installer comme une appli
   icon-192.png / icon-512.png -> logo Sibelco : icône de l'appli ET logo en haut à gauche
   fond-verre.jpg        -> (facultatif) photo de fond ; si le fichier existe il remplace le motif de verre

 LES 3 PARTIES DE CE FICHIER :
   1. la balise style : l'apparence (couleurs, cartes, boutons, menu, mode sombre...)
   2. la balise body  : la structure fixe (bandeau du haut, menu latéral, zone #app)
   3. la balise script: le cerveau. Il "dessine" les pages en remplissant la zone #app.

 OU SONT STOCKEES LES DONNEES (dans le navigateur, par appareil) :
   localStorage  : tutoriels, fiches, comptes, scores, langue, thème, menu épinglé
   IndexedDB     : les gros fichiers (PDF et PowerPoint ajoutés aux fiches)
   => Pour partager des tutoriels entre appareils : bouton Exporter / Importer (fichier .json).
   => Vider les données du navigateur efface tout : pensez à exporter régulièrement.

 COMMENT SONT FAITES LES ILLUSTRATIONS (résumé, détails plus bas dans le code) :
   a) Les pictogrammes (bouteille, clé, livre...) sont des petits dessins SVG
      (de simples traits) définis dans la liste "const ICO" du script.
   b) Les fonds colorés des tuiles/cartes sont des dégradés CSS (classes ".cover.c-xxx").
   c) Les photos que vous ajoutez vous-même sont réduites puis stockées dans la fiche.
   d) Les pièces du jeu "Trieur" sont dessinées au pinceau (canvas) dans la fonction gItem.
   e) Le motif de verre en filigrane sur le fond est un SVG intégré dans le CSS.
   f) LE LOGO 3D (globe qui tourne) est dessiné par le code dans un canvas : voir "LOGO_CFG" dans le script (section 4, vers
      la fin) pour régler vitesse, taille, éclatement, nombre de triangles, anneau... et LOGO_COL / RING_COL pour les couleurs.
      Pour l'afficher à un nouvel endroit : ajouter <div class="logo3d"></div> dans une page, il devient un globe tout seul.
   g) Les nouveautés visuelles (dégradés, animations, carte d'accueil "hero", fenêtre du logo, confettis) sont regroupées :
      CSS -> bloc "SIBELCO 2.0" à la fin de la balise style ; JS -> section 4 à la fin du script.
============================================================================
-->

 apple-touch-icon = icône utilisée sur iPhone/iPad.

/*
 ===================== 1. APPARENCE (CSS) =====================
 Toute la feuille de style est dans la balise style. Les couleurs sont stockées dans des "variables"
 (--bg, --card, --text...) : pour changer une couleur dans TOUTE l'appli, on change la variable.

 VARIABLES DE COULEUR (thème CLAIR par défaut).
   --bg     : fond de la page          --card  : fond des cartes / panneaux
   --text   : couleur du texte         --muted : texte secondaire (gris)
   --line   : traits et bordures       --brand : bleu foncé du bandeau et du menu
   --accent : bleu des boutons         --ok    : vert (validé / étape faite)
   --warn-* : encadrés jaunes d'avertissement   --danger-* : encadrés rouges de sécurité
 Les 3 premières lignes (box-sizing, padding-top/bottom) servent à laisser la place
 aux encoches / barres système des téléphones (safe-area).
*/
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f5f9;--card:#ffffff;--text:#1b2733;--muted:#5d6b78;--line:#dbe1e7;
  --brand:#0a2f5a;--accent:#0a5aa8;--accent-text:#ffffff;--ok:#1a8a4a;--warn-bg:#fff4d6;--warn-line:#e0a800;--warn-text:#5c4300;
  --danger-bg:#fde8e8;--danger-line:#d33;--danger-text:#7a1414;
}
/*
 THEME SOMBRE AUTOMATIQUE : si l'appareil est en mode sombre, on redéfinit les variables.
 ":root:not([data-theme="light"])" = "sauf si l'utilisateur a forcé le thème clair".
*/
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c;--card:#19222b;--text:#e8edf2;--muted:#9aa9b6;--line:#2c3a47;
    --brand:#0a2540;--accent:#5aaeea;--accent-text:#04121f;--ok:#4cc57f;--warn-bg:#3a2f0b;--warn-line:#c99a00;--warn-text:#ffe29a;
    --danger-bg:#3d1717;--danger-line:#e66;--danger-text:#ffb3b3;
  }
}
/*
 THEME SOMBRE FORCE : appliqué quand l'utilisateur choisit "Sombre" dans Paramètres
 (le script ajoute l'attribut data-theme="dark" sur la balise <html>, voir applyTheme()).
*/
:root[data-theme="dark"]{
  --bg:#10161c;--card:#19222b;--text:#e8edf2;--muted:#9aa9b6;--line:#2c3a47;
  --brand:#0a2540;--accent:#5aaeea;--accent-text:#04121f;--ok:#4cc57f;--warn-bg:#3a2f0b;--warn-line:#c99a00;--warn-text:#ffe29a;
  --danger-bg:#3d1717;--danger-line:#e66;--danger-text:#ffb3b3;
}
/*
 --- Base de la page : police système, fond, texte, bandeau fixe en haut (header) ---
*/
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
header{background:var(--brand);color:#fff;border-bottom:3px solid #2d8fe0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{font-size:1.15rem;margin:0}
h1 small{display:block;font-weight:400;color:#c5d6ea;font-size:.8rem}
header button.primary,header .lang button.on{background:#2d8fe0;border-color:#2d8fe0;color:#fff}
/*
 --- Boutons : un style commun ; .primary = bouton bleu plein ; .danger = rouge ; .small = petit ---
*/
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger-line);border-color:var(--danger-line)}
button.small{padding:4px 8px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:640px){.filters{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border-radius:999px;padding:4px 12px;font-size:.85rem}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
/*
 --- Grille de cartes (liste des tutoriels et des fiches) : autant de colonnes que la place le permet ---
*/
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:1rem}
.meta{color:var(--muted);font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.valide{color:var(--ok);border-color:var(--ok)}
.tag.avalider{color:var(--warn-line);border-color:var(--warn-line)}
/*
 --- .panel = grand bloc blanc arrondi ; .box = encadré jaune (attention) ; .box.danger = encadré rouge (sécurité) ---
*/
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.box{border-left:4px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-text);padding:10px 12px;border-radius:6px;margin:10px 0}
.box.danger{border-left-color:var(--danger-line);background:var(--danger-bg);color:var(--danger-text)}
.box ul{margin:4px 0 0 18px;padding:0}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .2s}
/*
 --- Étapes d'un tutoriel : rond numéroté .num + texte. Classe .done = étape cochée (rond vert, texte barré) ---
*/
.step{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700}
.step.done .num{background:var(--ok)}
.step.done .txt{color:var(--muted);text-decoration:line-through}
.step .body{flex:1;min-width:0}
.step img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
.step label.chk{display:flex;gap:8px;align-items:center;margin:8px 0 0;color:var(--muted);cursor:pointer}
.step input[type=checkbox]{width:20px;height:20px;padding:0}
.edit-step{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--bg)}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.disclaimer{font-size:.8rem;color:var(--muted);margin-top:24px}
.lang{display:flex}
.lang button{border-radius:0;padding:8px 10px;font-size:.85rem}
.lang button:first-child{border-radius:8px 0 0 8px}
.lang button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.lang button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
/*
 --- IMPRESSION / PDF : on cache le menu, le bandeau et les boutons pour n'imprimer que le contenu ---
*/
@media print{
  header,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000}
  .panel,.card{border-color:#999}
}
/*
 --- Logo Sibelco en haut à gauche : fichier icon-512.png, fond blanc pour rester lisible sur le bandeau bleu ---
*/
.brand{display:flex;align-items:center;gap:12px}
.logo{height:40px;width:auto;background:#fff;padding:4px 8px;border-radius:6px}

/*
 ILLUSTRATION : MOTIF DE VERRE EN FILIGRANE SUR LE FOND
 Le fond de page est un petit SVG (bouteille, pot, verre...) répété en mosaïque.
 Il est écrit directement dans le CSS sous forme d'adresse "data:image/svg+xml,..." :
   - il n'y a donc AUCUN fichier image à fournir ;
   - dans cette adresse, certains caractères sont codés : %3C = "<", %3E = ">", %22 = guillemet, %23 = "#" ;
   - la couleur des traits est stroke=%230a5aa8 (= #0a5aa8) et la transparence stroke-opacity=0.10 ;
   - width/height=240 = taille d'une tuile du motif ; chaque <g transform="translate(x y)"> = un objet placé.
 POUR CHANGER : modifiez la couleur (%230a5aa8), l'opacité (0.10 = discret, 0.25 = marqué),
 ou remplacez les <path> par d'autres dessins. Le mode sombre a sa propre copie du motif (plus bas).
 Astuce : pour retirer le motif, supprimez simplement la règle body::before.
*/
/* Décor : motifs de verre (bouteille, pot, verre) en filigrane sur le fond */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22 viewBox=%220 0 240 240%22 fill=%22none%22 stroke=%22%230a5aa8%22 stroke-opacity=%220.10%22 stroke-width=%222%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22%3E%3Cg transform=%22translate%2830 20%29%22%3E%3Cpath d=%22M20 0h10v8c0 6 10 12 10 28v62a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6V36C10 20 20 14 20 8z%22/%3E%3Cpath d=%22M14 56h22M14 78h22%22/%3E%3C/g%3E%3Cg transform=%22translate%28140 30%29%22%3E%3Cpath d=%22M6 0h38v10H6z%22/%3E%3Cpath d=%22M10 10h30c4 6 6 12 6 22v40a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8V32c0-10 2-16 6-22z%22/%3E%3C/g%3E%3Cg transform=%22translate%2870 140%29%22%3E%3Cpath d=%22M10 0h30c0 22-4 36-15 40C14 36 10 22 10 0z%22/%3E%3Cpath d=%22M25 40v36M12 76h26%22/%3E%3C/g%3E%3Cg transform=%22translate%28200 150%29 rotate%2825%29%22%3E%3Cpath d=%22M10 0h8v6c0 5 8 9 8 22v46a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V28C2 15 10 11 10 6z%22/%3E%3C/g%3E%3Ccircle cx=%2220%22 cy=%22190%22 r=%225%22/%3E%3Ccircle cx=%22125%22 cy=%22105%22 r=%224%22/%3E%3Ccircle cx=%22215%22 cy=%2295%22 r=%226%22/%3E%3Cpath d=%22M105 215l10-12 8 10zM180 225l7-10 9 6z%22/%3E%3C/svg%3E");background-size:240px 240px}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body::before{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22 viewBox=%220 0 240 240%22 fill=%22none%22 stroke=%22%235aaeea%22 stroke-opacity=%220.12%22 stroke-width=%222%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22%3E%3Cg transform=%22translate%2830 20%29%22%3E%3Cpath d=%22M20 0h10v8c0 6 10 12 10 28v62a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6V36C10 20 20 14 20 8z%22/%3E%3Cpath d=%22M14 56h22M14 78h22%22/%3E%3C/g%3E%3Cg transform=%22translate%28140 30%29%22%3E%3Cpath d=%22M6 0h38v10H6z%22/%3E%3Cpath d=%22M10 10h30c4 6 6 12 6 22v40a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8V32c0-10 2-16 6-22z%22/%3E%3C/g%3E%3Cg transform=%22translate%2870 140%29%22%3E%3Cpath d=%22M10 0h30c0 22-4 36-15 40C14 36 10 22 10 0z%22/%3E%3Cpath d=%22M25 40v36M12 76h26%22/%3E%3C/g%3E%3Cg transform=%22translate%28200 150%29 rotate%2825%29%22%3E%3Cpath d=%22M10 0h8v6c0 5 8 9 8 22v46a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V28C2 15 10 11 10 6z%22/%3E%3C/g%3E%3Ccircle cx=%2220%22 cy=%22190%22 r=%225%22/%3E%3Ccircle cx=%22125%22 cy=%22105%22 r=%224%22/%3E%3Ccircle cx=%22215%22 cy=%2295%22 r=%226%22/%3E%3Cpath d=%22M105 215l10-12 8 10zM180 225l7-10 9 6z%22/%3E%3C/svg%3E")}
}
@media print{body::before{display:none}}

/*
 ILLUSTRATION : PHOTO DE FOND (facultative)
 Le script (dernières lignes) essaie de charger "fond-verre.jpg". Si le fichier existe, il ajoute la classe
 "photo" sur <html> et cette règle prend le dessus sur le motif. Le dégradé rgba(...,.88) est un "voile" blanc
 (ou sombre) à 88 % posé sur la photo pour que le texte reste lisible : baissez .88 pour voir plus la photo.
 POUR CHANGER LA PHOTO : remplacez simplement le fichier fond-verre.jpg (même nom) dans le dossier.
*/
/* Photo de fond : si le fichier fond-verre.jpg existe, il remplace le motif (voile = lisibilité) */
html.photo body::before{background-image:linear-gradient(rgba(242,245,249,.88),rgba(242,245,249,.88)),url("fond-verre.jpg");background-size:cover;background-position:center}
@media (prefers-color-scheme: dark){
  html.photo:not([data-theme="light"]) body::before{background-image:linear-gradient(rgba(16,22,28,.88),rgba(16,22,28,.88)),url("fond-verre.jpg")}
}

/*

/* Menu latéral + classes */

#clstip{position:fixed;z-index:60;display:none;width:min(340px,calc(100vw - 16px));background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.35);padding:8px;font-size:.82rem;line-height:1.35;pointer-events:none}
#clstip .cttl{font-weight:700;padding:2px 6px 6px}
#clstip .ctr{padding:6px;border-radius:7px}
#clstip .ctr.me{background:rgba(45,143,224,.18);outline:1px solid #2d8fe0}
#clstip .ctr .d{color:var(--muted);margin-top:3px}
#clstip .ctr .cls{font-size:.72rem;cursor:inherit}
#clstip .ctr .you{font-size:.72rem;margin-left:6px;color:var(--accent)}
@media print{#clstip{display:none!important}}
/*
 ILLUSTRATIONS DES CARTES ET TUILES (zone .cover)
 Chaque carte/tuile a en haut un bandeau ".cover" de proportion fixe (aspect-ratio 2/1).
 Il peut contenir 2 choses :
   1) une PHOTO (<img>) : elle remplit tout le bandeau (object-fit:cover = recadrée sans déformation) ;
   2) à défaut, un PICTOGRAMME <svg> blanc semi-transparent (34 % de la taille), posé sur un dégradé de couleur.
 Le bandeau de base est un dégradé bleu (linear-gradient 135deg, #0a2f5a -> #2d8fe0).
 Pour changer la taille du pictogramme : width/height de ".card .cover svg" ;
 son épaisseur de trait : stroke-width ; sa transparence : stroke-opacity.
*/
/* Cartes de tutoriel avec image d'illustration */
.card.tcard{overflow:hidden}
.card .cover{margin:-14px -14px 4px;aspect-ratio:2/1;overflow:hidden;background:linear-gradient(135deg,#0a2f5a,#2d8fe0);display:grid;place-items:center}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .cover svg{width:34%;height:34%;stroke:#fff;stroke-opacity:.6;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.tcover{width:100%;max-height:320px;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block}

/*
 COULEUR DU FOND DE CHAQUE ILLUSTRATION
 Le script écrit class="cover c-xxx" où xxx = nom de la rubrique ou du jeu (constructeur, consommables,
 presentation, quiz, link, vf, order...). Chaque ligne ci-dessous donne le dégradé de cette rubrique.
 POUR CHANGER UNE COULEUR : modifiez les 2 codes couleur (#12385e = début, #3aa0c9 = fin).
 POUR AJOUTER UNE NOUVELLE RUBRIQUE / UN NOUVEAU JEU : ajoutez une ligne ".cover.c-monnom{background:linear-gradient(135deg,#xxxxxx,#yyyyyy)}"
 (outil pratique pour choisir des couleurs : n'importe quel "color picker" en ligne).
*/
/* Dégradés des illustrations par rubrique / jeu (la couleur change selon c-xxx) */
.cover.c-constructeur{background:linear-gradient(135deg,#12385e,#3aa0c9)}
.cover.c-consommables{background:linear-gradient(135deg,#0f5c4d,#2fb59a)}
.cover.c-presentation{background:linear-gradient(135deg,#4a2a7a,#9a6be0)}
.cover.c-jeux,.cover.c-order{background:linear-gradient(135deg,#8a3b12,#e8943a)}
.cover.c-quiz{background:linear-gradient(135deg,#7a1f4a,#e0638a)}
.cover.c-link{background:linear-gradient(135deg,#0f5c4d,#2fb59a)}
.cover.c-vf{background:linear-gradient(135deg,#1a6b3a,#4cc57f)}
.tiles .card .cover{aspect-ratio:5/2}
/*
 --- Jeux : .qopt = bouton de réponse (vert .good / rouge .bad après réponse), .lkit = élément du jeu Relier,
     .ordlist = liste des étapes remises dans l'ordre ---
*/
/* Jeux : quiz, vrai/faux, mémoire, remettre dans l'ordre */
.qbar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.qbar>div{height:100%;background:var(--accent);transition:width .1s linear}
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
.qopt.good{border-color:var(--ok);background:rgba(26,138,74,.2)}
.qopt.bad{border-color:var(--danger-line);background:var(--danger-bg);color:var(--danger-text)}
.qopt:disabled{opacity:1;cursor:default}
.lkbox{position:relative;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(58px,auto);gap:10px clamp(34px,11vw,90px);max-width:640px;margin:0 auto}
.lksvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lkit{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:8px 10px;border-width:2px;font-size:.85rem;line-height:1.25;word-break:break-word;hyphens:auto}
.lkit .me{font-size:1.4rem;flex:none}
.lkit.sel{border-color:#2d8fe0;box-shadow:0 0 0 3px rgba(45,143,224,.35)}
.lkit.ok{background:rgba(26,138,74,.22);border-color:var(--ok)}
.lkit.ko{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger-text)}
.lkit:disabled{opacity:1;cursor:default}
.ordlist{margin:8px 0;padding-left:0;list-style-position:inside}
.ordlist li{background:rgba(26,138,74,.16);border-left:4px solid var(--ok);padding:6px 8px;margin:4px 0;border-radius:4px}
/*
 --- Affichage d'un PDF dans une fiche : chaque page est dessinée dans un <canvas> (voir showPdf) ---
*/
/* PDF affiché en entier (toutes les pages, sans cadre défilant) */
.pdfpages{display:flex;flex-direction:column;gap:10px;align-items:center}
.pdfpg{width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.18)}
.pdfpg canvas{width:100%;height:auto;display:block;border-radius:6px}
/* Aperçu PowerPoint (fiches de présentation) : miniature + une carte de texte par diapositive */
.pptthumb{max-width:420px;width:100%;border-radius:8px;border:1px solid var(--line);display:block;margin:8px 0}
.pptslide{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--bg)}
.pptslide b{display:block;font-size:.78rem;color:var(--muted);margin-bottom:2px}
/* Menu ouvert non épinglé : le bouton ☰ garde sa place (invisible) pour que le titre ne bouge pas ; il disparaît vraiment seulement quand le cadenas est coché */
body.nav-open .menu-btn{visibility:hidden}
/* Ecran large : menu ouvert (épinglé ou non) -> le bouton ☰ disparaît et le titre se décale vers la droite pour rester visible */
@media(min-width:781px){
  body.nav-open .menu-btn{display:none!important}
  /* menu ouvert (épinglé ou non) : toute la page (titre + contenu) se décale pour rester visible */
  body.nav-open{padding-left:200px}
}
/* Téléphone : le menu ouvert pousse la page vers la droite (sans l'écraser) */
@media(max-width:780px){
  html{overflow-x:hidden}
  header,#toolbar,#app{transition:transform .2s}
  body.nav-open header,body.nav-open #toolbar,body.nav-open #app{transform:translateX(200px)}
}
/* Barre d'outils SOUS le bandeau : boutons Nouveau / Exporter / Importer + recherche + filtres */
#toolbar .wrap{padding-bottom:0}
#toolbar .actions{display:flex;gap:8px;flex-wrap:wrap}
#toolbar:has(#actions.hidden):has(#filters.hidden){display:none}
header .brand>span{min-width:0}
/* ===== TELEPHONE ===== */
@media(max-width:640px){
  header .top{flex-wrap:nowrap;gap:8px}
  header h1.brand{flex:1;min-width:0}
  header .brand>span{overflow:hidden}
  header h1,header.big h1{font-size:.9rem}
  header h1 small,header.big h1 small{font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toolbar .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #toolbar .actions .tbtn{width:100%;padding:8px 10px;font-size:.85rem}
  #toolbar .actions .tbtn.primary{grid-column:1/-1}
  #toolbar .filters{grid-template-columns:1fr 1fr;gap:6px}
  #toolbar .filters #q{grid-column:1/-1}
  #toolbar .filters select{min-width:0;text-overflow:ellipsis}
  header:not(.big){position:static}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .wrap{padding-left:12px;padding-right:12px}
  header .wrap{padding-left:10px;padding-right:10px}
}
@media(max-width:380px){header h1 small,header.big h1 small{display:none}}
/*
 --- body.nolog : appliquée quand personne n'est connecté -> on cache menu et bandeau, il ne reste que l'écran de connexion ---
*/
body.nolog{padding-left:0!important}body.nolog #side,body.nolog header,body.nolog #toolbar,body.nolog #scrim{display:none!important}

/*
 ============================================================================
 ===================== SIBELCO 2.0 : DESIGN MODERNE (NOUVEAU) =====================
 Cette partie AJOUTE du style par-dessus l'existant (rien n'est supprimé plus haut) :
 dégradés, ombres douces, animations d'apparition, effets au survol, logo 3D, accueil "hero".
 Pour désactiver un effet : supprimez simplement le bloc concerné.
 Les animations s'arrêtent automatiquement si l'appareil demande "réduire les animations".
 ============================================================================
*/
:root{--shadow:0 4px 18px rgba(10,47,90,.09);--shadow-hi:0 16px 36px rgba(10,47,90,.20);--ease:cubic-bezier(.2,.7,.2,1)}
:root[data-theme="dark"]{--shadow:0 4px 18px rgba(0,0,0,.35);--shadow-hi:0 16px 36px rgba(0,0,0,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 4px 18px rgba(0,0,0,.35);--shadow-hi:0 16px 36px rgba(0,0,0,.5)}}
::selection{background:#2d8fe0;color:#fff}
html{scroll-behavior:smooth}
:focus-visible{outline:3px solid #2d8fe0;outline-offset:2px;border-radius:6px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,143,224,.28)}
*{scrollbar-width:thin;scrollbar-color:#2d8fe0 transparent}

/* Bandeau et menu : dégradé bleu Sibelco + liseré lumineux */
header{background:linear-gradient(100deg,#071f3a 0%,#0a2f5a 45%,#0c4a8e 100%);box-shadow:0 4px 18px rgba(8,37,68,.35)}
header .logo{transition:transform .35s var(--ease),box-shadow .35s;box-shadow:0 2px 8px rgba(0,0,0,.25)}
header .logo:hover{transform:rotateY(360deg) scale(1.06)}
header a{perspective:300px}
#side{background:linear-gradient(180deg,#0a2f5a,#071f3a);border-right:0}
#side .nb{transition:background .15s,transform .15s}
#side .nb:hover{transform:translateX(3px)}
#side .nb.on{background:linear-gradient(90deg,#2d8fe0,#4aa6f0);box-shadow:0 2px 10px rgba(45,143,224,.45)}

/* Boutons */
button{transition:transform .12s,box-shadow .2s,border-color .2s,background .2s;position:relative;overflow:hidden}
button:hover{box-shadow:0 2px 10px rgba(10,90,168,.18)}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--accent),#2d8fe0);border-color:transparent}
button.primary:hover{box-shadow:0 4px 16px rgba(45,143,224,.5);filter:brightness(1.06)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
a.btn.primary{background:linear-gradient(135deg,var(--accent),#2d8fe0);color:var(--accent-text);padding:8px 16px;border-radius:8px;font-weight:600}

/* Cartes et panneaux */
.panel{border-radius:16px;box-shadow:var(--shadow)}
.card{border-radius:16px;box-shadow:var(--shadow);transition:transform .22s var(--ease),box-shadow .22s,border-color .22s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi)}
.card:active{transform:translateY(-1px)}
.card .cover{position:relative}
.card .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
.card:hover .cover::after{transform:translateX(120%)}
.card .cover svg{transition:transform .35s var(--ease)}
.card:hover .cover svg{transform:scale(1.18) rotate(-4deg)}
.progress{height:10px}
.progress>div{background:linear-gradient(90deg,#1a8a4a,#4cc57f);transition:width .45s var(--ease)}
.chip{transition:transform .12s,background .2s}
.chip:hover{transform:translateY(-1px)}
.step{transition:background .2s}
.num{box-shadow:0 2px 8px rgba(10,90,168,.35);transition:transform .25s var(--ease),background .25s}
.step.done .num{transform:scale(1.08);box-shadow:0 2px 8px rgba(26,138,74,.4)}
.toast{border-radius:999px;padding:10px 20px;box-shadow:var(--shadow-hi);transition:opacity .25s,transform .25s;transform:translate(-50%,10px)}
.toast.show{transform:translate(-50%,0)}

/* Apparition douce des pages (le contenu "monte" légèrement) */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#app>*{animation:rise .45s var(--ease) backwards}
#app>*:nth-child(2){animation-delay:.05s}#app>*:nth-child(3){animation-delay:.1s}#app>*:nth-child(4){animation-delay:.15s}#app>*:nth-child(n+5){animation-delay:.2s}
.tiles .card,.grid .card{animation:rise .5s var(--ease) backwards}
.tiles .card:nth-child(2),.grid .card:nth-child(2){animation-delay:.06s}.tiles .card:nth-child(3),.grid .card:nth-child(3){animation-delay:.12s}
.tiles .card:nth-child(4),.grid .card:nth-child(4){animation-delay:.18s}.tiles .card:nth-child(5),.grid .card:nth-child(5){animation-delay:.24s}
.tiles .card:nth-child(n+6),.grid .card:nth-child(n+6){animation-delay:.3s}

/* ===== LOGO 3D : mise en page autour du canvas =====
 .logo3d = le cadre carré (240 px max) qui contient le dessin 3D ; changez "240px" pour agrandir/réduire PARTOUT.
 .logo3d.big = taille dans la fenêtre agrandie ; .shadow = ombre ovale sous le globe ; .hint = "Cliquez ou faites glisser".
 .wordmark = le texte SIBELCO sous le globe (du vrai texte, pas une image : dégradé bleu, police Arial Black).
 touch-action:pan-y = sur téléphone, glisser le doigt vers le haut/bas fait défiler la page, vers la gauche/droite tourne le logo. */

.logo3d{position:relative;width:min(240px,100%);aspect-ratio:1;margin:0 auto 20px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;-webkit-tap-highlight-color:transparent;border-radius:50%}
.logo3d:active{cursor:grabbing}
.logo3d:focus-visible{outline-offset:-6px}
.logo3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.logo3d .shadow{position:absolute;left:24%;right:24%;bottom:8%;height:6%;background:radial-gradient(closest-side,rgba(10,47,90,.38),transparent);pointer-events:none;animation:floaty 4.5s ease-in-out infinite}
.logo3d .hint{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:.72rem;color:var(--muted);pointer-events:none;transition:opacity .5s;animation:blink 2.6s ease-in-out infinite}
.logo3d .hint.gone{opacity:0;animation:none}
.logo3d.big{width:min(78vw,380px)}
@keyframes floaty{50%{transform:scaleX(.85);opacity:.7}}
@keyframes blink{50%{opacity:.45}}
.wordmark{font-family:"Arial Black","Segoe UI Black","Segoe UI",system-ui,sans-serif;font-weight:900;font-size:2.1rem;letter-spacing:.06em;text-align:center;line-height:1;margin-top:2px;
  background:linear-gradient(180deg,#0a4f9e,#0a2f5a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
:root[data-theme="dark"] .wordmark{background:linear-gradient(180deg,#8fd0ff,#3d9be0);-webkit-background-clip:text;background-clip:text}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wordmark{background:linear-gradient(180deg,#8fd0ff,#3d9be0);-webkit-background-clip:text;background-clip:text}}
.wordmark.sm{font-size:1.35rem}

/* Accueil : grande carte de bienvenue avec le logo 3D */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:14px;align-items:center;overflow:hidden;padding:18px 22px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(380px 260px at 88% 45%,rgba(45,143,224,.22),transparent 70%),radial-gradient(300px 200px at 0% 0%,rgba(45,143,224,.10),transparent 70%);pointer-events:none}
.hero>*{position:relative}
.hero h2{font-size:1.5rem!important;margin-bottom:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{background:rgba(45,143,224,.12);border:1px solid rgba(45,143,224,.35);border-radius:12px;padding:6px 12px;font-size:.82rem;color:var(--muted)}
.stat b{display:block;font-size:1.35rem;line-height:1.1;color:var(--accent)}

<!--

 puis la barre de recherche et les filtres.
 Les textes "data-i18n" sont remplis par le script selon la langue (voir I18N plus bas).
 "noprint" = élément caché à l'impression.
-->
<header class="noprint">
  <div class="wrap">
    <div class="top">
      <button class="menu-btn" onclick="toggleNav()" aria-label="Menu"><svg viewBox="0 0 24 24" width="1.6em" height="1.6em" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="display:block"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 class="brand">

        </div>
      </div>
    </div>
  </div>
</header>
<!-- BARRE D'OUTILS (sous le bandeau) : Nouveau / Exporter / Importer, recherche et filtres. Affichée uniquement dans "Tutos maintenance" (voir buildNav et renderList). -->
<div id="toolbar" class="noprint">
  <div class="wrap">
    <div class="actions" id="actions">
      <button class="primary tbtn" onclick="newTuto()" data-i18n="new"></button>

</div>

<!--

<!--

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--

*/

const MACHINE_TR = {'Tous trieurs':'All sorters','Non précisée':'Not specified'};

const levelL = l => lang==='en'?(LEVEL_EN[l]||l):l;
const statusL = s => STATUS_L[lang][s]||'';

*/

*/

 {id:'t4',title:'Calibration du trieur (trame générale)',machine:'Tous trieurs',category:'Réglage / Calibration',level:'Avancé',duration:40,

/*
 view(t) = renvoie la version du tutoriel à AFFICHER dans la langue courante (traduction des exemples non modifiés).
*/
function view(t){
  if(lang==='en' && t.updated===0 && SEED_EN[t.id]){
    const e=SEED_EN[t.id];
    return Object.assign({},t,{title:e.title,machine:e.machine,tools:e.tools,safety:e.safety,
      steps:e.steps.map((s,i)=>({text:s[0],warn:s[1],img:(t.steps[i]&&t.steps[i].img)||''}))});
  }
  return t;
}

/*
 ETAT DE L'APPLICATION
   tutos = la liste des tutoriels en mémoire (chargée depuis le localStorage)
   state = où l'on se trouve : view (page), section (rubrique du menu), id (tutoriel ouvert),
           cat (filtre catégorie), draft (tutoriel en cours d'édition), done (étapes cochées)
*/
/* ---------- ÉTAT ---------- */
let tutos = load(); if(!tutos.some(t=>t.id==='tobl')) tutos.unshift(JSON.parse(JSON.stringify(TOBL)));
let state = {view:'home', section:'home', id:null, cat:'', draft:null, done:{}};

/*
 load() : relit les tutoriels enregistrés ; s'il n'y en a pas (premier lancement), prend une copie de SEED.
*/
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const d = JSON.parse(r); if(Array.isArray(d)) return d; } }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
/*
 save() : enregistre la liste des tutoriels dans le localStorage (message d'erreur si le stockage est plein :
 les photos prennent de la place, d'où l'intérêt d'exporter en .json).
*/
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(tutos)); }
  catch(e){ toast(T('storage_full')); }
}
/*
 PETITS OUTILS
   esc(texte)  protège le texte avant de l'insérer dans la page (empêche d'injecter du HTML par erreur)
   $('id')     raccourci pour document.getElementById('id')
   uid()       fabrique un identifiant unique (date + hasard)
   toast(msg)  affiche la petite bulle de message en bas de l'écran pendant 2,6 secondes
*/
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const uid = () => 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

/*
 applyStatic() remplit tous les textes fixes (data-i18n) et reconstruit le menu et le filtre de statut.
 setLang('fr'|'en') change la langue, la mémorise et réaffiche la page courante.
*/
/* ---------- LANGUE ---------- */
function applyStatic(){
  document.documentElement.lang=lang; buildNav();
  document.querySelectorAll('[data-i18n]').forEach(e=>{ e.textContent=T(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{ e.placeholder=T(e.dataset.i18nPh); });
  $('bFr').classList.toggle('on',lang==='fr');
  $('bEn').classList.toggle('on',lang==='en');
  const fs=$('fStatus'), cur=fs.value;
  fs.innerHTML=`<option value="">${esc(T('all_status'))}</option>`+Object.keys(STATUS_L.fr).map(k=>`<option value="${k}" ${k===cur?'selected':''}>${esc(statusL(k))}</option>`).join('');
}
function setLang(l){
  lang=(l==='en')?'en':'fr';
  try{ localStorage.setItem(LANG_KEY,lang); }catch(e){}
  $('fMachine').value='';
  applyStatic();
  if(state.view==='view' && state.id) openTuto(state.id);
  else if(state.view==='edit') renderEditor();
  else renderSection();
}

/*
 LISTE DES TUTORIELS : filtres (recherche texte, machine, statut, catégorie) puis une carte par tutoriel.
 La recherche regarde le titre, la machine, la catégorie, le matériel et le texte des étapes.
*/
/* ---------- LISTE ---------- */
function machines(){ return [...new Set(tutos.map(t=>machineL(view(t).machine)).filter(Boolean))].sort(); }
function refreshMachineFilter(){
  const sel=$('fMachine'), cur=sel.value;
  sel.innerHTML = `<option value="">${esc(T('all_machines'))}</option>`+machines().map(m=>`<option ${m===cur?'selected':''} value="${esc(m)}">${esc(m)}</option>`).join('');
}
function renderList(){
  state.view='list'; state.section='tutos'; buildNav();
  $('filters').classList.remove('hidden');
  refreshMachineFilter();
  const q=($('q').value||'').toLowerCase(), fm=$('fMachine').value, fs=$('fStatus').value;
  const list = tutos.map(view).filter(t=>{
    if(state.cat && t.category!==state.cat) return false;
    if(fm && machineL(t.machine)!==fm) return false;
    if(fs && t.status!==fs) return false;
    if(q){
      const hay=[t.title,machineL(t.machine),catL(t.category),(t.tools||[]).join(' '),(t.steps||[]).map(s=>s.text).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const chips = [-1,...CATS.keys()].map(i=>{
    const c = i<0?'':CATS[i];
    return `<button class="chip ${state.cat===c?'on':''}" onclick="setCat(${i})">${esc(i<0?T('all'):catL(c))}</button>`;
  }).join('');
  $('app').innerHTML = `
    <div class="chips">${chips}</div>
    ${list.length?`<div class="grid">${list.map(cardHTML).join('')}</div>`:`<div class="empty">${T('none_found')}</div>`}
    <p class="disclaimer">${esc(T('footer'))}</p>`;
  window.scrollTo(0,0);
}
/*
 ===================== ILLUSTRATIONS : LES PICTOGRAMMES (SVG) =====================
 Chaque pictogramme est un dessin vectoriel SVG dans une grille de 24 x 24 :
   - on ne met ici que le CONTENU du SVG (les traits) ; l'enveloppe <svg viewBox="0 0 24 24"> est ajoutée par icoSVG().
   - <path d="..."> = un tracé : M x y = se placer ; L / h / v = ligne ; C / Q / a = courbes ; z = fermer.
   - <circle cx cy r> = cercle ; <rect x y width height rx> = rectangle (rx = coins arrondis).
   - La couleur et l'épaisseur du trait viennent du CSS (".card .cover svg" : blanc, stroke-width 1.3).
 LA CLE (bottle, tutos, constructeur...) = le nom de la rubrique ou du jeu :
   tutos / constructeur / consommables / presentation / jeux = les 5 tuiles de l'accueil et du menu ;
   quiz / link / vf / order = les jeux ; bottle = l'icône par défaut (tutoriel sans photo).
 POUR CHANGER UN PICTOGRAMME : remplacez le contenu entre apostrophes par un autre tracé SVG 24x24
   (sources gratuites de pictogrammes : lucide.dev ou tabler-icons.io -> bouton "Copy SVG" -> ne gardez que
   les <path>, <circle>, <rect> à l'intérieur du <svg>).
 POUR AJOUTER UN PICTOGRAMME : ajoutez une ligne  monnom:'<path d="..."/>'  puis utilisez icoSVG('monnom').
 POUR UN PICTOGRAMME DIFFERENT SUR UNE RUBRIQUE : changez simplement le dessin de la clé correspondante.
*/
const ICO={
 bottle:'<path d="M10 2h4v4c0 1.2 2 2 2 4.5V20a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-9.5C8 8 10 7.2 10 6z"/><path d="M8 14h8"/>',
 tutos:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
 constructeur:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
 consommables:'<circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 presentation:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8M7 12l3-3 3 2 4-4"/>',
 jeux:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
 quiz:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.7.4-1.1 1-1.1 1.8M12 17h.01"/>',
 link:'<circle cx="5" cy="7" r="2.2"/><circle cx="19" cy="17" r="2.2"/><path d="M7.2 7.6C13 8 11 16 16.8 16.4"/><circle cx="5" cy="17" r="2.2"/><circle cx="19" cy="7" r="2.2"/><path d="M7.2 16.4C13 16 11 8 16.8 7.6"/>',
 vf:'<path d="M3 12l4 4 7-8"/><path d="M16 8l5 5M21 8l-5 5"/>',
 order:'<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>'
};
/*
 icoSVG('cle') = construit le SVG complet à partir de la liste ICO (si la clé n'existe pas : la bouteille).
 PH_SVG = le pictogramme "bouteille" affiché quand un tutoriel n'a pas de photo.
 coverOf(t) = quelle image utiliser sur la carte : 1) la couverture choisie, sinon 2) la première photo
              d'étape, sinon rien (=> on affiche le pictogramme).
*/
const icoSVG=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]||ICO.bottle}</svg>`;
const PH_SVG=icoSVG('bottle');
const coverOf=t=>t.cover||((t.steps||[]).find(s=>s.img)||{}).img||'';
/*
 cardHTML(t) = le HTML d'UNE carte de tutoriel : bandeau illustré (.cover), étiquettes catégorie/statut, titre
 (avec "Verrouillé" si la classe de l'utilisateur est trop basse), puis machine / durée / niveau / nombre d'étapes.
*/
function cardHTML(t){
  const cv=coverOf(t);
  return `<div class="card tcard ${isLocked(t)?'locked':''}" onclick="openTuto('${t.id}')">
    <div class="cover">${cv?`<img src="${cv}" alt="" loading="lazy">`:PH_SVG}</div>
    <div class="row" style="justify-content:space-between"><span class="tag">${esc(catL(t.category))}</span><span class="tag ${esc(t.status)}">${esc(statusL(t.status))}</span></div>
    <h3>${isLocked(t)?`<span class="tag">${esc(T('locked_tag'))}</span> `:''}${esc(t.title)}</h3>
    <div class="meta"><span>${esc(machineL(t.machine))}</span><span>${esc(t.duration)} ${T('min')}</span><span>${esc(levelL(t.level))}</span><span>${T('steps_n',(t.steps||[]).length)}</span></div>
  </div>`;
}
/*
 setCat(i) : clic sur une pastille de catégorie ; i = -1 pour "Toutes".
*/
function setCat(i){ state.cat = i<0?'':CATS[i]; renderList(); }

/*
 LECTURE D'UN TUTORIEL : page avec couverture, sécurité (encadré rouge), matériel, barre de progression
 et étapes à cocher. Les cases cochées sont gardées en mémoire (state.done) le temps de la session.
 Quand toutes les étapes de la formation obligatoire sont cochées => validateTraining() débloque la classe 1.
*/
/* ---------- LECTURE ---------- */
function openTuto(id){
  const raw=tutos.find(x=>x.id===id); if(!raw) return;
  const t=view(raw);
  state.view='view'; state.id=id; state.section='tutos'; buildNav();
  if(isLocked(raw)) return renderLocked(raw,t);
  if(!state.done[id]) state.done[id]=[];
  $('filters').classList.add('hidden');
  const stepsHTML=(t.steps||[]).map((s,i)=>`
    <div class="step ${state.done[id][i]?'done':''}" id="st${i}">
      <div class="num">${i+1}</div>
      <div class="body">
        <div class="txt">${esc(s.text).replace(/\n/g,'<br>')}</div>
        ${s.warn?`<div class="box danger">${esc(s.warn)}</div>`:''}
        ${s.img?`<img src="${s.img}" alt="${esc(T('step'))} ${i+1}">`:''}
        <label class="chk noprint"><input type="checkbox" ${state.done[id][i]?'checked':''} onchange="toggleStep('${id}',${i},this.checked)"> ${esc(T('step_done'))}</label>
      </div>
    </div>`).join('');
  $('app').innerHTML = `
    <div class="row noprint" style="margin:12px 0;justify-content:space-between">
      <button onclick="renderList()">${esc(T('back'))}</button>
      <div class="row">
        <button onclick="window.print()">${esc(T('print'))}</button>
        <button onclick="editTuto('${id}')">${esc(T('edit'))}</button>
      </div>
    </div>
    <div class="panel">
      ${t.cover?`<img class="tcover" src="${t.cover}" alt="">`:''}
      <div class="row"><span class="tag">${esc(catL(t.category))}</span><span class="tag ${esc(t.status)}">${esc(statusL(t.status))}</span></div>
      <h2 style="margin:8px 0">${esc(t.title)}</h2>
      <div class="meta"><span>${esc(machineL(t.machine))}</span><span>${esc(t.duration)} ${T('min')}</span><span>${esc(levelL(t.level))}</span></div>
      ${(t.safety&&t.safety.length)?`<div class="box danger"><b>${esc(T('safety'))}</b><ul>${t.safety.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${(t.tools&&t.tools.length)?`<div class="box" style="background:transparent;color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent)"><b>${esc(T('tools'))}</b><ul>${t.tools.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><b>${esc(T('progress'))}</b><span id="pct" class="meta"></span></div>
      <div class="progress"><div id="bar"></div></div>
      ${stepsHTML||`<div class="empty">${esc(T('no_steps'))}</div>`}
    </div>`;
  updProgress(id, false);
  window.scrollTo(0,0);
}
function toggleStep(id,i,v){
  state.done[id][i]=v;
  const el=$('st'+i); if(el) el.classList.toggle('done',v);
  updProgress(id, true);
}
function updProgress(id, notify){
  const t=tutos.find(x=>x.id===id), n=(t.steps||[]).length;
  const d=(state.done[id]||[]).filter(Boolean).length;
  const p=n?Math.round(d/n*100):0;
  $('bar').style.width=p+'%';
  $('pct').textContent=T('prog',d,n,p);
  if(notify && n && d===n){ toast(T('finished')); if(t.mandatory) validateTraining(); }
}

/*

}
function newTuto(){ state.draft=blankTuto(); state.isNew=true; renderEditor(); }
function editTuto(id){ state.draft=JSON.parse(JSON.stringify(view(tutos.find(t=>t.id===id)))); state.isNew=false; renderEditor(); }
function renderEditor(){
  state.view='edit';
  $('filters').classList.add('hidden');

       <div style="flex:1;min-width:160px"><label>${esc(T('f_cat'))}</label><select onchange="state.draft.category=this.value">${opt(CATS,d.category,catL)}</select></div>

}
/*
 lines(texte) = transforme un champ "une ligne par élément" en liste (lignes vides ignorées) : sécurité, matériel.
*/
const lines = v => v.split('\n').map(s=>s.trim()).filter(Boolean);
function renderStepsEditor(){
  $('stepsEd').innerHTML = state.draft.steps.map((s,i)=>`
   <div class="edit-step">

/*
 ===================== ILLUSTRATIONS : LES PHOTOS AJOUTEES =====================
 readImg(fichier, tailleMax, qualité, callback)
 Quand vous choisissez une photo, elle n'est PAS envoyée quelque part : elle est
   1) lue dans le navigateur, 2) redessinée dans un <canvas> en plus petit (côté le plus long = tailleMax pixels),
   3) convertie en JPEG de qualité "q" (0.7 = 70 %), 4) transformée en texte base64 ("data:image/jpeg;base64,...")
   qui est enregistré DANS le tutoriel (champ cover ou steps[i].img).
 Réglages utilisés plus bas :
   photo d'étape  : readImg(f, 800, 0.7)   couverture : readImg(f, 720, 0.75)
 -> Plus la taille / la qualité sont grandes, plus l'image est belle MAIS plus le stockage se remplit vite
    (le navigateur limite le localStorage à environ 5 Mo).
 Le fond blanc (fillRect) évite que les PNG transparents deviennent noirs en JPEG.
*/
function readImg(f,max,q,cb){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',q));
    };
    im.onerror=()=>toast(L('Image illisible','Unreadable image'));
    im.src=r.result;
  };
  r.readAsDataURL(f);
}

*/

}

/*
 EXPORT / IMPORT : sauvegarde de TOUS les tutoriels dans un fichier .json (photos comprises) et rechargement.
 À l'import, les tutoriels sont AJOUTES (jamais écrasés) ; un identifiant déjà pris est remplacé par un nouveau.
 C'est le moyen de partager des tutos entre appareils ou de faire une sauvegarde.
 (Les PDF / PowerPoint des fiches ne sont pas inclus dans cet export : ils restent sur l'appareil.)
*/
/* ---------- EXPORT / IMPORT ---------- */
function exportJSON(){
  const blob=new Blob([JSON.stringify(tutos,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='tutos-maintenance-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(T('export_started'));
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d)) throw 0;
      let n=0;
      d.forEach(t=>{
        if(!t||!t.title||!Array.isArray(t.steps)) return;
        t.id=t.id&&!tutos.some(x=>x.id===t.id)?t.id:uid();
        t.tools=t.tools||[]; t.safety=t.safety||[]; t.status=STATUS_L.fr[t.status]?t.status:'brouillon';
        tutos.push(t); n++;
      });
      save(); renderList(); toast(T('imported',n));
    }catch(e){ toast(T('invalid')); }
    ev.target.value='';
  };
  r.readAsText(f);
}

/*
 ===================== COMPTES, CONNEXION, PARAMETRES =====================
 Les comptes sont enregistrés dans le localStorage de l'appareil (clé sibelco_users_v1).
 Le mot de passe n'est jamais gardé en clair : on stocke une empreinte SHA-256 salée (fonction hash()).
 L(fr,en) = renvoie la phrase française ou anglaise selon la langue (pour les textes écrits directement dans le code).
*/
/*SETTINGS*/

/* ---------- COMPTES / CONNEXION / PDF ---------- */
const L=(fr,en)=>lang==='en'?en:fr;
const UKEY='sibelco_users_v1', SESS='sibelco_session';

const validId=v=>/^[a-z0-9._-]{2,30}$/.test(v);
async function hash(pw,salt){
  const d=new TextEncoder().encode(salt+':'+pw);
  if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest('SHA-256',d); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h=5381; for(const c of salt+pw) h=((h<<5)+h+c.charCodeAt(0))|0; return 'w'+h;
}
function authShell(inner){
  document.body.classList.add('nolog'); toggleNav(false);
  $('app').innerHTML=`<div class="panel authcard" style="max-width:400px;margin:24px auto"><div style="text-align:center"><div class="logo3d"></div><div class="wordmark">SIBELCO</div><h2 style="margin:10px 0 14px">${esc(T('app_title'))}</h2></div>${inner}<div id="aerr" class="box danger hidden" style="margin-top:12px"></div></div>`;
}

function renderLogin(){
  authShell(`<label>${L('Identifiant','Login')}</label><input id="li" autocomplete="username" autocapitalize="none">
   <label>${L('Mot de passe','Password')}</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
   <div style="margin-top:14px"><button class="primary" style="width:100%" onclick="doLogin()">${L('Se connecter','Log in')}</button></div>`);
}

   <label>${L('Nom Prénom','Full name')}</label><input id="sn">
   <label>${L('Mot de passe (4 caractères min)','Password (min 4)')}</label><input id="sp" type="password" autocomplete="new-password">
   <div style="margin-top:14px"><button class="primary" style="width:100%" onclick="doSetup()">${L('Créer le compte','Create account')}</button></div>`);
}
async function doSetup(){
  const id=$('si').value.trim().toLowerCase(), name=$('sn').value.trim(), pw=$('sp').value;
  if(!validId(id)||!name||pw.length<4){ aerr(L('Identifiant (a-z, 0-9), nom et mot de passe (4 car. min) requis','Login (a-z, 0-9), name and password (min 4) required')); return; }
  const salt=uid(); const u={id,name,cls:3,salt,pw:await hash(pw,salt),chosen:true,trained:Date.now(),theme:'auto'};
  users.push(u); saveUsers(); try{localStorage.setItem(SESS,id);}catch(e){} enter(u);
}
async function doLogin(){
  const id=$('li').value.trim().toLowerCase(), u=users.find(x=>x.id===id);
  if(!u||(await hash($('lp').value,u.salt))!==u.pw){ aerr(L('Identifiant ou mot de passe incorrect','Wrong login or password')); return; }
  try{localStorage.setItem(SESS,u.id);}catch(e){} enter(u);
}

/*
 seedAdmin() : garantit que le compte administrateur "aa" existe et reste ADMINISTRATEUR (classe 4).
 A chaque démarrage :
   - si "aa" n'existe pas (supprimé, nouvel appareil...) -> il est recréé avec le mot de passe AAAA ;
   - si "aa" existe mais n'est plus administrateur -> il est remis en classe 4 ;
   - UNE SEULE FOIS par appareil (marqueur 'sibelco_seed_aa_v2'), son mot de passe est remis à AAAA pour
     pouvoir se reconnecter même si l'ancien a été oublié. Ensuite, un mot de passe modifié dans Paramètres est conservé.
 Le compte "aa" ne peut ni être supprimé ni rétrogradé depuis l'appli (voir setUserCls et delUser).
 /!\ SECURITE : changez le mot de passe AAAA dans Paramètres une fois connecté.
*/
async function seedAdmin(){
  let first=true; try{ first=!localStorage.getItem('sibelco_seed_aa_v2'); }catch(e){}
  let a=users.find(u=>u.id==='aa'), dirty=false;
  if(!a){
    const salt=uid();
    a={id:'aa',name:'AA',cls:4,salt,pw:await hash('AAAA',salt),chosen:true,trained:Date.now(),theme:'auto'};
    users.push(a); dirty=true;
  }else{
    if(a.cls<4){ a.cls=4; dirty=true; }
    if(first){ a.salt=uid(); a.pw=await hash('AAAA',a.salt); dirty=true; }
  }
  if(dirty) saveUsers();
  try{ localStorage.setItem('sibelco_seed_aa_v2','1'); }catch(e){}
}

/*
 ===================== GROS FICHIERS : IndexedDB =====================
 Les PDF et PowerPoint sont trop gros pour le localStorage. On les range dans IndexedDB (base "sibelco_files",
 magasin "f"), avec l'identifiant de la fiche comme clé. idbPut = enregistrer, idbGet = lire, idbDel = effacer.
 Dans la fiche elle-même on ne garde que { name, size, kind } (nom, taille, 'pdf' ou 'ppt').
*/
function idb(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('sibelco_files',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function idbOp(m,k,v){
  const db=await idb();
  return new Promise((ok,ko)=>{ const tx=db.transaction('f',m==='get'?'readonly':'readwrite'), st=tx.objectStore('f'); const rq=m==='put'?st.put(v,k):m==='get'?st.get(k):st.delete(k); tx.oncomplete=()=>ok(rq.result); tx.onerror=()=>ko(tx.error); });
}
const idbPut=(k,v)=>idbOp('put',k,v), idbGet=k=>idbOp('get',k), idbDel=k=>idbOp('del',k);
/*
 pickPdf(input) : appelé quand on choisit un fichier dans l'éditeur de fiche.
   - PDF accepté partout ; PowerPoint (.pptx .ppt .ppsx .pps .odp) accepté SEULEMENT dans "Fiches présentation" ;
   - 30 Mo maximum ; le fichier n'est réellement stocké qu'au clic sur "Enregistrer" (saveFiche).
   - isPpt / fileKind : reconnaissent le type d'après l'extension du nom.
 rmPdf() : retire le fichier de la fiche (supprimé au prochain enregistrement).
*/
const isPpt=n=>/\.(pptx?|ppsx?|odp)$/i.test(n||'');                 // vrai si le nom de fichier est un PowerPoint
const isPdfName=n=>/\.pdf$/i.test(n||'');
const fileKind=file=>file&&(file.kind||(isPpt(file.name)?'ppt':'pdf')); // 'ppt' ou 'pdf' (anciennes fiches : déduit du nom)
function pickPdf(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const okPpt=state.fd.type==='presentation';                          // PowerPoint autorisé uniquement dans les fiches présentation
  if(!(isPdfName(f.name)||f.type==='application/pdf'||(okPpt&&isPpt(f.name)))){
    toast(L(okPpt?'Choisissez un PDF ou un PowerPoint (.pptx, .ppt, .ppsx)':'Choisissez un fichier PDF','Choose a '+(okPpt?'PDF or PowerPoint (.pptx, .ppt, .ppsx) file':'PDF file'))); inp.value=''; return;
  }
  if(f.size>30e6){ toast(L('Fichier trop gros (30 Mo max)','File too large (30 MB max)')); inp.value=''; return; }
  state.fdFile=f; state.fdRm=false; state.fd.file={name:f.name,size:f.size,kind:isPpt(f.name)?'ppt':'pdf'}; renderFicheEditor();
}
function rmPdf(){ state.fdFile=null; state.fdRm=true; state.fd.file=null; renderFicheEditor(); }
/*
 AFFICHAGE DES PDF : bibliothèque pdf.js (Mozilla) chargée depuis cdnjs seulement quand on ouvre un PDF
 (et mise en cache par sw.js pour le hors-ligne). showPdf(f) dessine chaque page dans un <canvas>
 (mise en page "à la demande" : une page n'est dessinée que quand on s'en approche - IntersectionObserver).
 Si pdf.js ne se charge pas (pas d'Internet, pas encore en cache), on se rabat sur un cadre <iframe> du navigateur.
*/
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let _pdfjs=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src=PDFJS+'pdf.min.js';
    sc.onload=()=>{ if(!window.pdfjsLib){ _pdfjs=null; return rej(new Error('pdfjs')); } pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; res(pdfjsLib); };
    sc.onerror=()=>{ _pdfjs=null; rej(new Error('pdfjs')); };
    document.head.appendChild(sc);
  });
  return _pdfjs;
}
async function showPdf(f){
  let b,box; try{ b=await idbGet(f.id); box=$('pdfBox'); }catch(e){} if(!b||!box) return;
  const u=URL.createObjectURL(b);
  box.innerHTML=`<div class="row noprint" style="margin:12px 0"><a class="btn" href="${u}" target="_blank" rel="noopener">${L('Ouvrir le PDF','Open PDF')}</a><a class="btn" href="${u}" download="${esc(f.file.name)}">${L('Télécharger','Download')}</a></div><div id="pdfPages" class="pdfpages"><div class="meta">${L('Chargement du PDF…','Loading PDF…')}</div></div>`;
  const pages=$('pdfPages');
  const fallback=()=>{ if(pages.isConnected) pages.innerHTML=`<iframe src="${u}" title="PDF" style="width:100%;height:90vh;border:1px solid var(--line);border-radius:8px"></iframe>`; };
  try{
    const lib=await loadPdfJs();
    const doc=lib.getDocument({data:new Uint8Array(await b.arrayBuffer())});
    const pdf=await Promise.race([doc.promise,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),20000))]);
    if(!pages.isConnected) return;
    pages.innerHTML='';
    const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ io.unobserve(en.target); en.target._render(); } }),{rootMargin:'900px 0px'});
    for(let n=1;n<=pdf.numPages;n++){
      const pg=await pdf.getPage(n); if(!pages.isConnected) return;
      const vp=pg.getViewport({scale:1});
      const div=document.createElement('div'); div.className='pdfpg'; div.style.aspectRatio=vp.width+' / '+vp.height;
      const cv=document.createElement('canvas'); div.appendChild(cv); pages.appendChild(div);
      div._render=async()=>{
        const w=div.clientWidth||pages.clientWidth||800;
        const v=pg.getViewport({scale:(w/vp.width)*Math.min(window.devicePixelRatio||1,2)});
        cv.width=Math.floor(v.width); cv.height=Math.floor(v.height);
        try{ await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise; }catch(e){}
      };
      io.observe(div);
    }
  }catch(e){ fallback(); }
}



/*
 ===================== POWERPOINT (ajout dans "Fiches présentation") =====================
 Un navigateur ne sait pas dessiner un PowerPoint tout seul. Ce qu'on fait ici :
   1) le fichier est stocké dans IndexedDB (comme un PDF) ;
   2) un bouton permet de le TELECHARGER / l'ouvrir dans PowerPoint ;
   3) pour les .pptx / .ppsx : un .pptx est en réalité un ZIP de fichiers XML. La bibliothèque JSZip (chargée
      à la demande depuis cdnjs) l'ouvre ; on lit alors l'ordre des diapositives, le TEXTE de chacune
      (balises <a:t> regroupées par paragraphe <a:p>) et la miniature de la 1re diapo (docProps/thumbnail.jpeg) ;
   4) l'ancien format .ppt (binaire) ne peut pas être lu : seul le téléchargement est proposé.
 Pour un rendu IDENTIQUE à l'écran PowerPoint (images, mise en page, animations figées), le plus simple est
 d'exporter la présentation en PDF (PowerPoint : Fichier > Exporter > Créer un document PDF) et de l'ajouter comme PDF.
*/
/* ---------- POWERPOINT : affichage d'une présentation ajoutée dans une fiche ---------- */
const JSZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
let _jszip=null;
function loadJsZip(){                       // charge JSZip (lecteur de .zip) à la demande, comme pdf.js
  if(window.JSZip) return Promise.resolve(window.JSZip);
  if(_jszip) return _jszip;
  _jszip=new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src=JSZIP;
    sc.onload=()=>window.JSZip?res(window.JSZip):(_jszip=null,rej(new Error('jszip')));
    sc.onerror=()=>{ _jszip=null; rej(new Error('jszip')); };
    document.head.appendChild(sc);
  });
  return _jszip;
}
async function showPpt(f){
  let b,box; try{ b=await idbGet(f.id); box=$('pdfBox'); }catch(e){} if(!b||!box) return;
  const u=URL.createObjectURL(b);           // lien temporaire vers le fichier stocké dans IndexedDB
  const kb=f.file.size?' · '+(f.file.size>1048576?(f.file.size/1048576).toFixed(1)+' Mo':Math.round(f.file.size/1024)+' Ko'):'';
  box.innerHTML=`<div class="row noprint" style="margin:12px 0"><a class="btn" href="${u}" download="${esc(f.file.name)}">${L('Télécharger / ouvrir dans PowerPoint','Download / open in PowerPoint')}</a><span class="meta">${esc(f.file.name)}${kb}</span></div><div id="pptInfo" class="meta">${L('Chargement de l’aperçu…','Loading preview…')}</div>`;
  const info=$('pptInfo');
  const none=()=>{ if(info&&info.isConnected) info.textContent=L('Aperçu indisponible (ancien format .ppt, hors ligne ou fichier non standard) : utilisez le bouton de téléchargement.','Preview unavailable (old .ppt format, offline or non-standard file): use the download button.'); };
  if(!/\.(pptx|ppsx)$/i.test(f.file.name)) return none();   // seuls les formats XML modernes (.pptx/.ppsx) sont lisibles ici
  try{
    const Z=await loadJsZip();
    const zip=await Z.loadAsync(b);          // un .pptx est un zip contenant des fichiers XML
    const parse=async p=>{ const z=zip.file(p); return z?new DOMParser().parseFromString(await z.async('string'),'application/xml'):null; };
    // ordre réel des diapositives : ppt/presentation.xml (liste des r:id) + ppt/_rels/presentation.xml.rels (r:id -> fichier)
    let order=[];
    try{
      const pres=await parse('ppt/presentation.xml'), rels=await parse('ppt/_rels/presentation.xml.rels');
      const map={}; [...rels.getElementsByTagName('Relationship')].forEach(r=>{ map[r.getAttribute('Id')]=r.getAttribute('Target'); });
      order=[...pres.getElementsByTagName('p:sldId')].map(s=>map[s.getAttribute('r:id')]).filter(Boolean)
        .map(t=>'ppt/'+t.replace(/^\/?(ppt\/)?/,''));
    }catch(e){ order=[]; }
    if(!order.length) order=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
    const slides=[];
    for(const p of order){
      const d=await parse(p); if(!d) continue;
      // chaque paragraphe <a:p> regroupe des morceaux de texte <a:t>
      const paras=[...d.getElementsByTagName('a:p')].map(pp=>[...pp.getElementsByTagName('a:t')].map(t=>t.textContent).join('')).filter(s=>s.trim());
      slides.push(paras);
    }
    let thumb=''; const th=zip.file('docProps/thumbnail.jpeg');   // miniature de la 1re diapo (présente dans la plupart des .pptx)
    if(th) thumb=URL.createObjectURL(await th.async('blob'));
    if(!info||!info.isConnected) return;
    if(!slides.length){ return none(); }
    info.outerHTML=`<div id="pptInfo">${thumb?`<img class="pptthumb" src="${thumb}" alt="">`:''}
      <div class="meta" style="margin:6px 0">${slides.length} ${L('diapositive(s) – texte de la présentation :','slide(s) – text of the presentation:')}</div>
      ${slides.map((s,i)=>`<div class="pptslide"><b>${L('Diapo','Slide')} ${i+1}</b>${s.length?s.map((x,j)=>j===0?`<div style="font-weight:600">${esc(x)}</div>`:`<div>${esc(x)}</div>`).join(''):`<span class="meta">${L('(pas de texte – images / schémas)','(no text – images / diagrams)')}</span>`}</div>`).join('')}</div>`;
  }catch(e){ none(); }
}

/*
 ===================== FICHES =====================
 3 rubriques qui partagent le MEME code, distinguées par le champ "type" :
   'constructeur' (fiches constructeur), 'consommables' (pièces consommables), 'presentation' (fiches présentation).
 Une fiche = { id, type, title, cover (image), machine, text, url (lien facultatif), file (PDF/PowerPoint) }.
 Elles sont enregistrées dans le localStorage sous la clé FKEY ; le fichier lui-même dans IndexedDB.
*/
/* ---------- FICHES (constructeur / pièces consommables / présentation) ---------- */
/*
 FSEED = fiche d'exemple fournie au départ (rubrique "présentation").
 fiches = la liste en mémoire ; saveFiches() l'enregistre.
*/
const FSEED=[{id:'f1',type:'presentation',title:'Principe du trieur optique verre',machine:'Tous trieurs',url:'',
 text:'Le verre broyé (calcin) est étalé en nappe fine sur un convoyeur ou une goulotte.\nDes caméras et un éclairage analysent chaque particule.\nLes indésirables détectés sont éjectés par des jets d\'air comprimé (buses).\nÀ compléter avec les spécificités de vos machines (modèle, ligne, réglages).'}];
let fiches=(()=>{try{const r=JSON.parse(localStorage.getItem(FKEY)); if(Array.isArray(r)) return r;}catch(e){} return JSON.parse(JSON.stringify(FSEED));})();
function saveFiches(){ try{localStorage.setItem(FKEY,JSON.stringify(fiches));}catch(e){toast(T('storage_full'));} }
/*
 renderFiches(type) : liste des fiches d'une rubrique, en cartes illustrées (class="cover c-<type>").
 Image de la carte : la photo ajoutée (f.cover) sinon le pictogramme de la rubrique (icoSVG(type)).
 L'étiquette PDF / PowerPoint apparaît à côté de la machine quand un fichier est attaché.
*/
function renderFiches(type){
  state.section=type; state.view='fiches'; $('filters').classList.add('hidden'); buildNav();
  const l=fiches.filter(f=>f.type===type);
  $('app').innerHTML=`<div class="row" style="margin:12px 0;justify-content:space-between"><h2 style="margin:0">${esc(T(type==='constructeur'?'nav_cons':type==='consommables'?'nav_cons2':'nav_pres'))}</h2><button class="primary" onclick="editFiche('','${type}')">${esc(T('add_fiche'))}</button></div>`+
   (l.length?`<div class="grid">${l.map(f=>`<div class="card tcard" onclick="openFiche('${f.id}')"><div class="cover c-${type}">${f.cover?`<img src="${f.cover}" alt="" loading="lazy">`:icoSVG(type)}</div><h3>${esc(f.title)}</h3><div class="meta"><span>${esc(machineL(f.machine||'Non précisée'))}</span>${f.file?`<span>${fileKind(f.file)==='ppt'?'PowerPoint':'PDF'}</span>`:''}</div></div>`).join('')}</div>`:`<div class="empty">${esc(T('no_fiche'))}</div>`)+`<p class="disclaimer">${esc(T('footer'))}</p>`;
  window.scrollTo(0,0);
}
/*
 openFiche(id) : page d'une fiche = couverture, titre, texte, lien (si une adresse valide est saisie),
 puis le fichier attaché : PDF -> showPdf(f) ; PowerPoint -> showPpt(f). Les deux écrivent dans <div id="pdfBox">.
 La regex "ok" accepte les liens http(s) et les fichiers locaux de type pdf, images, Word, Excel, PowerPoint, html.
*/
function openFiche(id){
  const f=fiches.find(x=>x.id===id); if(!f) return;
  state.section=f.type; state.view='fiche'; state.fid=id; $('filters').classList.add('hidden'); buildNav();
  const ok=/^(https?:\/\/|\.?\/?[\w\-\/.]+\.(pdf|png|jpe?g|docx?|xlsx?|pptx?|ppsx?|html?))/i.test(f.url||'');

/*
 ===================== JEU 1 : TRIEUR SIBELCO (dessiné dans un <canvas>) =====================
 Des pièces tombent ; il faut les envoyer dans le bon bac avant la ligne des buses.
 GW x GH = taille du terrain (en pixels logiques) ; GLINE = hauteur de la ligne des buses.
*/
/* ---------- JEU : TRIEUR SIBELCO (tri du verre / refus) ---------- */
const GW=360, GH=380, GLINE=GH-50;
/*
 GBINS = les 4 boutons / bacs (nom FR/EN + couleur). GITEMS = les pièces possibles :
   bin = numéro du bon bac (0 vert, 1 blanc, 2 brun, 3 refus) ; shape = forme dessinée par gItem() ; col = couleur ;
   tfr / ten = phrase pédagogique affichée quand on se trompe sur un indésirable.
 POUR AJOUTER UNE PIECE : ajouter une ligne ici ET une forme correspondante dans gItem() (si c'est une nouvelle forme).
*/
const GBINS=[
 {fr:'Vert',en:'Green',col:'#2e9e4f'},
 {fr:'Blanc',en:'Clear',col:'#2f8fb5'},
 {fr:'Brun',en:'Brown',col:'#8a5a2b'},
 {fr:'Refus',en:'Reject',col:'#c0392b'}
];
const GITEMS=[
 {bin:0,shape:'bottle',col:'#2e9e4f',fr:'Verre vert',en:'Green glass'},
 {bin:1,shape:'bottle',col:'#bfe6f2',fr:'Verre blanc',en:'Clear glass'},
 {bin:2,shape:'bottle',col:'#8a5a2b',fr:'Verre brun',en:'Brown glass'},
 {bin:3,shape:'stone',fr:'Pierre',en:'Stone',
  tfr:'Les pierres ne fondent pas dans le four : elles laissent des défauts dans le verre neuf.',
  ten:'Stones do not melt in the furnace: they leave defects in new glass.'},
 {bin:3,shape:'shard',fr:'Céramique',en:'Ceramic',
  tfr:'La céramique fond à plus haute température que le verre : elle laisse des inclusions dans les bouteilles.',
  ten:'Ceramic melts at a higher temperature than glass: it leaves inclusions in new bottles.'},
 {bin:3,shape:'cap',fr:'Bouchon métal',en:'Metal cap',
  tfr:'Le métal est un indésirable : il peut abîmer le four et perturber la fusion.',
  ten:'Metal is a contaminant: it can damage the furnace and disturb melting.'},
 {bin:3,shape:'pyrex',fr:'Pyrex / vitrocéramique',en:'Pyrex / glass-ceramic',
  tfr:'Le Pyrex et la vitrocéramique ressemblent à du verre blanc mais fondent à bien plus haute température : ce sont des infusibles.',
  ten:'Pyrex and glass-ceramic look like clear glass but melt at a much higher temperature: they are infusibles.'},
 {bin:3,shape:'bag',fr:'Plastique',en:'Plastic',
  tfr:'Le plastique n\'a rien à faire dans le calcin : il perturbe la fusion.',
  ten:'Plastic does not belong in cullet: it disturbs melting.'}
];
/*
 G = l'état de la partie en cours (pièces, score, vies, combo...). Scores : record personnel (gBest) et
 classement de l'appareil (gScores / gRecord / gBoard), par compte utilisateur.
*/
let G=null;
const gBestKey=()=>'sibelco_game_best_'+(settings.id||'x');
function gBest(){ try{ return +localStorage.getItem(gBestKey())||0; }catch(e){ return 0; } }
function gSetBest(v){ try{ localStorage.setItem(gBestKey(),String(v)); }catch(e){} }
const GSKEY='sibelco_game_scores_v1';
function gScores(){ try{ const r=JSON.parse(localStorage.getItem(GSKEY)); if(r&&typeof r==='object') return r; }catch(e){} return {}; }
function gRecord(g){
  const all=gScores(), id=settings.id||'x', r=all[id]||{best:0,sorted:0,games:0,date:0};
  r.games++; r.last=g.score;
  if(g.score>=r.best){ r.best=g.score; r.sorted=g.sorted; r.date=Date.now(); }
  r.best=Math.max(r.best,gBest());
  all[id]=r; try{ localStorage.setItem(GSKEY,JSON.stringify(all)); }catch(e){}
}
function gBoard(){
  const box=$('glb'); if(!box) return;
  const all=gScores();
  const rows=users.map(u=>{ const r=all[u.id]||{}; let b=r.best||0; try{ b=Math.max(b,+localStorage.getItem('sibelco_game_best_'+u.id)||0); }catch(e){}
    return {id:u.id,name:u.name||u.id,best:b,sorted:r.sorted||0,games:r.games||0,date:r.date||0}; })
    .filter(r=>r.best>0).sort((a,b)=>b.best-a.best||b.sorted-a.sorted||a.date-b.date);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  box.innerHTML=`<div class="panel"><h2 style="margin-top:0">🏆 ${L('Classement général','Overall ranking')}</h2>`+
   (rows.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem">
    <thead><tr style="text-align:left;color:var(--muted,inherit);font-size:.75rem"><th style="padding:6px 4px">#</th><th style="padding:6px 4px">${L('Opérateur','Operator')}</th><th style="padding:6px 4px;text-align:right">${L('Meilleur score','Best score')}</th><th style="padding:6px 4px;text-align:right">${L('Pièces','Items')}</th><th style="padding:6px 4px;text-align:right">${L('Parties','Games')}</th></tr></thead><tbody>`+
    rows.map((r,i)=>`<tr style="border-top:1px solid var(--line);${r.id===settings.id?'font-weight:700;background:rgba(45,143,224,.15)':''}"><td style="padding:8px 4px;white-space:nowrap">${medal(i)}</td><td style="padding:8px 4px">${esc(r.name)}${r.id===settings.id?' ('+L('vous','you')+')':''}</td><td style="padding:8px 4px;text-align:right">${r.best}</td><td style="padding:8px 4px;text-align:right">${r.sorted||'–'}</td><td style="padding:8px 4px;text-align:right">${r.games||'–'}</td></tr>`).join('')+
    `</tbody></table></div>`:`<div class="empty">${L('Aucun score pour le moment. Soyez le premier !','No score yet. Be the first!')}</div>`)+
   `<p class="meta" style="margin:8px 0 0;font-size:.75rem">${L('Classement des comptes de cet appareil, selon le meilleur score.','Ranking of the accounts on this device, by best score.')}</p></div>`;
}

/*
 renderSortGame() : page du jeu (canvas + 4 gros boutons + classement). Clavier : touches 1 à 4.
*/
function renderSortGame(){
  state.section='jeux'; state.view='jeux'; $('filters').classList.add('hidden'); buildNav();
  $('app').innerHTML=`<div class="row noprint" style="margin:12px 0"><button onclick="renderGame()">${L('← Jeux','← Games')}</button></div><div class="panel"><h2 style="margin-top:0">${esc(T('nav_jeux'))} · ${L('Trieur Sibelco','Sibelco Sorter')}</h2>
   <p class="meta" style="margin:0 0 8px;font-size:.8rem">${L('Envoyez la pièce la plus basse (cerclée) dans le bon bac : verre vert, blanc, brun – ou Refus pour tout indésirable (pierre, céramique, Pyrex, métal, plastique). Clavier : touches 1 à 4.','Send the lowest (circled) piece to the right bin: green, clear, brown glass – or Reject for any contaminant (stone, ceramic, Pyrex, metal, plastic). Keyboard: keys 1 to 4.')}</p>
   <div style="width:max(240px,min(100%,420px,calc((100vh - 290px)*0.947),calc((100dvh - 290px)*0.947)));margin:0 auto">
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><span id="gsc"></span><span id="gli"></span><span id="gbest" class="meta"></span></div>
    <canvas id="gcv" style="display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);touch-action:manipulation"></canvas>
    <div id="gmsg" style="min-height:2.6em;margin:6px 0;font-size:.8rem;line-height:1.25"></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${GBINS.map((b,i)=>`<button onclick="gSort(${i})" style="background:${b.col};color:#fff;border-color:${b.col};font-weight:700;padding:10px 2px;font-size:.85rem;touch-action:manipulation">${esc(L(b.fr,b.en))}<br><small style="opacity:.85">${i+1}</small></button>`).join('')}</div>
    <div style="text-align:center;margin-top:8px"><button id="gplay" class="primary" onclick="gameStart()" style="padding:8px 28px">${L('Jouer','Play')}</button></div>
   </div></div><div id="glb"></div><p class="disclaimer">${esc(T('footer'))}</p>`;
  gameInit(); gBoard(); window.scrollTo(0,0);
