/*
 ===================== CONVERTISSEUR DE FLOWSHEET (classes 3 et 4) =====================
 Onglet « Convertisseur » du menu + bouton « Ajouter un flowsheet » de la rubrique Flowsheet (réservés aux classes 3 et 4 : canEditTutos()).
 Rôle : transformer un plan (PDF enregistré depuis Excel, SVG ou image) en flowsheet, SANS toucher au code.
   1) Création : le plan est converti en SVG ; le flowsheet est gardé sur CET appareil (IndexedDB « flowsite:<id> » + liste dans
      localStorage CVKEY) et apparaît tout de suite dans la liste des sites de la rubrique Flowsheet. On y trace ensuite les
      équipements avec le bouton existant « Modifier les cases ».
   2) Export : « Exporter .js » fabrique le fichier <id>.js (même format que Reims.js) en y intégrant les cases ajoutées / retirées
      et les noms / descriptions / photos modifiés dans l'appli. C'est ce fichier qu'on publie pour TOUS les appareils :
      dossier flowsheets/ + ligne dans FLOW_SITES + liste FILES de sw.js (l'appli affiche la ligne à copier).
   3) Import : « Importer un .js » lit un fichier au même format (par ex. exporté depuis un autre appareil) SANS l'exécuter.
 Un flowsheet local ne disparaît que si on le supprime ici ; s'il est ensuite publié (même id dans FLOW_SITES), la version publiée l'emporte.
*/
const CVBOX='background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0';
const CV={idTouched:false,rep:null};
const cvOk=id=>/^[A-Za-z0-9_-]{1,40}$/.test(id);
const cvSlug=n=>String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().replace(/\s+/g,'-').replace(/[^A-Za-z0-9_-]/g,'').slice(0,40);
const cvStem=n=>String(n||'').replace(/\.[^.]+$/,'');
const cvMo=n=>(n/1048576).toFixed(1).replace('.',',')+' Mo';
const cvR1=n=>Math.round(n*10)/10;
function cvMsg(h,bad){ const m=$('cvMsg'); if(!m) return; m.className='box'+(bad?' danger':''); m.style.display='block'; m.innerHTML=h; m.scrollIntoView({block:'nearest'}); }
function cvRead(f,how){ return new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>ko(r.error); how==='text'?r.readAsText(f):how==='url'?r.readAsDataURL(f):r.readAsArrayBuffer(f); }); }

/* ---- conversion d'un fichier plan -> {svg, w, h} (le plan garde ses dimensions d'origine : les cases sont dans ce repère) ---- */
async function cvConvert(f,o){
  const ext=(f.name.split('.').pop()||'').toLowerCase(), head='<?xml version="1.0" encoding="UTF-8"?>\n';
  if(['xlsx','xls','xlsm'].includes(ext)) throw new Error(L('Un fichier Excel ne peut pas être converti directement (les formes du flowsheet ne sont pas lisibles de façon fiable). Dans Excel : Fichier → Enregistrer sous → PDF (paysage, « Ajuster la feuille sur 1 page »), puis choisissez ce PDF.','An Excel file cannot be converted directly (the flowsheet shapes cannot be read reliably). In Excel: File → Save as → PDF (landscape, “Fit sheet on one page”), then choose that PDF.'));
  if(ext==='svg'){
    let t=await cvRead(f,'text'); t=t.replace(/<metadata[\s\S]*?<\/metadata>/g,'');
    const d=new DOMParser().parseFromString(t,'image/svg+xml').documentElement;
    if(d.nodeName!=='svg') throw new Error(L('SVG illisible.','Unreadable SVG.'));
    const vb=(d.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number); let w,h;
    if(vb.length===4&&vb.every(isFinite)){ w=vb[2]; h=vb[3]; } else { w=parseFloat(d.getAttribute('width')); h=parseFloat(d.getAttribute('height')); }
    if(!(w>0&&h>0)) throw new Error(L('Le SVG n’a ni viewBox ni dimensions.','The SVG has no viewBox or size.'));
    return {svg:t,w:cvR1(w),h:cvR1(h)};
  }
  if(['png','jpg','jpeg','webp'].includes(ext)){
    const url=await cvRead(f,'url');
    const im=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ko(new Error(L('Image illisible.','Unreadable image.'))); i.src=url; });
    const w=im.naturalWidth,h=im.naturalHeight;
    return {svg:head+`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><image width="${w}" height="${h}" xlink:href="${url}"/></svg>\n`,w,h};
  }
  if(ext==='pdf'){
    let lib; try{ lib=await loadPdfJs(); }catch(e){ throw new Error(L('pdf.js n’a pas pu être chargé : une connexion Internet est nécessaire pour convertir un PDF.','pdf.js could not be loaded: an Internet connection is needed to convert a PDF.')); }
    const doc=await lib.getDocument({data:new Uint8Array(await cvRead(f,'buf'))}).promise;
    const n=Math.min(Math.max(1,o.page||1),doc.numPages), page=await doc.getPage(n), vp1=page.getViewport({scale:1});
    const W=cvR1(vp1.width),H=cvR1(vp1.height);
    if(o.mode==='vec'){
      const ops=await page.getOperatorList(), g=new lib.SVGGraphics(page.commonObjs,page.objs); g.embedFonts=true;
      const el=await g.getSVG(ops,vp1); el.setAttribute('width',W); el.setAttribute('height',H); el.setAttribute('viewBox','0 0 '+W+' '+H);
      return {svg:head+new XMLSerializer().serializeToString(el)+'\n',w:W,h:H};
    }
    const sc=Math.min(o.res||3,15000/Math.max(W,H)), vp=page.getViewport({scale:sc});
    const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    const url=c.toDataURL('image/png');
    return {svg:head+`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><image width="${W}" height="${H}" xlink:href="${url}"/></svg>\n`,w:W,h:H};
  }
  throw new Error(L('Format non pris en charge : ','Unsupported format: ')+f.name);
}
const cvOpts=()=>({page:+($('cvPage')||{}).value||1,mode:($('cvMode')||{}).value||'img',res:+($('cvRes')||{}).value||3});

/* ---- enregistrement d'un flowsheet local (plan dans IndexedDB, nom dans la liste) ---- */
async function cvRegister(id,name,pack){
  const ex=FLOW_SITES.find(s=>s.id===id);
  if(ex&&!ex.custom){ cvMsg(L('Cet identifiant est déjà utilisé par un flowsheet publié : choisissez-en un autre.','This id is already used by a published flowsheet: choose another one.'),true); return false; }
  if(ex&&!confirm(L('Un flowsheet « '+ex.name+' » existe déjà sur cet appareil avec cet identifiant. Le remplacer (ses cases sont conservées) ?','A flowsheet “'+ex.name+'” already exists on this device with this id. Replace it (its zones are kept)?'))) return false;
  try{ await idbPut('flowsite:'+id,pack); const l=cvList().filter(x=>x.id!==id); l.push({id,name}); localStorage.setItem(CVKEY,JSON.stringify(l)); }
  catch(e){ toast(T('storage_full')); return false; }
  if(ex) ex.name=name; else FLOW_SITES.push({id,name,js:'',custom:true});
  FLOW_PACK[id]=pack; return true;
}

function cvFileChosen(inp){ const f=inp.files&&inp.files[0]; if(!f) return; if(!$('cvName').value){ $('cvName').value=cvStem(f.name); } if(!CV.idTouched) $('cvId').value=cvSlug($('cvName').value); }
function cvNameInput(){ if(!CV.idTouched) $('cvId').value=cvSlug($('cvName').value); }
function cvBusy(b,label){ const g=$('cvGo'); if(g){ g.disabled=b; g.textContent=b?L('Conversion en cours…','Converting…'):label; } }

async function cvCreate(){
  const f=$('cvFile').files[0], name=$('cvName').value.trim(), id=$('cvId').value.trim();
  if(!f) return cvMsg(L('Choisissez d’abord un fichier de plan.','Choose a plan file first.'),true);
  if(!name) return cvMsg(L('Indiquez le nom du site.','Enter the site name.'),true);
  if(!cvOk(id)) return cvMsg(L('Identifiant : lettres, chiffres, _ ou - uniquement (ex. Reims, saint-romain).','Id: letters, digits, _ or - only (e.g. Reims, saint-romain).'),true);
  const lbl=$('cvGo').textContent; cvBusy(true);
  try{
    const r=await cvConvert(f,cvOpts());
    const old=FLOW_PACK[id]&&FLOW_SITES.find(s=>s.id===id&&s.custom)?FLOW_PACK[id]:null;
    const pack={svg:r.svg,data:{id,name,viewBox:[0,0,r.w,r.h],equipment:old?old.data.equipment:[]}};
    if(await cvRegister(id,name,pack)){ toast(L('Flowsheet créé. Utilisez « Modifier les cases » pour tracer les équipements.','Flowsheet created. Use “Edit zones” to draw the equipment.')); renderFlow(id); return; }
  }catch(e){ cvMsg(esc(e.message||String(e)),true); }
  cvBusy(false,lbl);
}
function cvPickReplace(id){ CV.rep=id; $('cvRep').value=''; $('cvRep').click(); }
async function cvReplace(inp){
  const f=inp.files&&inp.files[0], id=CV.rep; if(!f||!id) return;
  try{
    const r=await cvConvert(f,cvOpts()), p=await flLoad(id), old=p.data.viewBox;
    p.svg=r.svg; p.data.viewBox=[0,0,r.w,r.h]; await idbPut('flowsite:'+id,p); FLOW_PACK[id]=p;
    const diff=Math.abs(old[2]-r.w)>2||Math.abs(old[3]-r.h)>2;
    cvMsg(diff?L('Plan remplacé, mais ses dimensions ont changé ('+cvR1(old[2])+'×'+cvR1(old[3])+' → '+r.w+'×'+r.h+') : vérifiez la position des cases.','Plan replaced, but its size changed ('+cvR1(old[2])+'×'+cvR1(old[3])+' → '+r.w+'×'+r.h+'): check the zone positions.'):L('Plan remplacé, les cases sont conservées.','Plan replaced, zones kept.'),diff);
  }catch(e){ cvMsg(esc(e.message||String(e)),true); }
}
async function cvDelete(id){
  const s=FLOW_SITES.find(x=>x.id===id); if(!s) return;
  if(s.custom){
    if(!confirm(L('Supprimer le flowsheet « '+s.name+' » de cet appareil, avec ses cases et infos ajoutées ? (Pensez à l’exporter avant si besoin.)','Delete the flowsheet “'+s.name+'” from this device, with its added zones and info? (Export it first if needed.)'))) return;
    try{ await idbDel('flowsite:'+id); }catch(e){}
    localStorage.setItem(CVKEY,JSON.stringify(cvList().filter(x=>x.id!==id)));
    FLOW_SITES.splice(FLOW_SITES.indexOf(s),1); delete FLOW_PACK[id]; delete FL.zn[id]; delete FL.ov[id]; flZSave(); flSave();
  }else{
    if(!confirm(L('Supprimer « '+s.name+' » de la liste ? Le fichier publié n’est pas effacé : vous pourrez le rétablir ici. (Pour le retirer définitivement, enlevez sa ligne de FLOW_SITES dans index.html.)','Remove “'+s.name+'” from the list? The published file is not erased: you can restore it here. (To remove it for good, delete its line from FLOW_SITES in index.html.)'))) return;
    const h=fhGet(); h[id]=true; try{ localStorage.setItem(FHKEY,JSON.stringify(h)); }catch(e){ toast(T('storage_full')); return; }
    FLOW_OFF.push(...FLOW_SITES.splice(FLOW_SITES.indexOf(s),1));
  }
  if(FL.site===id) FL.site=null;
  try{ bkSchedule(); }catch(e){}
  cvRedraw(); toast(L('Flowsheet supprimé','Flowsheet deleted'));
}
function cvRestore(id){
  const i=FLOW_OFF.findIndex(x=>x.id===id); if(i<0) return;
  FLOW_SITES.push(...FLOW_OFF.splice(i,1)); const h=fhGet(); h[id]=false;
  try{ localStorage.setItem(FHKEY,JSON.stringify(h)); }catch(e){ toast(T('storage_full')); }
  try{ bkSchedule(); }catch(e){}
  cvRedraw(); toast(L('Flowsheet rétabli','Flowsheet restored'));
}
function cvOffBox(){
  if(!FLOW_OFF.length) return '';
  return `<div style="${CVBOX}"><h3 style="margin-top:0">${L('Flowsheets supprimés','Deleted flowsheets')}</h3>`+FLOW_OFF.map(s=>`<div style="border-top:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:center"><div style="flex:1"><b>${esc(s.name)}</b> <span class="meta">(${esc(s.id)})</span></div><button onclick="cvRestore('${esc(s.id)}')">${L('Rétablir','Restore')}</button></div>`).join('')+`</div>`;

/* ---- import d'un .js : lecture SANS exécution (on repère svg:"..." puis data:{...} et on les décode comme du JSON) ---- */
function cvParsePack(txt){
  const m=/FLOW_PACK\[\s*(['"])([^'"]+)\1\s*\]\s*=\s*\{\s*svg\s*:\s*/.exec(txt); if(!m) throw new Error('format');
  const i=m.index+m[0].length; if(txt[i]!=='"') throw new Error('format');
  let j=i+1; while(j<txt.length){ const c=txt[j]; if(c==='\\') j+=2; else if(c==='"') break; else j++; }
  const svg=JSON.parse(txt.slice(i,j+1));
  const m2=/^\s*,\s*data\s*:\s*/.exec(txt.slice(j+1,j+80)); if(!m2) throw new Error('format');
  const k=j+1+m2[0].length; let d=0,s=false,e=k;
  for(;e<txt.length;e++){ const c=txt[e]; if(s){ if(c==='\\') e++; else if(c==='"') s=false; } else if(c==='"') s=true; else if(c==='{'||c==='[') d++; else if(c==='}'||c===']'){ d--; if(d===0) break; } }
  const data=JSON.parse(txt.slice(k,e+1));
  if(!data||!Array.isArray(data.viewBox)||!Array.isArray(data.equipment)) throw new Error('format');
  return {key:m[2],svg,data};
}
async function cvImport(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  try{
    const p=cvParsePack(await cvRead(f,'text')), id=p.data.id||p.key, name=p.data.name||id;
    if(!cvOk(id)) throw new Error(L('Identifiant du fichier invalide : ','Invalid file id: ')+id);
    if(await cvRegister(id,name,{svg:p.svg,data:{...p.data,id,name}})){ toast(p.data.equipment.length+' '+L('équipement(s) importé(s)','item(s) imported')); renderFlow(id); }
  }catch(e){ cvMsg(e.message==='format'?L('Format non reconnu : ce fichier doit être un pack flowsheet (FLOW_PACK[…]={svg:"…", data:{…}}), comme Reims.js.','Unrecognised format: this must be a flowsheet pack (FLOW_PACK[…]={svg:"…", data:{…}}), like Reims.js.'):esc(e.message||String(e)),true); }
}

function glItems(){
  if(GL.items) return GL.items;
  try{ const r=localStorage.getItem(GLKEY); GL.items=r===null?GL_SEED.map(x=>({...x})):(JSON.parse(r)||[]); }catch(e){ GL.items=GL_SEED.map(x=>({...x})); }
  return GL.items;
}
function glSave(){ try{ localStorage.setItem(GLKEY,JSON.stringify(GL.items)); }catch(e){ toast(T('storage_full')); } }
function glUi(){ try{ localStorage.setItem(GLUI,JSON.stringify({mode:GL.mode==='list'?'list':'cards',blur:GL.blur})); }catch(e){} }
const glW=g=>(lang==='en'&&g.word_en)||g.word, glD=g=>(lang==='en'&&g.def_en)||g.def;
/*
 ===================== MODE EVALUATION (mots-clés / définitions) =====================
 Questionnaire à choix multiples : on affiche une définition, il faut retrouver le bon mot parmi 4 propositions.
 RECOMPENSE : si le score atteint le seuil de réussite, on gagne GLE.pct % vers la classe suivante (même barre de progression que les tutos).
   - un seul gain par jour et par personne (settings.glDay), pour éviter de « farmer » les points en refaisant l'évaluation ;
   - uniquement tant que la classe est inférieure à MAXAUTO (les classes 3 et 4 sont données par un administrateur) ;
   - refaire l'évaluation reste toujours possible pour s'entraîner.
 REGLAGES (classes 3 et 4, sur l'écran de départ de l'évaluation) : nombre de questions (n), seuil de réussite en % (pass), gain en % (pct).
 Gardés dans le navigateur (clé GLEKEY, incluse dans la sauvegarde JSON).
*/
const GLEKEY='sibelco_gloss_eval_v1';
const GLE=Object.assign({n:10,pass:80,pct:5},(()=>{ try{ return JSON.parse(localStorage.getItem(GLEKEY))||{}; }catch(e){ return {}; } })());
const glClamp=(v,a,b,d)=>{ v=Math.round(+v); return isNaN(v)?d:Math.max(a,Math.min(b,v)); };
function glESave(){ GLE.n=glClamp(GLE.n,3,50,10); GLE.pass=glClamp(GLE.pass,1,100,80); GLE.pct=glClamp(GLE.pct,1,100,5); try{ localStorage.setItem(GLEKEY,JSON.stringify(GLE)); }catch(e){ toast(T('storage_full')); } }
const glToday=()=>new Date().toLocaleDateString('en-CA');
const glMix=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const glById=id=>glItems().find(x=>x.id===id);

function renderGloss(){
  state.section='glossaire'; state.view='gloss'; $('filters').classList.add('hidden'); buildNav(); glItems();
  const ed=canEditTutos();
  $('app').innerHTML=`<div class="row noprint" style="margin:8px 0;gap:8px;flex-wrap:wrap">
    <h2 style="margin:0">${esc(T('nav_gloss'))}</h2>
    <input id="glQ" type="search" value="${esc(GL.q)}" placeholder="${esc(L('Chercher un mot…','Search a word…'))}" style="min-width:190px;flex:1;max-width:280px" oninput="GL.q=this.value;glRender()">
    <button id="glMc" onclick="glMode('cards')">${L('Cartes','Cards')}</button><button id="glMl" onclick="glMode('list')">${L('Standard','Standard')}</button><button id="glMe" onclick="glMode('eval')">${L('Évaluation','Evaluation')}</button>
    <button id="glBl" onclick="glBlur()" aria-pressed="false">${L('Flouter les définitions','Blur definitions')}</button>
    <button id="glShb" onclick="glShuffle()">${L('Mélanger','Shuffle')}</button>
    ${ed?`<button id="glAdd" class="primary" onclick="glEdit('')">${L('+ Ajouter un mot','+ Add a word')}</button>`:''}</div>
   <p class="meta noprint" id="glHint" style="margin:0 0 8px"></p><div id="glBox"></div>`;
  glRender(); window.scrollTo(0,0);
}
function glRender(){
  const b=$('glBox'); if(!b) return;
  const q=GL.q.trim().toLowerCase(), ed=canEditTutos(), ev=GL.mode==='eval';
  const on=(id,v)=>{ const e=$(id); if(e){ e.classList.toggle('primary',v); e.setAttribute('aria-pressed',v); } };
  on('glMc',GL.mode==='cards'); on('glMl',GL.mode==='list'); on('glMe',ev); on('glBl',GL.mode==='list'&&GL.blur);
  const hide=(id,v)=>{ const e=$(id); if(e) e.classList.toggle('hidden',v); };
  hide('glQ',ev); hide('glShb',ev); hide('glAdd',ev); hide('glBl',GL.mode!=='list');
  const h=$('glHint'); if(h) h.textContent=ev?'':GL.mode==='cards'?L('Touchez une carte pour la retourner et voir la définition.','Tap a card to flip it and see the definition.'):(GL.blur?L('Touchez une définition floutée pour la révéler.','Tap a blurred definition to reveal it.'):'');
  if(ev){ glEvalRender(); return; }
  let l=glItems().filter(g=>!q||[g.word,g.def,g.word_en,g.def_en].join(' ').toLowerCase().includes(q));
  if(GL.shuf) l=l.slice().sort((a,c)=>GL.shuf.indexOf(a.id)-GL.shuf.indexOf(c.id));
  if(!l.length){ b.innerHTML=`<div class="box">${glItems().length?L('Aucun mot ne correspond à la recherche.','No word matches your search.'):L('Aucun mot pour le moment.','No word yet.')}</div>`; return; }
  if(GL.mode==='cards'){
    b.innerHTML=`<div class="glgrid">`+l.map(g=>`<div class="glf" tabindex="0" role="button" aria-label="${esc(glW(g))}" onclick="this.classList.toggle('flip')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('flip')}"><div class="glfi">
      <div class="glfa"><b class="glword">${esc(glW(g))}</b><span class="glhint">${L('Toucher pour voir la définition','Tap to see the definition')}</span></div>
      <div class="glfb"><div class="glbk"><h4>${esc(glW(g))}</h4><p>${esc(glD(g)).replace(/\n/g,'<br>')}</p></div>${canEditTutos()?`<button class="small noprint" onclick="event.stopPropagation();glEdit('${g.id}')">${L('Modifier','Edit')}</button>`:''}</div></div></div>`).join('')+`</div>`;
  } else {
    b.innerHTML=`<div class="gllist">`+l.map(g=>`<div class="glrow"><div class="glw">${esc(glW(g))}</div><div class="gld ${GL.blur&&!GL.rev[g.id]?'blur':''}" onclick="glRev('${g.id}',this)">${esc(glD(g)).replace(/\n/g,'<br>')}</div>${ed?`<button class="small noprint" onclick="glEdit('${g.id}')" title="${esc(L('Modifier','Edit'))}">✎</button>`:'<span></span>'}</div>`).join('')+`</div>`;
  }
}

/* ---- évaluation : écrans (départ / question / résultat) ---- */
function glEvalRender(){
  const b=$('glBox'); if(!b) return; const e=GL.ev, ed=canEditTutos();
  const head=r=>`<div class="glband"><span style="display:flex;align-items:center;gap:10px"><img class="glogo" src="icon-192.png" alt=""><b>${L('Évaluation · mots-clés','Evaluation · keywords')}</b></span><span>${r||''}</span></div>`;
  if(!e){
    const words=glItems().filter(g=>glW(g)&&glD(g)).length, can=words>=2, n=Math.min(GLE.n,words);
    const reward=settings.cls<MAXAUTO?`🎯 ${L('Score ≥','Score ≥')} ${GLE.pass} % → <b>+${GLE.pct} %</b> ${L('vers','toward')} ${esc(clsL(settings.cls+1))} <span class="meta">(${L('1 fois par jour','once a day')})</span>`:`<span class="meta">${L('Vous avez la classe maximale accessible par les tutos : l’évaluation sert d’entraînement.','You have the highest class reachable through tutorials: the evaluation is for practice.')}</span>`;
    b.innerHTML=`<div class="gle">${head('')}<div class="glbody">
      <p style="margin-top:0">${L('On vous montre une définition : retrouvez le bon mot parmi les propositions.','You are shown a definition: find the right word among the options.')}</p>
      <p><b>${can?n:0}</b> ${L('questions','questions')} · ${reward}</p>
      ${progHTML(false)}
      ${can?'':`<div class="box">${L('Il faut au moins 2 mots dans la liste pour lancer une évaluation.','At least 2 words are needed to start an evaluation.')}</div>`}
      <div class="row" style="margin-top:12px"><button class="primary" ${can?'':'disabled'} onclick="glEvalStart()">${L('Commencer l’évaluation','Start the evaluation')}</button></div>
      ${ed?`<details style="margin-top:14px"><summary class="meta">${L('Réglages (classes 3 et 4)','Settings (classes 3 and 4)')}</summary>
        <label>${L('Nombre de questions','Number of questions')}</label><input type="number" min="3" max="50" value="${GLE.n}" style="max-width:120px" onchange="GLE.n=this.value;glESave();glRender()">
        <label>${L('Seuil de réussite (%)','Pass mark (%)')}</label><input type="number" min="1" max="100" value="${GLE.pass}" style="max-width:120px" onchange="GLE.pass=this.value;glESave();glRender()">
        <label>${L('Gain vers la classe suivante (%)','Gain toward next class (%)')}</label><input type="number" min="1" max="100" value="${GLE.pct}" style="max-width:120px" onchange="GLE.pct=this.value;glESave();glRender()"></details>`:''}
    </div></div>`;
    return;
  }
  if(e.done){
    const pass=e.score>=GLE.pass;
    b.innerHTML=`<div class="gle">${head(e.ok+' / '+e.qs.length)}<div class="glbody">
      <div class="glescore" style="${pass?'':'color:#d33'}">${e.score} %</div>
      <p style="text-align:center;margin:0 0 10px"><b>${pass?L('Évaluation réussie !','Evaluation passed!'):L('Pas encore… continuez à réviser.','Not yet… keep revising.')}</b></p>
      <div class="box" style="margin:8px 0">${e.reward}</div>
      ${progHTML(false)}
      ${e.miss.length?`<h4 style="margin:14px 0 6px">${L('À revoir','To review')}</h4>`+e.miss.map(id=>{ const g=glById(id); return g?`<div class="glemiss"><b>${esc(glW(g))}</b> — ${esc(glD(g))}</div>`:''; }).join(''):`<p class="meta">${L('Aucune erreur, bravo !','No mistakes, well done!')}</p>`}
      <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap"><button class="primary" onclick="glEvalStart()">${L('Recommencer','Try again')}</button><button onclick="glMode('cards')">${L('Revoir en cartes','Review with cards')}</button><button onclick="GL.ev=null;glRender()">${L('Quitter','Leave')}</button></div>
    </div></div>`;
    return;
  }
  const q=e.qs[e.i], g=glById(q.id); if(!g){ GL.ev=null; glRender(); return; }
  const last=e.i>=e.qs.length-1;
  b.innerHTML=`<div class="gle">${head((e.i+1)+' / '+e.qs.length)}<div class="glbody">
    <div class="progress"><div style="width:${Math.round(e.i/e.qs.length*100)}%"></div></div>
    <p class="meta" style="margin:10px 0 6px">${L('Quel mot correspond à cette définition ?','Which word matches this definition?')}</p>
    <p class="gleq">${esc(glD(g)).replace(/\n/g,'<br>')}</p>
    ${q.opts.map(id=>{ const o=glById(id); if(!o) return ''; const c=e.ans?(id===q.id?'ok':(id===e.ans?'ko':'')):''; return `<button class="gleo ${c}" ${e.ans?'disabled':''} onclick="glAnswer('${id}')">${esc(glW(o))}</button>`; }).join('')}
    ${e.ans?`<p style="margin:10px 0 0">${e.ans===q.id?'✅ '+L('Bonne réponse !','Correct!'):'❌ '+L('La bonne réponse était : ','The right answer was: ')+'<b>'+esc(glW(g))+'</b>'}</p><div class="row" style="margin-top:10px"><button class="primary" onclick="glNext()">${last?L('Voir le résultat','See the result'):L('Question suivante','Next question')}</button></div>`:''}
  </div></div>`;
}
function glEvalStart(){
  const all=glItems().filter(g=>glW(g)&&glD(g)); if(all.length<2){ toast(L('Il faut au moins 2 mots','At least 2 words needed')); return; }
  const qs=glMix(all).slice(0,Math.min(GLE.n,all.length)).map(g=>{
    const others=glMix(all.filter(x=>x.id!==g.id&&glW(x)!==glW(g))).slice(0,3);
    return {id:g.id,opts:glMix([g,...others]).map(x=>x.id)};
  });
  GL.mode='eval'; GL.ev={qs,i:0,ok:0,ans:null,miss:[],done:false,score:0,reward:''}; glRender(); window.scrollTo(0,0);
}
function glAnswer(id){ const e=GL.ev; if(!e||e.ans) return; const q=e.qs[e.i]; e.ans=id; if(id===q.id) e.ok++; else e.miss.push(q.id); glEvalRender(); }
function glNext(){
  const e=GL.ev; if(!e) return; e.ans=null; e.i++;
  if(e.i>=e.qs.length){ e.score=Math.round(e.ok/e.qs.length*100); e.reward=glEvalReward(e.score); e.done=true; }
  glEvalRender(); window.scrollTo(0,0);
}
/* gain de pourcentage vers la classe suivante (même mécanique que les tutos : à 100 % on passe à la classe suivante, le surplus est reporté) */
function glEvalReward(score){
  if(score<GLE.pass) return '❌ '+L('Score insuffisant : il faut au moins '+GLE.pass+' % pour gagner des points.','Score too low: at least '+GLE.pass+' % is needed to earn points.');
  if(settings.cls>=MAXAUTO) return 'ℹ️ '+L('Classe maximale atteinte par les tutos : pas de points à gagner.','Highest tutorial class reached: no points to earn.');
  const today=glToday();
  if(settings.glDay===today) return 'ℹ️ '+L('Vous avez déjà gagné des points aujourd’hui : revenez demain pour en gagner de nouveau.','You already earned points today: come back tomorrow to earn more.');
  const before=settings.cls; let v=(settings.pct||0)+GLE.pct;
  while(v>=100&&settings.cls<MAXAUTO){ v-=100; settings.cls++; }
  settings.pct=settings.cls>=MAXAUTO?0:v; settings.glDay=today; saveSettings(); buildNav();
  return settings.cls>before?'🎉 '+L('Classe débloquée : ','Class unlocked: ')+clsL(settings.cls)
                            :'🎯 +'+GLE.pct+' % '+L('vers ','toward ')+clsL(settings.cls+1)+' ('+Math.round(settings.pct)+' %)';
}
function glMode(m){ GL.mode=m; if(m==='eval') GL.ev=null; glUi(); glRender(); }
function glBlur(){ GL.blur=!GL.blur; GL.rev={}; glUi(); glRender(); }
function glRev(id,el){ if(!GL.blur) return; GL.rev[id]=!GL.rev[id]; el.classList.toggle('blur',!GL.rev[id]); }
function glShuffle(){ const a=glItems().map(g=>g.id); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } GL.shuf=a; GL.rev={}; glRender(); }
function glEdit(id){
  if(!canEditTutos()){ toast(T('need_cls3')); return; }
  const g=glItems().find(x=>x.id===id)||{id:'',word:'',def:'',word_en:'',def_en:''};
  const old=$('glEd'); if(old) old.remove();
  const d=document.createElement('div'); d.id='glEd'; d.className='flmodal'; d.dataset.gid=g.id;
  d.innerHTML=`<div class="panel"><h3 style="margin-top:0">${g.id?L('Modifier le mot','Edit word'):L('Ajouter un mot','Add a word')}</h3>
   <label>${L('Mot / mot-clé','Word / keyword')}</label><input id="glEw" value="${esc(g.word)}">
   <label>${L('Définition','Definition')}</label><textarea id="glEdf" rows="4">${esc(g.def)}</textarea>
   <label>${L('Mot en anglais (facultatif)','Word in English (optional)')}</label><input id="glEwe" value="${esc(g.word_en||'')}">
   <label>${L('Définition en anglais (facultatif)','Definition in English (optional)')}</label><textarea id="glEde" rows="3">${esc(g.def_en||'')}</textarea>
   <div class="row" style="margin-top:12px;gap:8px"><button class="primary" onclick="glEdSave()">${T('save')}</button><button onclick="glEdClose()">${L('Annuler','Cancel')}</button>${g.id?`<button class="danger" onclick="glEdDel()">${T('delete')}</button>`:''}</div></div>`;
  document.body.appendChild(d); setTimeout(()=>{ const i=$('glEw'); if(i) i.focus(); },50);
}
function glEdClose(){ const d=$('glEd'); if(d) d.remove(); }
function glEdSave(){
  const d=$('glEd'); if(!d) return; const id=d.dataset.gid;
  const word=$('glEw').value.trim(), def=$('glEdf').value.trim();
  if(!word||!def){ toast(L('Le mot et sa définition sont obligatoires','Word and definition are required')); return; }
  const rec={id:id||uid(),word,def,word_en:$('glEwe').value.trim(),def_en:$('glEde').value.trim()}, a=glItems(), i=a.findIndex(x=>x.id===id);
  if(i>=0) a[i]=rec; else a.unshift(rec);
  glSave(); glEdClose(); glRender(); toast(i>=0?L('Mot modifié','Word updated'):L('Mot ajouté','Word added'));
}
function glEdDel(){
  const d=$('glEd'); if(!d) return; const id=d.dataset.gid;
  if(!confirm(L('Supprimer ce mot ?','Delete this word?'))) return;
  GL.items=glItems().filter(x=>x.id!==id); glSave(); glEdClose(); glRender(); toast(L('Mot supprimé','Word deleted'));
}

/*
 ===================== FICHES CONSTRUCTEUR : PLUSIEURS PDF =====================
 Une fiche constructeur peut avoir PLUSIEURS PDF : f.files = [{key,name,size,label}] (key = clé IndexedDB, label = nom affiché, modifiable).
 Sur la fiche, les PDF sont d'abord présentés en LISTE (aucun PDF n'est ouvert d'office) ; on touche celui qu'on veut voir.
 Anciennes fiches (un seul PDF dans f.file, rangé sous la clé f.id) : fFiles() les reconnaît automatiquement.
 Dans l'éditeur : ajout de plusieurs PDF d'un coup, renommage, retrait. Rien n'est stocké avant « Enregistrer » (state.fdAdd / state.fdDel).
 Les autres rubriques (consommables, présentation) restent à un seul fichier.
*/
const fSize=n=>!n?'':(n>1048576?(n/1048576).toFixed(1)+' Mo':Math.round(n/1024)+' Ko');
const fFiles=f=>Array.isArray(f.files)?f.files:(f.file?[{key:f.id,name:f.file.name,size:f.file.size,label:(f.file.name||'').replace(/\.pdf$/i,'')}]:[]);
const FD_ICO='<svg class="fdic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
/* DOSSIERS DANS UNE FICHE : f.folders=[{id,name}] ; chaque PDF a un champ "folder" (id du dossier, vide = hors dossier).
   Ils sont enregistrés avec la fiche (donc aussi dans la sauvegarde et dans donnees.json). */
function fMultiEdHTML(){
  const d=state.fd, fl=d.files||[], fo=d.folders=d.folders||[];
  const inFo=x=>x.folder&&fo.some(o=>o.id===x.folder)?x.folder:'';
  const mv=x=>fo.length?`<select onchange="mvFPdf('${x.key}',this.value)" title="${esc(L('Déplacer dans un dossier','Move to a folder'))}"><option value="">${esc(L('Hors dossier','No folder'))}</option>${fo.map(o=>`<option value="${o.id}" ${inFo(x)===o.id?'selected':''}>${esc(o.name||L('(sans nom)','(unnamed)'))}</option>`).join('')}</select>`:'';
  const rows=fid=>{ const l=fl.map((x,i)=>[x,i]).filter(([x])=>inFo(x)===fid);
    return l.length?`<div class="fpdfs">${l.map(([x,i])=>`<div class="fpdfrow"><span class="fpdfic">PDF</span><input value="${esc(x.label||x.name)}" oninput="state.fd.files[${i}].label=this.value" aria-label="${esc(L('Nom affiché','Display name'))}">${mv(x)}<span class="meta">${fSize(x.size)}</span><button class="small danger" onclick="rmFPdf(${i})">${L('Retirer','Remove')}</button></div>`).join('')}</div>`:''; };
  const add=fid=>`<div class="row" style="margin-top:8px"><input type="file" accept="application/pdf,.pdf" multiple style="max-width:340px" onchange="addFPdfs(this,'${fid}')"></div>`;
  return `<label>${L('Documents PDF','PDF documents')}</label>
   ${rows('')||`<p class="meta" style="margin:4px 0">${L('Aucun PDF hors dossier.','No PDF outside folders.')}</p>`}${add('')}
   ${fo.map((o,j)=>`<div class="fdsec"><div class="fdhead">${FD_ICO}<input value="${esc(o.name)}" placeholder="${esc(L('Nom du dossier','Folder name'))}" oninput="state.fd.folders[${j}].name=this.value"><button class="small danger" onclick="rmFFolder(${j})">${L('Supprimer le dossier','Delete folder')}</button></div>
     ${rows(o.id)||`<p class="meta" style="margin:8px 0 0">${L('Dossier vide : ajoutez des PDF ci-dessous.','Empty folder: add PDFs below.')}</p>`}${add(o.id)}</div>`).join('')}
   <div class="row" style="margin-top:12px"><button onclick="addFFolder()">+ ${L('Ajouter un dossier dans cette fiche','Add a folder in this sheet')}</button></div>
   <label style="margin-top:12px"> ${L('Importer un dossier de mon ordinateur (ses PDF et sous-dossiers)','Import a folder from my computer (its PDFs and subfolders)')}</label>
   <div class="row"><input type="file" webkitdirectory directory multiple style="max-width:340px" onchange="importFFolder(this)"></div>
   <p class="meta" style="margin:6px 0 0">${L('Vous pouvez ajouter plusieurs PDF (30 Mo max chacun), les ranger dans des dossiers et changer leur nom affiché. Sur la fiche, on choisit le PDF à ouvrir dans une liste.','You can add several PDFs (30 MB max each), sort them into folders and change their display name. On the sheet, you pick the PDF to open from a list.')}</p>`;
}
function addFFolder(){
  const n=(prompt(L('Nom du dossier :','Folder name:'))||'').trim(); if(!n) return;
  const d=state.fd; (d.folders=d.folders||[]).push({id:'d'+uid(),name:n}); renderFicheEditor();
}
function rmFFolder(j){
  const d=state.fd, o=(d.folders||[])[j]; if(!o) return;
  if(!confirm(L('Supprimer le dossier « '+(o.name||'')+' » ? Ses PDF sont conservés, hors dossier.','Delete folder “'+(o.name||'')+'”? Its PDFs are kept, outside any folder.'))) return;
  (d.files||[]).forEach(x=>{ if(x.folder===o.id) x.folder=''; }); d.folders.splice(j,1); renderFicheEditor();
}
/* Import d'un dossier entier : chaque sous-dossier devient un dossier de la fiche (les PDF placés directement dans le dossier choisi
   vont dans un dossier portant son nom). Les fichiers qui ne sont pas des PDF, ou de plus de 30 Mo, sont ignorés. */
function importFFolder(inp){
  const all=[...(inp.files||[])]; if(!all.length) return;
  const d=state.fd; d.files=d.files||[]; d.folders=d.folders||[]; state.fdAdd=state.fdAdd||{};
  let bad=0, n=0;
  const list=all.filter(f=>{ const ok=(isPdfName(f.name)||f.type==='application/pdf')&&f.size<=30e6; if(!ok) bad++; return ok; })
    .sort((a,b)=>(a.webkitRelativePath||a.name).localeCompare(b.webkitRelativePath||b.name,undefined,{numeric:true}));
  list.forEach(f=>{
    const p=(f.webkitRelativePath||f.name).split('/'), root=p[0], dirs=p.slice(1,-1);
    const name=dirs.length?dirs.join(' / '):root;
    let o=d.folders.find(x=>(x.name||'').toLowerCase()===name.toLowerCase());
    if(!o){ o={id:'d'+uid(),name}; d.folders.push(o); }

/*
 ===================== GROS FICHIERS : IndexedDB =====================
 Les PDF et PowerPoint sont trop gros pour le localStorage. On les range dans IndexedDB (base "sibelco_files",
 magasin "f"), avec l'identifiant de la fiche comme clé. idbPut = enregistrer, idbGet = lire, idbDel = effacer.
 Dans la fiche elle-même on ne garde que { name, size, kind } (nom, taille, 'pdf' ou 'ppt').
*/
/* EXPLICATION SUPPLÉMENTAIRE : INDEXEDDB : STOCKAGE DES GROS FICHIERS
 Base "sibelco_files", magasin "f" : on y met les PDF et PowerPoint (Blob) sous une clé. idbOp(mode, clé, valeur) encapsule
 les transactions (put = écrire, get = lire, del = supprimer) et renvoie une promesse ; idbPut/idbGet/idbDel sont les raccourcis.
*/
function idb(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('sibelco_files',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function idbOp(m,k,v){
  const db=await idb();
  return new Promise((ok,ko)=>{ const tx=db.transaction('f',m==='get'?'readonly':'readwrite'), st=tx.objectStore('f'); const rq=m==='put'?st.put(v,k):m==='get'?st.get(k):st.delete(k); tx.oncomplete=()=>ok(rq.result); tx.onerror=()=>ko(tx.error); });
}
const idbPut=(k,v)=>idbOp('put',k,v), idbGet=k=>idbOp('get',k), idbDel=k=>idbOp('del',k);
/*
 pickPdf(input) : appelé quand on choisit un fichier dans l'éditeur de fiche.
   - PDF accepté partout ; PowerPoint (.pptx .ppt .ppsx .pps .odp) accepté SEULEMENT dans "Fiches présentation" ;
   - 30 Mo maximum ; le fichier n'est réellement stocké qu'au clic sur "Enregistrer" (saveFiche).
   - isPpt / fileKind : reconnaissent le type d'après l'extension du nom.
 rmPdf() : retire le fichier de la fiche (supprimé au prochain enregistrement).
*/
const isPpt=n=>/\.(pptx?|ppsx?|odp)$/i.test(n||'');                 // vrai si le nom de fichier est un PowerPoint
const isPdfName=n=>/\.pdf$/i.test(n||'');
const fileKind=file=>file&&(file.kind||(isPpt(file.name)?'ppt':'pdf')); // 'ppt' ou 'pdf' (anciennes fiches : déduit du nom)
function pickPdf(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const okPpt=state.fd.type==='presentation';                          // PowerPoint autorisé uniquement dans les fiches présentation
  if(!(isPdfName(f.name)||f.type==='application/pdf'||(okPpt&&isPpt(f.name)))){
    toast(L(okPpt?'Choisissez un PDF ou un PowerPoint (.pptx, .ppt, .ppsx)':'Choisissez un fichier PDF','Choose a '+(okPpt?'PDF or PowerPoint (.pptx, .ppt, .ppsx) file':'PDF file'))); inp.value=''; return;
  }
  if(f.size>30e6){ toast(L('Fichier trop gros (30 Mo max)','File too large (30 MB max)')); inp.value=''; return; }
  state.fdFile=f; state.fdRm=false; state.fd.file={name:f.name,size:f.size,kind:isPpt(f.name)?'ppt':'pdf'}; renderFicheEditor();
}
function rmPdf(){ state.fdFile=null; state.fdRm=true; state.fd.file=null; renderFicheEditor(); }
/*
 AFFICHAGE DES PDF : bibliothèque pdf.js (Mozilla) chargée depuis cdnjs seulement quand on ouvre un PDF
 (et mise en cache par sw.js pour le hors-ligne). showPdf(f) dessine chaque page dans un <canvas>
 (mise en page "à la demande" : une page n'est dessinée que quand on s'en approche - IntersectionObserver).
 Si pdf.js ne se charge pas (pas d'Internet, pas encore en cache), on se rabat sur un cadre <iframe> du navigateur.
*/
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let _pdfjs=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src=PDFJS+'pdf.min.js';
    sc.onload=()=>{ if(!window.pdfjsLib){ _pdfjs=null; return rej(new Error('pdfjs')); } pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; res(pdfjsLib); };
    sc.onerror=()=>{ _pdfjs=null; rej(new Error('pdfjs')); };
    document.head.appendChild(sc);
  });
  return _pdfjs;
}
async function showPdf(f,key,name,boxId){
  key=key||f.id; name=name||(f.file&&f.file.name)||'document.pdf';
  let b,box; try{ b=await idbGet(key); box=$(boxId||'pdfBox'); }catch(e){}
  if(box&&!b){ box.innerHTML=`<div class="box danger">${L('Ce PDF n’est pas disponible sur cet appareil (les PDF sont gardés dans le navigateur où ils ont été ajoutés).','This PDF is not available on this device (PDFs are stored in the browser where they were added).')}</div>`; return; }
  if(!b||!box) return;
  const u=URL.createObjectURL(b);
  box.innerHTML=`<div class="row noprint" style="margin:12px 0"><a class="btn" href="${u}" target="_blank" rel="noopener">${L('Ouvrir le PDF','Open PDF')}</a><a class="btn" href="${u}" download="${esc(name)}">${L('Télécharger','Download')}</a></div><div id="pdfPages" class="pdfpages"><div class="meta">${L('Chargement du PDF…','Loading PDF…')}</div></div>`;
  const pages=$('pdfPages');
  const fallback=()=>{ if(pages.isConnected) pages.innerHTML=`<iframe src="${u}" title="PDF" style="width:100%;height:90vh;border:1px solid var(--line);border-radius:8px"></iframe>`; };
  try{
    const lib=await loadPdfJs();
    const doc=lib.getDocument({data:new Uint8Array(await b.arrayBuffer())});
    const pdf=await Promise.race([doc.promise,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),20000))]);
    if(!pages.isConnected) return;
    pages.innerHTML='';
    const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ io.unobserve(en.target); en.target._render(); } }),{rootMargin:'900px 0px'});
    for(let n=1;n<=pdf.numPages;n++){
      const pg=await pdf.getPage(n); if(!pages.isConnected) return;
      const vp=pg.getViewport({scale:1});
      const div=document.createElement('div'); div.className='pdfpg'; div.style.aspectRatio=vp.width+' / '+vp.height;
      const cv=document.createElement('canvas'); div.appendChild(cv); pages.appendChild(div);
      div._render=async()=>{
        const w=div.clientWidth||pages.clientWidth||800;
        const v=pg.getViewport({scale:(w/vp.width)*Math.min(window.devicePixelRatio||1,2)});
        cv.width=Math.floor(v.width); cv.height=Math.floor(v.height);
        try{ await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise; }catch(e){}
      };
      io.observe(div);
    }
  }catch(e){ fallback(); }
}



/*
 ===================== POWERPOINT (ajout dans "Fiches présentation") =====================
 Un navigateur ne sait pas dessiner un PowerPoint tout seul. Ce qu'on fait ici :
   1) le fichier est stocké dans IndexedDB (comme un PDF) ;
   2) un bouton permet de le TELECHARGER / l'ouvrir dans PowerPoint ;
   3) pour les .pptx / .ppsx : un .pptx est en réalité un ZIP de fichiers XML. La bibliothèque JSZip (chargée
      à la demande depuis cdnjs) l'ouvre ; on lit alors l'ordre des diapositives, le TEXTE de chacune
      (balises <a:t> regroupées par paragraphe <a:p>) et la miniature de la 1re diapo (docProps/thumbnail.jpeg) ;
   4) l'ancien format .ppt (binaire) ne peut pas être lu : seul le téléchargement est proposé.
 Pour un rendu IDENTIQUE à l'écran PowerPoint (images, mise en page, animations figées), le plus simple est
 d'exporter la présentation en PDF (PowerPoint : Fichier > Exporter > Créer un document PDF) et de l'ajouter comme PDF.
*/
/* ---------- POWERPOINT : affichage d'une présentation ajoutée dans une fiche ---------- */
const JSZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
let _jszip=null;
function loadJsZip(){                       // charge JSZip (lecteur de .zip) à la demande, comme pdf.js
  if(window.JSZip) return Promise.resolve(window.JSZip);
  if(_jszip) return _jszip;
  _jszip=new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src=JSZIP;
    sc.onload=()=>window.JSZip?res(window.JSZip):(_jszip=null,rej(new Error('jszip')));
    sc.onerror=()=>{ _jszip=null; rej(new Error('jszip')); };
    document.head.appendChild(sc);
  });
  return _jszip;
}
async function showPpt(f){
  let b,box; try{ b=await idbGet(f.id); box=$('pdfBox'); }catch(e){} if(!b||!box) return;
  const u=URL.createObjectURL(b);           // lien temporaire vers le fichier stocké dans IndexedDB
  const kb=f.file.size?' · '+(f.file.size>1048576?(f.file.size/1048576).toFixed(1)+' Mo':Math.round(f.file.size/1024)+' Ko'):'';
  box.innerHTML=`<div class="row noprint" style="margin:12px 0"><a class="btn" href="${u}" download="${esc(f.file.name)}">${L('Télécharger / ouvrir dans PowerPoint','Download / open in PowerPoint')}</a><span class="meta">${esc(f.file.name)}${kb}</span></div><div id="pptInfo" class="meta">${L('Chargement de l’aperçu…','Loading preview…')}</div>`;
  const info=$('pptInfo');
  const none=()=>{ if(info&&info.isConnected) info.textContent=L('Aperçu indisponible (ancien format .ppt, hors ligne ou fichier non standard) : utilisez le bouton de téléchargement.','Preview unavailable (old .ppt format, offline or non-standard file): use the download button.'); };
  if(!/\.(pptx|ppsx)$/i.test(f.file.name)) return none();   // seuls les formats XML modernes (.pptx/.ppsx) sont lisibles ici
  try{
    const Z=await loadJsZip();
    const zip=await Z.loadAsync(b);          // un .pptx est un zip contenant des fichiers XML
    const parse=async p=>{ const z=zip.file(p); return z?new DOMParser().parseFromString(await z.async('string'),'application/xml'):null; };
    // ordre réel des diapositives : ppt/presentation.xml (liste des r:id) + ppt/_rels/presentation.xml.rels (r:id -> fichier)
    let order=[];
    try{
      const pres=await parse('ppt/presentation.xml'), rels=await parse('ppt/_rels/presentation.xml.rels');
      const map={}; [...rels.getElementsByTagName('Relationship')].forEach(r=>{ map[r.getAttribute('Id')]=r.getAttribute('Target'); });
      order=[...pres.getElementsByTagName('p:sldId')].map(s=>map[s.getAttribute('r:id')]).filter(Boolean)
        .map(t=>'ppt/'+t.replace(/^\/?(ppt\/)?/,''));
    }catch(e){ order=[]; }
    if(!order.length) order=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
    const slides=[];
    for(const p of order){
      const d=await parse(p); if(!d) continue;
      // chaque paragraphe <a:p> regroupe des morceaux de texte <a:t>
      const paras=[...d.getElementsByTagName('a:p')].map(pp=>[...pp.getElementsByTagName('a:t')].map(t=>t.textContent).join('')).filter(s=>s.trim());
      slides.push(paras);
    }
    let thumb=''; const th=zip.file('docProps/thumbnail.jpeg');   // miniature de la 1re diapo (présente dans la plupart des .pptx)
    if(th) thumb=URL.createObjectURL(await th.async('blob'));
    if(!info||!info.isConnected) return;
    if(!slides.length){ return none(); }
    info.outerHTML=`<div id="pptInfo">${thumb?`<img class="pptthumb" src="${thumb}" alt="">`:''}
      <div class="meta" style="margin:6px 0">${slides.length} ${L('diapositive(s) – texte de la présentation :','slide(s) – text of the presentation:')}</div>
      ${slides.map((s,i)=>`<div class="pptslide"><b>${L('Diapo','Slide')} ${i+1}</b>${s.length?s.map((x,j)=>j===0?`<div style="font-weight:600">${esc(x)}</div>`:`<div>${esc(x)}</div>`).join(''):`<span class="meta">${L('(pas de texte – images / schémas)','(no text – images / diagrams)')}</span>`}</div>`).join('')}</div>`;
  }catch(e){ none(); }
}

/*
 ===================== FICHES =====================
 3 rubriques qui partagent le MEME code, distinguées par le champ "type" :
   'constructeur' (fiches constructeur), 'consommables' (pièces consommables), 'presentation' (fiches présentation).
 Une fiche = { id, type, title, cover (image), machine, text, url (lien facultatif), file (PDF/PowerPoint) }.
 Elles sont enregistrées dans le localStorage sous la clé FKEY ; le fichier lui-même dans IndexedDB.
*/
/* ---------- FICHES (constructeur / pièces consommables / présentation) ---------- */
/*
 FSEED = fiche d'exemple fournie au départ (rubrique "présentation").
 fiches = la liste en mémoire ; saveFiches() l'enregistre.
*/
const FSEED=[{id:'f1',type:'presentation',title:'Principe du trieur optique verre',machine:'Tous trieurs',url:'',
 text:'Le verre broyé (calcin) est étalé en nappe fine sur un convoyeur ou une goulotte.\nDes caméras et un éclairage analysent chaque particule.\nLes indésirables détectés sont éjectés par des jets d\'air comprimé (buses).\nÀ compléter avec les spécificités de vos machines (modèle, ligne, réglages).'}];
let fiches=(()=>{try{const r=JSON.parse(localStorage.getItem(FKEY)); if(Array.isArray(r)) return r;}catch(e){} return JSON.parse(JSON.stringify(FSEED));})();
function saveFiches(){ try{localStorage.setItem(FKEY,JSON.stringify(fiches));}catch(e){toast(T('storage_full'));} }
/*
 renderFiches(type) : liste des fiches d'une rubrique, en cartes illustrées (class="cover c-<type>").
 Image de la carte : la photo ajoutée (f.cover) sinon le pictogramme de la rubrique (icoSVG(type)).
 L'étiquette PDF / PowerPoint apparaît à côté de la machine quand un fichier est attaché.
*/
function renderFiches(type){
  state.section=type; state.view='fiches'; $('filters').classList.add('hidden'); buildNav();
  const l=fiches.filter(f=>f.type===type);
  $('app').innerHTML=`<div class="row" style="margin:12px 0;justify-content:space-between"><h2 style="margin:0">${esc(T(type==='constructeur'?'nav_cons':type==='consommables'?'nav_cons2':'nav_pres'))}</h2>${canEditFiche(type)?`<button class="primary" onclick="editFiche('','${type}')">${esc(T('add_fiche'))}</button>`:''}</div>`+
   ((l.length||type==='presentation')?`<div class="grid">${type==='presentation'?m3Card():''}${l.map(f=>`<div class="card tcard" onclick="openFiche('${f.id}')"><div class="cover c-${type}">${f.cover?`<img src="${f.cover}" alt="" loading="lazy">`:icoSVG(type)}</div><h3>${esc(f.title)}</h3><div class="meta"><span>${esc(machineL(f.machine||'Non précisée'))}</span>${fFiles(f).length?`<span>${f.type==='constructeur'?fFiles(f).length+' PDF':(fileKind(f.file)==='ppt'?'PowerPoint':'PDF')}</span>`:''}</div></div>`).join('')}</div>`:`<div class="empty">${esc(T('no_fiche'))}</div>`)+`<p class="disclaimer">${esc(T('footer'))}</p>`;
  window.scrollTo(0,0);
}
/*
 openFiche(id) : page d'une fiche = couverture, titre, texte, lien (si une adresse valide est saisie),
 puis le fichier attaché : PDF -> showPdf(f) ; PowerPoint -> showPpt(f). Les deux écrivent dans <div id="pdfBox">.
 La regex "ok" accepte les liens http(s) et les fichiers locaux de type pdf, images, Word, Excel, PowerPoint, html.
*/
function openFiche(id){
  const f=fiches.find(x=>x.id===id); if(!f) return;
  state.section=f.type; state.view='fiche'; state.fid=id; $('filters').classList.add('hidden'); buildNav();
  const ok=/^(https?:\/\/|\.?\/?[\w\-\/.]+\.(pdf|png|jpe?g|docx?|xlsx?|pptx?|ppsx?|html?))/i.test(f.url||'');
  $('app').innerHTML=`<div class="row noprint" style="margin:12px 0;justify-content:space-between"><button onclick="renderFiches('${f.type}')">${esc(T('back'))}</button><div class="row"><button onclick="window.print()">${esc(T('print'))}</button>${canEditFiche(f.type)?`<button onclick="editFiche('${id}')">${esc(T('edit'))}</button>`:''}</div></div>
   <div class="panel">${f.cover?`<img class="tcover" src="${f.cover}" alt="">`:''}<h2 style="margin-top:0">${esc(f.title)}</h2><div class="meta"><span>${esc(machineL(f.machine||'Non précisée'))}</span></div>
   <p>${esc(f.text).replace(/\n/g,'<br>')}</p><div id=\"pdfBox\"></div>${ok?`<a class="btn" href="${esc(f.url)}" target="_blank" rel="noopener">${esc(T('open_doc'))}</a>`:''}</div>`;
  if(f.type==='constructeur') fPdfList(f); else if(f.file) (fileKind(f.file)==='ppt'?showPpt(f):showPdf(f));
  window.scrollTo(0,0);
}
/*
 editFiche(id,type) : ouvre l'éditeur (id vide = nouvelle fiche). state.fd = la fiche en cours,
 state.fdFile = nouveau fichier choisi (pas encore enregistré), state.fdRm = demande de suppression du fichier.
 fCoverEdHTML / addFCover / rmFCover : choix de l'image d'illustration de la fiche (même principe que readImg).
*/
function editFiche(id,type){
  { const ft=id?(fiches.find(f=>f.id===id)||{}).type:type; if(!canEditFiche(ft)){ toast(T('need_cls3')); return; } }
  state.fnew=!id; state.fdFile=null; state.fdRm=false; state.fdAdd={}; state.fdDel=[]; state.fd=id?JSON.parse(JSON.stringify(fiches.find(f=>f.id===id))):{id:uid(),type,title:'',cover:'',machine:'',text:'',url:''};
  if(state.fd.type==='constructeur'){ state.fd.files=fFiles(state.fd).map(x=>({...x})); state.fd.file=null; }
  renderFicheEditor();
}
function fCoverEdHTML(){
  const d=state.fd;
  return `<label>${L('Image d’illustration (affichée sur la carte, facultatif)','Cover image (shown on the card, optional)')}</label>
   <div class="row"><input type="file" accept="image/*" style="max-width:320px" onchange="addFCover(this)">${d.cover?`<button class="small danger" onclick="rmFCover()">${L('Retirer l’image','Remove image')}</button>`:''}</div>
   ${d.cover?`<img src="${d.cover}" alt="" style="max-width:260px;border-radius:8px;margin-top:8px;display:block">`:''}`;
}
function addFCover(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  readImg(f,720,0.75,u=>{ state.fd.cover=u; $('fcoverEd').innerHTML=fCoverEdHTML(); });
}
function rmFCover(){ state.fd.cover=''; $('fcoverEd').innerHTML=fCoverEdHTML(); }
function renderFicheEditor(){
  const d=state.fd; state.section=d.type; state.view='fedit'; $('filters').classList.add('hidden'); buildNav();
  $('app').innerHTML=`<div class="row noprint" style="margin:12px 0;justify-content:space-between"><button onclick="${state.fnew?`renderFiches('${d.type}')`:`openFiche('${d.id}')`}">${esc(T('cancel'))}</button>
   <div class="row">${state.fnew?'':`<button class="danger" onclick="delFiche()">${esc(T('delete'))}</button>`}<button class="primary" onclick="saveFiche()">${esc(T('save'))}</button></div></div>
   <div class="panel"><label>${esc(T('f_title'))}</label><input value="${esc(d.title)}" oninput="state.fd.title=this.value">
   <div id="fcoverEd">${fCoverEdHTML()}</div>
   <label>${esc(T('f_machine'))}</label><input value="${esc(d.machine)}" oninput="state.fd.machine=this.value" placeholder="${esc(T('ph_machine'))}">
   <label>${esc(T('f_text'))}</label><textarea style="min-height:160px" oninput="state.fd.text=this.value">${esc(d.text)}</textarea>
   <label>${esc(T('f_url'))}</label><input value="${esc(d.url)}" oninput="state.fd.url=this.value" placeholder="${esc(T('ph_url'))}">
   ${d.type==='constructeur'?fMultiEdHTML():`<label>${d.type==='presentation'?'PDF / PowerPoint':'PDF'}</label><div class="row"><input type="file" accept="${d.type==='presentation'?'.pdf,application/pdf,.ppt,.pptx,.pps,.ppsx,.odp,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-powerpoint':'application/pdf'}" style="max-width:320px" onchange="pickPdf(this)"><span class="meta">${esc(d.file?d.file.name:'')}</span>${d.file?`<button class="small danger" onclick="rmPdf()">${d.file&&fileKind(d.file)==='ppt'?L('Retirer le PowerPoint','Remove PowerPoint'):L('Retirer le PDF','Remove PDF')}</button>`:''}</div>${d.type==='presentation'?`<p class="meta" style="margin:6px 0 0">${L('Un seul fichier par fiche (PDF ou PowerPoint, 30 Mo max). Un PowerPoint peut être téléchargé et son texte est affiché ; pour un affichage identique à l’écran, exportez-le en PDF depuis PowerPoint.','One file per sheet (PDF or PowerPoint, 30 MB max). A PowerPoint can be downloaded and its text is shown; for a pixel-perfect display, export it to PDF from PowerPoint.')}</p>`:''}`}</div>`;
}
/*
 saveFiche() : enregistre la fiche (localStorage) ET son fichier (IndexedDB), puis réaffiche la fiche.
 delFiche() : supprime la fiche et son fichier.
*/
async function saveFiche(){
  const d=state.fd; if(!canEditFiche(d.type)){ toast(T('need_cls3')); return; } if(!d.title.trim()){ toast(L('Donne un titre à la fiche','Please give the sheet a title')); return; }
  const i=fiches.findIndex(f=>f.id===d.id); if(i>=0) fiches[i]=d; else fiches.unshift(d);
  try{
    if(d.type==='constructeur'){ for(const k of Object.keys(state.fdAdd||{})) await idbPut(k,state.fdAdd[k]); for(const k of (state.fdDel||[])) await idbDel(k); state.fdAdd={}; state.fdDel=[]; }
    else if(state.fdFile) await idbPut(d.id,state.fdFile); else if(state.fdRm) await idbDel(d.id);
  }catch(e){ toast(L('Stockage du PDF impossible','Cannot store the PDF')); return; }
  saveFiches(); toast(fToast(d.type,i<0?'add':'edit')); openFiche(d.id);
}
function delFiche(){ if(!canEditFiche(state.fd.type)){ toast(T('need_cls3')); return; } if(!confirm(L('Supprimer définitivement cette fiche ?','Delete this sheet permanently?'))) return; const t=state.fd.type; idbDel(state.fd.id).catch(()=>{}); { const o=fiches.find(f=>f.id===state.fd.id); [...(o?fFiles(o):[]).map(x=>x.key),...(state.fdDel||[])].forEach(k=>idbDel(k).catch(()=>{})); } fiches=fiches.filter(f=>f.id!==state.fd.id); saveFiches(); toast(fToast(t,'del')); renderFiches(t); }

/*
 G = l'état de la partie en cours (pièces, score, vies, combo...). Scores : record personnel (gBest) et
 classement de l'appareil (gScores / gRecord / gBoard), par compte utilisateur.
*/
let G=null;
const gBestKey=()=>'sibelco_game_best_'+(settings.id||'x');
function gBest(){ try{ return +localStorage.getItem(gBestKey())||0; }catch(e){ return 0; } }
function gSetBest(v){ try{ localStorage.setItem(gBestKey(),String(v)); }catch(e){} }
const GSKEY='sibelco_game_scores_v1';
function gScores(){ try{ const r=JSON.parse(localStorage.getItem(GSKEY)); if(r&&typeof r==='object') return r; }catch(e){} return {}; }
function gRecord(g){
  const all=gScores(), id=settings.id||'x', r=all[id]||{best:0,sorted:0,games:0,date:0};
  r.games++; r.last=g.score;
  if(g.score>=r.best){ r.best=g.score; r.sorted=g.sorted; r.date=Date.now(); }
  r.best=Math.max(r.best,gBest());
  all[id]=r; try{ localStorage.setItem(GSKEY,JSON.stringify(all)); }catch(e){}
}
function gBoard(){
  const box=$('glb'); if(!box) return;
  const all=gScores();
  const rows=users.map(u=>{ const r=all[u.id]||{}; let b=r.best||0; try{ b=Math.max(b,+localStorage.getItem('sibelco_game_best_'+u.id)||0); }catch(e){}
    return {id:u.id,name:u.name||u.id,best:b,sorted:r.sorted||0,games:r.games||0,date:r.date||0}; })
    .filter(r=>r.best>0).sort((a,b)=>b.best-a.best||b.sorted-a.sorted||a.date-b.date);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  box.innerHTML=`<div class="panel"><h2 style="margin-top:0">🏆 ${L('Classement général','Overall ranking')}</h2>`+
   (rows.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem">

    rows.map((r,i)=>`<tr style="border-top:1px solid var(--line);${r.id===settings.id?'font-weight:700;background:rgba(45,143,224,.15)':''}"><td style="padding:8px 4px;white-space:nowrap">${medal(i)}</td><td style="padding:8px 4px">${esc(r.name)}${r.id===settings.id?' ('+L('vous','you')+')':''}</td><td style="padding:8px 4px;text-align:right">${r.best}</td><td style="padding:8px 4px;text-align:right">${r.sorted||'–'}</td><td style="padding:8px 4px;text-align:right">${r.games||'–'}</td></tr>`).join('')+
    `</tbody></table></div>`:`<div class="empty">${L('Aucun score pour le moment. Soyez le premier !','No score yet. Be the first!')}</div>`)+

}

 renderSortGame() : page du jeu (canvas + 4 gros boutons + classement). Clavier : touches 1 à 4.

function gMsg(t,col){ const m=$('gmsg'); if(m){ m.textContent=t||''; m.style.color=col||'var(--text)'; } }
function gHud(g){
  const sc=$('gsc'), li=$('gli'), be=$('gbest'); if(!sc) return;
  sc.innerHTML=`<b>Score</b> ${g.score} · ${L('Niv.','Lv.')} ${gLevel(g)}`+(g.combo>1?` · x${g.combo}`:'');
  li.innerHTML=`<span style="color:#e04b4b;letter-spacing:2px">${'♥'.repeat(Math.max(0,g.lives))}${'♡'.repeat(Math.max(0,3-g.lives))}</span>`;
  be.textContent=L('Record','Best')+' '+gBest();
}
/*
 MOTEUR DU JEU :
   gameInit()  prépare le canvas (netteté sur écrans haute densité : dpr)   gameStart()  lance la partie
   gLevel / gSpeed  niveau et vitesse qui augmentent avec le nombre de pièces triées
   gSpawn()  fait apparaître une pièce   gUpdate(g,dt)  fait avancer les pièces (dt = temps écoulé)
   gSort(bin)  vérifie le choix du joueur   gFail  perd une vie   gOver  fin de partie + enregistrement du score
*/
/* EXPLICATION SUPPLÉMENTAIRE : BOUCLE D'UN JEU CANVAS (Trieur Sibelco)
 gameInit() prépare le canvas (résolution adaptée aux écrans Retina via dpr) et l'objet g = tout l'état du jeu (score, vies, pièces...).
 loop() tourne à chaque image : gUpdate(g,dt) fait avancer le jeu, gRender(g) le dessine. Elle s'arrête seule quand on quitte la page
 (G!==g ou canvas détaché). Touches 1-4 = bacs de tri ; gSort() vérifie si la pièce a été mise dans le bon bac.
*/
function gameInit(){
  if(G&&G.raf) cancelAnimationFrame(G.raf);
  const cv=$('gcv'), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=GW*dpr; cv.height=GH*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const g=G={cv,ctx,state:'ready',items:[],fx:[],score:0,lives:3,combo:0,sorted:0,spawn:0,off:0,last:0,raf:0,newBest:false};
  gHud(g); gMsg('');
  if(!window._gkey){ window._gkey=true; document.addEventListener('keydown',e=>{ if(!G||!G.cv.isConnected) return; const i='1234'.indexOf(e.key); if(i>=0&&e.key.length===1) gSort(i); }); }
  const loop=ts=>{
    if(G!==g||!cv.isConnected) return;
    const dt=Math.min(.05,(ts-(g.last||ts))/1000); g.last=ts;
    gUpdate(g,dt); gRender(g);
    g.raf=requestAnimationFrame(loop);
  };
  g.raf=requestAnimationFrame(loop);
}
function gameStart(){
  const g=G; if(!g) return;
  Object.assign(g,{state:'play',items:[],fx:[],score:0,lives:3,combo:0,sorted:0,spawn:.2,newBest:false});
  $('gplay').classList.add('hidden'); gMsg(''); gHud(g);
}
function gLevel(g){ return 1+Math.floor(g.sorted/8); }
/* EXPLICATION SUPPLÉMENTAIRE : DIFFICULTE PROGRESSIVE
 Plus on trie de pièces (g.sorted), plus la vitesse de chute augmente (plafonnée), plus les pièces apparaissent vite (gUpdate),
 et à partir de 6 pièces certaines dérivent latéralement (vx). gLevel() = niveau affiché (+1 toutes les 8 pièces).
*/
function gSpeed(g){ return 90+Math.min(150,g.sorted*3.5); }
function gSpawn(g){
  const glass=Math.random()<Math.max(.35,.5-g.sorted*.004), pool=GITEMS.filter(i=>glass?i.bin<3:i.bin===3);
  const t=pool[Math.floor(Math.random()*pool.length)];
  g.items.push(Object.assign({},t,{x:40+Math.random()*(GW-80),y:-30,rot:(Math.random()-.5)*.8,vr:(Math.random()-.5)*.8,vx:g.sorted>=6?(Math.random()-.5)*70:0}));
}
function gUpdate(g,dt){
  g.off=(g.off+(g.state==='play'?gSpeed(g):30)*dt)%40;
  g.fx=g.fx.filter(f=>(f.life-=dt)>0);
  if(g.state!=='play') return;
  g.spawn-=dt;
  if(g.spawn<=0){ gSpawn(g); if(g.sorted>=15&&Math.random()<.3) setTimeout(()=>{ if(G===g&&g.state==='play') gSpawn(g); },180); g.spawn=Math.max(.4,1.05-g.sorted*.022); }
  const sp=gSpeed(g);
  g.items.forEach(it=>{ it.y+=sp*dt; it.rot+=it.vr*dt; if(it.vx){ it.x+=it.vx*dt; if(it.x<24||it.x>GW-24) it.vx=-it.vx; } });
  for(let i=g.items.length-1;i>=0&&g.state==='play';i--){
    const it=g.items[i];
    if(it.y>GLINE){ g.items.splice(i,1); gFail(g,it,L('Trop tard ! ','Too late! ')+L(it.fr,it.en)+'.'); }
  }
}
function gFail(g,it,msg){
  g.lives--; g.combo=0;
  g.fx.push({x:it.x,y:Math.min(it.y,GLINE-10),life:.6,max:.6,txt:'✗',col:'#e04b4b'});
  gMsg(msg,'var(--danger-line)'); gHud(g);
  if(g.lives<=0) gOver(g);
}
function gSort(bin){
  const g=G; if(!g||g.state!=='play'||!g.items.length) return;
  let k=0; g.items.forEach((it,j)=>{ if(it.y>g.items[k].y) k=j; });
  const it=g.items.splice(k,1)[0];
  if(it.bin===bin){
    g.combo++; g.sorted++;
    const pts=10*(1+Math.floor((g.combo-1)/5)); g.score+=pts+Math.floor(g.sorted/8);
    g.fx.push({x:it.x,y:it.y,life:.3,max:.3,jet:true,col:GBINS[bin].col});
    g.fx.push({x:it.x,y:it.y,life:.6,max:.6,txt:'+'+pts,col:'#4cc57f'});
    gMsg(it.bin===3?L(it.fr+' : bien rejeté !',it.en+': rightly rejected!'):'','var(--ok)'); gHud(g);
  } else {
    const nm=L(it.fr,it.en), bn=L(GBINS[bin].fr,GBINS[bin].en);
    let m;
    if(it.bin===3) m=nm+' → '+L('Refus','Reject')+'. '+L(it.tfr,it.ten);
    else if(bin===3) m=L('Du bon verre rejeté : on perd de la matière recyclable.','Good glass rejected: recyclable material is lost.');
    else m=nm+' ≠ '+bn+'. '+L('Mélanger les couleurs change la teinte du verre recyclé.','Mixing colours changes the colour of recycled glass.');
    gFail(g,it,m);
  }
}
function gOver(g){
  g.state='over'; g.items=[];
  const b=gBest(); if(g.score>b){ gSetBest(g.score); g.newBest=true; }
  gRecord(g); gBoard();
  gMsg(L('Partie terminée','Game over')+' – '+g.score+' pts · '+g.sorted+' '+L('pièces triées','items sorted')+(g.newBest?' · '+L('Nouveau record !','New best!'):'')+'\n'+L('Le saviez-vous ? Le verre se recycle à l\'infini sans perdre en qualité.','Did you know? Glass can be recycled endlessly without losing quality.'));
  $('gmsg').style.whiteSpace='pre-line';
  $('gplay').textContent=L('Rejouer','Play again'); $('gplay').classList.remove('hidden'); gHud(g);
}
/*
 ===================== ILLUSTRATIONS : LES PIECES DU JEU =====================
 Les pièces ne sont pas des images : elles sont DESSINEES à chaque image avec l'API canvas.
   gPoly(ctx,[x1,y1,x2,y2,...]) trace un polygone à partir d'une liste de points.
   gItem(ctx,it) : dessine la pièce "it" selon sa forme (it.shape). On se place au centre de la pièce
   (translate) et on la fait tourner (rotate), donc toutes les coordonnées sont relatives au CENTRE (0,0).
   fillStyle = couleur de remplissage, strokeStyle = couleur du contour, globalAlpha = transparence,
   moveTo/lineTo = lignes, quadraticCurveTo = courbes, arc = cercle.
 POUR CHANGER L'ASPECT D'UNE PIECE : modifier les couleurs (#7d7f83 ...) ou les points dans la branche de sa forme.
 POUR AJOUTER UNE PIECE : ajouter un "else if(it.shape==='monobjet'){ ... }" puis une ligne dans GITEMS.
*/
function gPoly(ctx,pts){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); }
function gItem(ctx,it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot); ctx.lineWidth=1.5; ctx.lineJoin='round';
  if(it.shape==='bottle'){
    ctx.globalAlpha=.92; ctx.fillStyle=it.col; ctx.strokeStyle='rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.moveTo(-5,-22); ctx.lineTo(5,-22); ctx.lineTo(5,-10); ctx.quadraticCurveTo(13,-6,13,4); ctx.lineTo(13,20); ctx.quadraticCurveTo(13,24,9,24); ctx.lineTo(-9,24); ctx.quadraticCurveTo(-13,24,-13,20); ctx.lineTo(-13,4); ctx.quadraticCurveTo(-13,-6,-5,-10); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.globalAlpha=.55; ctx.fillStyle='#fff'; ctx.fillRect(-9,0,3,18);
  } else if(it.shape==='stone'){
    ctx.fillStyle='#7d7f83'; ctx.strokeStyle='#4a4c50'; gPoly(ctx,[-16,-4,-8,-14,6,-15,16,-5,14,9,2,15,-11,12]); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5c5e62'; ctx.fillRect(-6,-4,3,3); ctx.fillRect(4,3,3,3); ctx.fillRect(-2,8,2,2);
  } else if(it.shape==='shard'){
    ctx.fillStyle='#f1e8d6'; ctx.strokeStyle='#b9a98c'; gPoly(ctx,[-16,10,-4,-16,14,-6,10,14]); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#3b6fb0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-9,4); ctx.lineTo(8,-2); ctx.stroke();
  } else if(it.shape==='cap'){
    ctx.fillStyle='#aab2ba'; ctx.strokeStyle='#6b747c'; ctx.beginPath(); ctx.arc(0,0,14,0,6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); for(let a=0;a<12;a++){ const r=a*Math.PI/6; ctx.moveTo(Math.cos(r)*11,Math.sin(r)*11); ctx.lineTo(Math.cos(r)*14,Math.sin(r)*14); } ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,7,0,6.2832); ctx.stroke();
  } else if(it.shape==='pyrex'){
    ctx.globalAlpha=.9; ctx.fillStyle='#d9f0f7'; ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(16,-6); ctx.lineTo(12,14); ctx.lineTo(-12,14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(-20,-9); ctx.moveTo(16,-6); ctx.lineTo(20,-9); ctx.stroke();
    ctx.globalAlpha=.5; ctx.fillStyle='#fff'; ctx.fillRect(-9,-2,3,12);
  } else if(it.shape==='bag'){
    ctx.globalAlpha=.85; ctx.fillStyle='#e0638a'; ctx.strokeStyle='#a8385c';
    ctx.beginPath(); ctx.moveTo(-14,-10); ctx.quadraticCurveTo(0,-16,14,-10); ctx.quadraticCurveTo(18,0,12,12); ctx.quadraticCurveTo(0,18,-12,12); ctx.quadraticCurveTo(-18,0,-14,-10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(-8,-6); ctx.lineTo(-2,8); ctx.moveTo(6,-8); ctx.lineTo(2,6); ctx.stroke();
  }
  ctx.restore();
}
/*
 gRender(g) : dessine une image complète : fond bleu, bacs, ligne des buses, pièces, effets, messages.
*/
function gRender(g){
  const c=g.ctx;
  c.clearRect(0,0,GW,GH);
  c.fillStyle='#0f2a44'; c.fillRect(0,0,GW,GH);
  c.strokeStyle='rgba(255,255,255,.07)'; c.lineWidth=2;
  for(let y=-40+g.off;y<GH;y+=40){ c.beginPath(); c.moveTo(0,y); c.lineTo(GW,y); c.stroke(); }
  c.fillStyle='#0a1d30'; c.fillRect(0,GLINE,GW,GH-GLINE);
  c.strokeStyle='#2d8fe0'; c.setLineDash([8,6]); c.lineWidth=2; c.beginPath(); c.moveTo(0,GLINE); c.lineTo(GW,GLINE); c.stroke(); c.setLineDash([]);
  c.fillStyle='#5aaeea'; for(let x=20;x<GW;x+=40){ c.beginPath(); c.arc(x,GLINE+12,4,0,6.2832); c.fill(); }
  c.fillStyle='rgba(255,255,255,.55)'; c.font='600 12px system-ui,sans-serif'; c.textAlign='center';
  c.fillText(L('ZONE D\'ÉJECTION','EJECTION ZONE'),GW/2,GLINE+38);
  g.items.forEach(it=>gItem(c,it));
  if(g.state==='play'&&g.items.length){
    let k=0; g.items.forEach((it,j)=>{ if(it.y>g.items[k].y) k=j; });
    const t=g.items[k]; c.strokeStyle='#fff'; c.lineWidth=2; c.setLineDash([5,4]); c.beginPath(); c.arc(t.x,t.y,30,0,6.2832); c.stroke(); c.setLineDash([]);
  }
  g.fx.forEach(f=>{
    const p=1-f.life/f.max;
    if(f.jet){ c.globalAlpha=1-p; c.strokeStyle=f.col; c.lineWidth=4; c.beginPath(); c.arc(f.x,f.y,12+p*34,0,6.2832); c.stroke(); c.globalAlpha=1; }
    else { c.globalAlpha=1-p; c.fillStyle=f.col; c.font='700 20px system-ui,sans-serif'; c.textAlign='center'; c.fillText(f.txt,f.x,f.y-p*30); c.globalAlpha=1; }
  });
  if(g.state!=='play'){
    c.fillStyle='rgba(10,29,48,.72)'; c.fillRect(0,0,GW,GH);
    c.fillStyle='#fff'; c.textAlign='center'; c.font='700 26px system-ui,sans-serif';
    c.fillText(g.state==='over'?L('Partie terminée','Game over'):L('Trieur Sibelco','Sibelco Sorter'),GW/2,GH/2-10);
    c.font='500 15px system-ui,sans-serif'; c.fillStyle='#c5d6ea';
    c.fillText(g.state==='over'?(g.score+' pts'):L('Appuyez sur « Jouer »','Press “Play”'),GW/2,GH/2+20);
  }
}

/*
 (Les 4 jeux suivants réutilisent le même système de comptes pour les scores.)
*/
/* ======================================================================
   JEUX : MENU + QUIZ / VRAI-FAUX / MÉMOIRE / REMETTRE DANS L’ORDRE
   (le jeu « Trieur Sibelco » est plus haut ; ceux-ci réutilisent les mêmes
   comptes pour enregistrer les scores et afficher un classement)
   ====================================================================== */
/*
 SCORES DES 4 JEUX : stockés dans le localStorage sous G2KEY, par jeu puis par utilisateur.
   g2Record(jeu,score) enregistre une partie et indique si c'est un nouveau record ;
   g2Board(jeu,idDeLaZone) affiche le classement.   shuffle(tableau) mélange un tableau.
*/
const G2KEY='sibelco_games2_v1';   // scores : { jeu : { idUtilisateur : {best,games,date,last} } }
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const G2NAME={quiz:['Quiz maintenance','Maintenance quiz'],vf:['Vrai ou faux','True or false'],link:['Relier','Link'],order:['Dans l’ordre','Put in order']};

/* Lecture / écriture des scores (localStorage) */
function g2All(){ try{ const r=JSON.parse(localStorage.getItem(G2KEY)); if(r&&typeof r==='object') return r; }catch(e){} return {}; }
function g2Best(game){ const r=(g2All()[game]||{})[settings.id||'x']; return r?r.best:0; }
function g2Record(game,score){            // renvoie true si c’est un nouveau record personnel
  const all=g2All(), t=all[game]||(all[game]={}), id=settings.id||'x';
  const r=t[id]||(t[id]={best:0,games:0,date:0});
  r.games++; r.last=score;
  const nb=score>r.best; if(nb){ r.best=score; r.date=Date.now(); }
  try{ localStorage.setItem(G2KEY,JSON.stringify(all)); }catch(e){}
  return nb;
}
/* Classement des comptes de l’appareil pour un jeu, affiché dans #boxId */
function g2Board(game,boxId){
  const box=$(boxId); if(!box) return;
  const t=g2All()[game]||{};
  const rows=users.map(u=>({id:u.id,name:u.name||u.id,best:(t[u.id]||{}).best||0,games:(t[u.id]||{}).games||0}))
    .filter(r=>r.best>0).sort((a,b)=>b.best-a.best||a.games-b.games);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  box.innerHTML=`<div class="panel"><h2 style="margin-top:0">🏆 ${L('Classement','Ranking')}</h2>`+
   (rows.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem"><thead><tr style="text-align:left;color:var(--muted);font-size:.75rem"><th style="padding:6px 4px">#</th><th style="padding:6px 4px">${L('Joueur','Player')}</th><th style="padding:6px 4px;text-align:right">${L('Meilleur score','Best score')}</th><th style="padding:6px 4px;text-align:right">${L('Parties','Games')}</th></tr></thead><tbody>`+
    rows.map((r,i)=>`<tr style="border-top:1px solid var(--line);${r.id===settings.id?'font-weight:700;background:rgba(45,143,224,.15)':''}"><td style="padding:8px 4px">${medal(i)}</td><td style="padding:8px 4px">${esc(r.name)}${r.id===settings.id?' ('+L('vous','you')+')':''}</td><td style="padding:8px 4px;text-align:right">${r.best}</td><td style="padding:8px 4px;text-align:right">${r.games}</td></tr>`).join('')+
    `</tbody></table></div>`:`<div class="empty">${L('Aucun score pour le moment. Soyez le premier !','No score yet. Be the first!')}</div>`)+
   `<p class="meta" style="margin:8px 0 0;font-size:.75rem">${L('Classement des comptes de cet appareil.','Ranking of the accounts on this device.')}</p></div>`;
}
