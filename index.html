<html lang="fr">
<head>
<meta charset="utf-8">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f2f5f9;--card:#ffffff;--text:#1b2733;--muted:#5d6b78;--line:#dbe1e7;
  --brand:#0a2f5a;--accent:#0a5aa8;--accent-text:#ffffff;--ok:#1a8a4a;--warn-bg:#fff4d6;--warn-line:#e0a800;--warn-text:#5c4300;
  --danger-bg:#fde8e8;--danger-line:#d33;--danger-text:#7a1414;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c;--card:#19222b;--text:#e8edf2;--muted:#9aa9b6;--line:#2c3a47;
    --brand:#0a2540;--accent:#5aaeea;--accent-text:#04121f;--ok:#4cc57f;--warn-bg:#3a2f0b;--warn-line:#c99a00;--warn-text:#ffe29a;
    --danger-bg:#3d1717;--danger-line:#e66;--danger-text:#ffb3b3;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c;--card:#19222b;--text:#e8edf2;--muted:#9aa9b6;--line:#2c3a47;
  --brand:#0a2540;--accent:#5aaeea;--accent-text:#04121f;--ok:#4cc57f;--warn-bg:#3a2f0b;--warn-line:#c99a00;--warn-text:#ffe29a;
  --danger-bg:#3d1717;--danger-line:#e66;--danger-text:#ffb3b3;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
header{background:var(--brand);color:#fff;border-bottom:3px solid #2d8fe0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{font-size:1.15rem;margin:0}
h1 small{display:block;font-weight:400;color:#c5d6ea;font-size:.8rem}
header button.primary,header .lang button.on{background:#2d8fe0;border-color:#2d8fe0;color:#fff}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger-line);border-color:var(--danger-line)}
button.small{padding:4px 8px;font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:640px){.filters{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border-radius:999px;padding:4px 12px;font-size:.85rem}
.chip.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-size:1rem}
.meta{color:var(--muted);font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.valide{color:var(--ok);border-color:var(--ok)}
.tag.avalider{color:var(--warn-line);border-color:var(--warn-line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.box{border-left:4px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-text);padding:10px 12px;border-radius:6px;margin:10px 0}
.box.danger{border-left-color:var(--danger-line);background:var(--danger-bg);color:var(--danger-text)}
.box ul{margin:4px 0 0 18px;padding:0}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .2s}
.step{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700}
.step.done .num{background:var(--ok)}
.step.done .txt{color:var(--muted);text-decoration:line-through}
.step .body{flex:1;min-width:0}
.step img{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
.step label.chk{display:flex;gap:8px;align-items:center;margin:8px 0 0;color:var(--muted);cursor:pointer}
.step input[type=checkbox]{width:20px;height:20px;padding:0}
.edit-step{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--bg)}
.hidden{display:none!important}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.disclaimer{font-size:.8rem;color:var(--muted);margin-top:24px}
.lang{display:flex}
.lang button{border-radius:0;padding:8px 10px;font-size:.85rem}
.lang button:first-child{border-radius:8px 0 0 8px}
.lang button:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.lang button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
@media print{
  header,.noprint,.toast{display:none!important}
  body{background:#fff;color:#000}
  .panel,.card{border-color:#999}
}
.brand{display:flex;align-items:center;gap:12px}
.logo{height:40px;width:auto;background:#fff;padding:4px 8px;border-radius:6px}

/* Décor : motifs de verre (bouteille, pot, verre) en filigrane sur le fond */

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body::before{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22 viewBox=%220 0 240 240%22 fill=%22none%22 stroke=%22%235aaeea%22 stroke-opacity=%220.12%22 stroke-width=%222%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22%3E%3Cg transform=%22translate%2830 20%29%22%3E%3Cpath d=%22M20 0h10v8c0 6 10 12 10 28v62a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6V36C10 20 20 14 20 8z%22/%3E%3Cpath d=%22M14 56h22M14 78h22%22/%3E%3C/g%3E%3Cg transform=%22translate%28140 30%29%22%3E%3Cpath d=%22M6 0h38v10H6z%22/%3E%3Cpath d=%22M10 10h30c4 6 6 12 6 22v40a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8V32c0-10 2-16 6-22z%22/%3E%3C/g%3E%3Cg transform=%22translate%2870 140%29%22%3E%3Cpath d=%22M10 0h30c0 22-4 36-15 40C14 36 10 22 10 0z%22/%3E%3Cpath d=%22M25 40v36M12 76h26%22/%3E%3C/g%3E%3Cg transform=%22translate%28200 150%29 rotate%2825%29%22%3E%3Cpath d=%22M10 0h8v6c0 5 8 9 8 22v46a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V28C2 15 10 11 10 6z%22/%3E%3C/g%3E%3Ccircle cx=%2220%22 cy=%22190%22 r=%225%22/%3E%3Ccircle cx=%22125%22 cy=%22105%22 r=%224%22/%3E%3Ccircle cx=%22215%22 cy=%2295%22 r=%226%22/%3E%3Cpath d=%22M105 215l10-12 8 10zM180 225l7-10 9 6z%22/%3E%3C/svg%3E")}
}
@media print{body::before{display:none}}

/* Photo de fond : si le fichier fond-verre.jpg existe, il remplace le motif (voile = lisibilité) */
html.photo body::before{background-image:linear-gradient(rgba(242,245,249,.88),rgba(242,245,249,.88)),url("fond-verre.jpg");background-size:cover;background-position:center}
@media (prefers-color-scheme: dark){
  html.photo:not([data-theme="light"]) body::before{background-image:linear-gradient(rgba(16,22,28,.88),rgba(16,22,28,.88)),url("fond-verre.jpg")}
}

/* Menu latéral + classes */
#side{position:fixed;top:0;bottom:0;left:0;width:220px;background:var(--card);border-right:1px solid var(--line);z-index:30;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;overflow:auto}
#side .nb{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px}
#side .nb.on{background:var(--accent);color:var(--accent-text);font-weight:600}
#side .sp{flex:1}
.menu-btn,#scrim{display:none}
@media(min-width:781px){body{padding-left:220px}}
@media(max-width:780px){#side{transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}.menu-btn{display:inline-block}#scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}}
.cls{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff}
.cls0{background:#c0392b}.cls1{background:#b9770e}.cls2{background:#1a8a4a}.cls3{background:#0a5aa8}
.card.locked{opacity:.6}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:12px 0}
a.btn{display:inline-block;text-decoration:none;color:var(--accent)}
@media print{#side{display:none!important}body{padding-left:0!important}}

#side{background:var(--brand);border-right:3px solid #2d8fe0}
#side .nb{color:#fff}#side .nb:hover{background:rgba(255,255,255,.12)}#side .nb.on{background:#2d8fe0;color:#fff}
#side .meta{color:#c5d6ea}
header .wrap{max-width:none;padding:6px 14px}
.menu-btn{display:inline-flex!important;align-items:center;justify-content:center;padding:5px 8px;border-radius:8px}
.menu-btn svg{width:1.2em!important;height:1.2em!important}
#side{transform:translateX(-100%);transition:transform .2s;width:200px;padding-left:8px;padding-right:8px}
#side.open{transform:none;box-shadow:4px 0 18px rgba(0,0,0,.25)}
body{transition:padding-left .2s}
@media(min-width:781px){body{padding-left:0}body.nav-pinned{padding-left:200px}}
@media(max-width:780px){body.nav-pinned{padding-left:0}}
header .top{gap:8px}
header .brand{gap:8px}
header .logo,header.big .logo{height:clamp(30px,4vw,38px);padding:3px 8px;border-radius:6px}
header h1,header.big h1{font-size:.98rem;line-height:1.2}
header h1 small,header.big h1 small{font-size:.72rem}
header .lang button,header.big .lang button{font-size:.72rem;padding:4px 8px;line-height:1.2}
header .tbtn{font-size:.8rem;padding:5px 10px}
header .filters{margin-top:6px;gap:6px}
header .filters input,header .filters select{padding:5px 9px;font-size:.88rem}
header.big .wrap{padding:6px 14px}
header.big .menu-btn{font-size:1rem;padding:5px 8px}
#side .nb{font-size:.88rem;padding:7px 10px;border-radius:7px}
#side .nb.ib{width:auto;padding:5px 7px;display:inline-flex;align-items:center}
#side .nb.ib svg{width:1.15em;height:1.15em}
#side .nb.pinbtn.on{background:rgba(255,255,255,.24)}
#side .sidehd .cls{font-size:.68rem;white-space:nowrap;padding:2px 8px}
#side .sidehd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 0 8px}
@media(max-width:780px){#side .pinbtn{display:none!important}}
/* Accueil / contenus plus compacts */
#app h2{font-size:1.2rem}
.panel{padding:14px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tiles .card h3{font-size:.95rem}
/* Cartes de tutoriel avec image d'illustration */
.card.tcard{overflow:hidden}
.card .cover{margin:-14px -14px 4px;aspect-ratio:2/1;overflow:hidden;background:linear-gradient(135deg,#0a2f5a,#2d8fe0);display:grid;place-items:center}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.card .cover svg{width:34%;height:34%;stroke:#fff;stroke-opacity:.55;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tcover{width:100%;max-height:320px;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block}
/* PDF affiché en entier (toutes les pages, sans cadre défilant) */
.pdfpages{display:flex;flex-direction:column;gap:10px;align-items:center}
.pdfpg{width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.18)}
.pdfpg canvas{width:100%;height:auto;display:block;border-radius:6px}
body.nav-open .menu-btn{display:none!important}
body.nolog{padding-left:0!important}body.nolog #side,body.nolog header,body.nolog #scrim{display:none!important}

<body>

<header class="noprint">
  <div class="wrap">
    <div class="top">
      <button class="menu-btn" onclick="toggleNav()" aria-label="Menu"><svg viewBox="0 0 24 24" width="1.6em" height="1.6em" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="display:block"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 class="brand">
      <a href="https://www.sibelco.com/en/country/france" target="_blank" rel="noopener" title="Sibelco France" style="display:inline-flex"><img src="icon-512.png" alt="Sibelco" class="logo"></a>
      <span><span data-i18n="app_title"></span> <small data-i18n="app_sub"></small></span>

      steps:e.steps.map((s,i)=>({text:s[0],warn:s[1],img:(t.steps[i]&&t.steps[i].img)||''}))});
  }
  return t;

function applyStatic(){

  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{ e.placeholder=T(e.dataset.i18nPh); });
  $('bAuto').classList.toggle('on',langMode==='auto');
  $('bFr').classList.toggle('on',langMode==='fr');
  $('bEn').classList.toggle('on',langMode==='en');
  const fs=$('fStatus'), cur=fs.value;
  fs.innerHTML=`<option value="">${esc(T('all_status'))}</option>`+Object.keys(STATUS_L.fr).map(k=>`<option value="${k}" ${k===cur?'selected':''}>${esc(statusL(k))}</option>`).join('');
}
function setLang(l){
  langMode=(l==='fr'||l==='en')?l:'auto';
  lang=langMode==='auto'?detectLang():langMode;
  try{ localStorage.setItem(LANG_KEY,langMode); }catch(e){}
  $('fMachine').value='';
  applyStatic();
  if(state.view==='view' && state.id) openTuto(state.id);
  else if(state.view==='edit') renderEditor();
  else renderSection();
}

/* ---------- LISTE ---------- */
function machines(){ return [...new Set(tutos.map(t=>machineL(view(t).machine)).filter(Boolean))].sort(); }
function refreshMachineFilter(){
  const sel=$('fMachine'), cur=sel.value;
  sel.innerHTML = `<option value="">${esc(T('all_machines'))}</option>`+machines().map(m=>`<option ${m===cur?'selected':''} value="${esc(m)}">${esc(m)}</option>`).join('');
}
function renderList(){
  state.view='list'; state.section='tutos'; buildNav();
  $('filters').classList.remove('hidden');
  refreshMachineFilter();
  const q=($('q').value||'').toLowerCase(), fm=$('fMachine').value, fs=$('fStatus').value;
  const list = tutos.map(view).filter(t=>{
    if(state.cat && t.category!==state.cat) return false;
    if(fm && machineL(t.machine)!==fm) return false;
    if(fs && t.status!==fs) return false;
    if(q){
      const hay=[t.title,machineL(t.machine),catL(t.category),(t.tools||[]).join(' '),(t.steps||[]).map(s=>s.text).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const chips = [-1,...CATS.keys()].map(i=>{
    const c = i<0?'':CATS[i];
    return `<button class="chip ${state.cat===c?'on':''}" onclick="setCat(${i})">${esc(i<0?T('all'):catL(c))}</button>`;
  }).join('');
  $('app').innerHTML = `
    <div class="chips">${chips}</div>
    ${list.length?`<div class="grid">${list.map(cardHTML).join('')}</div>`:`<div class="empty">${T('none_found')}</div>`}
    <p class="disclaimer">${esc(T('footer'))}</p>`;
  window.scrollTo(0,0);
}

function openTuto(id){
  const raw=tutos.find(x=>x.id===id); if(!raw) return;
  const t=view(raw);
  state.view='view'; state.id=id; state.section='tutos'; buildNav();
  if(isLocked(raw)) return renderLocked(raw,t);
  if(!state.done[id]) state.done[id]=[];
  $('filters').classList.add('hidden');
  const stepsHTML=(t.steps||[]).map((s,i)=>`
    <div class="step ${state.done[id][i]?'done':''}" id="st${i}">
      <div class="num">${i+1}</div>
      <div class="body">
        <div class="txt">${esc(s.text).replace(/\n/g,'<br>')}</div>
        ${s.warn?`<div class="box danger">${esc(s.warn)}</div>`:''}
        ${s.img?`<img src="${s.img}" alt="${esc(T('step'))} ${i+1}">`:''}
        <label class="chk noprint"><input type="checkbox" ${state.done[id][i]?'checked':''} onchange="toggleStep('${id}',${i},this.checked)"> ${esc(T('step_done'))}</label>
      </div>
    </div>`).join('');
  $('app').innerHTML = `
    <div class="row noprint" style="margin:12px 0;justify-content:space-between">
      <button onclick="renderList()">${esc(T('back'))}</button>
      <div class="row">
        <button onclick="window.print()">${esc(T('print'))}</button>
        <button onclick="editTuto('${id}')">${esc(T('edit'))}</button>
      </div>
    </div>
    <div class="panel">
      ${t.cover?`<img class="tcover" src="${t.cover}" alt="">`:''}
      <div class="row"><span class="tag">${esc(catL(t.category))}</span><span class="tag ${esc(t.status)}">${esc(statusL(t.status))}</span></div>
      <h2 style="margin:8px 0">${esc(t.title)}</h2>
      <div class="meta"><span>${esc(machineL(t.machine))}</span><span>${esc(t.duration)} ${T('min')}</span><span>${esc(levelL(t.level))}</span></div>
      ${(t.safety&&t.safety.length)?`<div class="box danger"><b>${esc(T('safety'))}</b><ul>${t.safety.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
      ${(t.tools&&t.tools.length)?`<div class="box" style="background:transparent;color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent)"><b>${esc(T('tools'))}</b><ul>${t.tools.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><b>${esc(T('progress'))}</b><span id="pct" class="meta"></span></div>
      <div class="progress"><div id="bar"></div></div>
      ${stepsHTML||`<div class="empty">${esc(T('no_steps'))}</div>`}
    </div>`;
  updProgress(id, false);
  window.scrollTo(0,0);
}
function toggleStep(id,i,v){
  state.done[id][i]=v;
  const el=$('st'+i); if(el) el.classList.toggle('done',v);
  updProgress(id, true);
}
function updProgress(id, notify){
  const t=tutos.find(x=>x.id===id), n=(t.steps||[]).length;
  const d=(state.done[id]||[]).filter(Boolean).length;
  const p=n?Math.round(d/n*100):0;
  $('bar').style.width=p+'%';
  $('pct').textContent=T('prog',d,n,p);
  if(notify && n && d===n){ toast(T('finished')); if(t.mandatory) validateTraining(); }
}

function readImg(f,max,q,cb){
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',q));
    };
    im.onerror=()=>toast(L('Image illisible','Unreadable image'));
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
function addPhoto(i,input){
  const f=input.files&&input.files[0]; if(!f) return;
  readImg(f,800,0.7,u=>{ state.draft.steps[i].img=u; renderStepsEditor(); });
}

function addPhoto(i,input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=800, k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      state.draft.steps[i].img=c.toDataURL('image/jpeg',0.7);
      renderStepsEditor();
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}

  if(i>=0) tutos[i]=d; else tutos.unshift(d);
  save(); toast(T('saved')); openTuto(d.id);
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(tutos,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='tutos-maintenance-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast(T('export_started'));
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d)) throw 0;
      let n=0;
      d.forEach(t=>{
        if(!t||!t.title||!Array.isArray(t.steps)) return;
        t.id=t.id&&!tutos.some(x=>x.id===t.id)?t.id:uid();
        t.tools=t.tools||[]; t.safety=t.safety||[]; t.status=STATUS_L.fr[t.status]?t.status:'brouillon';
        tutos.push(t); n++;
      });
      save(); renderList(); toast(T('imported',n));
    }catch(e){ toast(T('invalid')); }
    ev.target.value='';
  };
  r.readAsText(f);
}

const validId=v=>/^[a-z0-9._-]{2,30}$/.test(v);
async function hash(pw,salt){
  const d=new TextEncoder().encode(salt+':'+pw);
  if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest('SHA-256',d); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  let h=5381; for(const c of salt+pw) h=((h<<5)+h+c.charCodeAt(0))|0; return 'w'+h;
}

function idb(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('sibelco_files',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function idbOp(m,k,v){
  const db=await idb();
  return new Promise((ok,ko)=>{ const tx=db.transaction('f',m==='get'?'readonly':'readwrite'), st=tx.objectStore('f'); const rq=m==='put'?st.put(v,k):m==='get'?st.get(k):st.delete(k); tx.oncomplete=()=>ok(rq.result); tx.onerror=()=>ko(tx.error); });
}
const idbPut=(k,v)=>idbOp('put',k,v), idbGet=k=>idbOp('get',k), idbDel=k=>idbOp('del',k);
function pickPdf(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size>30e6){ toast(L('Fichier trop gros (30 Mo max)','File too large (30 MB max)')); inp.value=''; return; }
  state.fdFile=f; state.fdRm=false; state.fd.file={name:f.name,size:f.size}; renderFicheEditor();
}
function rmPdf(){ state.fdFile=null; state.fdRm=true; state.fd.file=null; renderFicheEditor(); }
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let _pdfjs=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(_pdfjs) return _pdfjs;
  _pdfjs=new Promise((res,rej)=>{
    const sc=document.createElement('script'); sc.src=PDFJS+'pdf.min.js';
    sc.onload=()=>{ if(!window.pdfjsLib){ _pdfjs=null; return rej(new Error('pdfjs')); } pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js'; res(pdfjsLib); };
    sc.onerror=()=>{ _pdfjs=null; rej(new Error('pdfjs')); };
    document.head.appendChild(sc);
  });
  return _pdfjs;
}
async function showPdf(f){
  let b,box; try{ b=await idbGet(f.id); box=$('pdfBox'); }catch(e){} if(!b||!box) return;
  const u=URL.createObjectURL(b);
  box.innerHTML=`<div class="row noprint" style="margin:12px 0"><a class="btn" href="${u}" target="_blank" rel="noopener">${L('Ouvrir le PDF','Open PDF')}</a><a class="btn" href="${u}" download="${esc(f.file.name)}">${L('Télécharger','Download')}</a></div><div id="pdfPages" class="pdfpages"><div class="meta">${L('Chargement du PDF…','Loading PDF…')}</div></div>`;
  const pages=$('pdfPages');
  const fallback=()=>{ if(pages.isConnected) pages.innerHTML=`<iframe src="${u}" title="PDF" style="width:100%;height:90vh;border:1px solid var(--line);border-radius:8px"></iframe>`; };
  try{
    const lib=await loadPdfJs();
    const doc=lib.getDocument({data:new Uint8Array(await b.arrayBuffer())});
    const pdf=await Promise.race([doc.promise,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),20000))]);
    if(!pages.isConnected) return;
    pages.innerHTML='';
    const io=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ io.unobserve(en.target); en.target._render(); } }),{rootMargin:'900px 0px'});
    for(let n=1;n<=pdf.numPages;n++){
      const pg=await pdf.getPage(n); if(!pages.isConnected) return;
      const vp=pg.getViewport({scale:1});
      const div=document.createElement('div'); div.className='pdfpg'; div.style.aspectRatio=vp.width+' / '+vp.height;
      const cv=document.createElement('canvas'); div.appendChild(cv); pages.appendChild(div);
      div._render=async()=>{
        const w=div.clientWidth||pages.clientWidth||800;
        const v=pg.getViewport({scale:(w/vp.width)*Math.min(window.devicePixelRatio||1,2)});
        cv.width=Math.floor(v.width); cv.height=Math.floor(v.height);
        try{ await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise; }catch(e){}
      };
      io.observe(div);
    }
  }catch(e){ fallback(); }
}

    <canvas id="gcv" style="display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);touch-action:manipulation"></canvas>
    <div id="gmsg" style="min-height:2.6em;margin:6px 0;font-size:.8rem;line-height:1.25"></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${GBINS.map((b,i)=>`<button onclick="gSort(${i})" style="background:${b.col};color:#fff;border-color:${b.col};font-weight:700;padding:10px 2px;font-size:.85rem;touch-action:manipulation">${esc(L(b.fr,b.en))}<br><small style="opacity:.85">${i+1}</small></button>`).join('')}</div>
    <div style="text-align:center;margin-top:8px"><button id="gplay" class="primary" onclick="gameStart()" style="padding:8px 28px">${L('Jouer','Play')}</button></div>
   </div></div><div id="glb"></div><p class="disclaimer">${esc(T('footer'))}</p>`;
  gameInit(); gBoard(); window.scrollTo(0,0);
}
function gMsg(t,col){ const m=$('gmsg'); if(m){ m.textContent=t||''; m.style.color=col||'var(--text)'; } }
function gHud(g){
  const sc=$('gsc'), li=$('gli'), be=$('gbest'); if(!sc) return;
  sc.innerHTML=`<b>Score</b> ${g.score} · ${L('Niv.','Lv.')} ${gLevel(g)}`+(g.combo>1?` · x${g.combo}`:'');
  li.innerHTML=`<span style="color:#e04b4b;letter-spacing:2px">${'♥'.repeat(Math.max(0,g.lives))}${'♡'.repeat(Math.max(0,3-g.lives))}</span>`;
  be.textContent=L('Record','Best')+' '+gBest();
}
function gameInit(){
  if(G&&G.raf) cancelAnimationFrame(G.raf);
  const cv=$('gcv'), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=GW*dpr; cv.height=GH*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const g=G={cv,ctx,state:'ready',items:[],fx:[],score:0,lives:3,combo:0,sorted:0,spawn:0,off:0,last:0,raf:0,newBest:false};
  gHud(g); gMsg('');
  if(!window._gkey){ window._gkey=true; document.addEventListener('keydown',e=>{ if(!G||!G.cv.isConnected) return; const i='1234'.indexOf(e.key); if(i>=0&&e.key.length===1) gSort(i); }); }
  const loop=ts=>{
    if(G!==g||!cv.isConnected) return;
    const dt=Math.min(.05,(ts-(g.last||ts))/1000); g.last=ts;
    gUpdate(g,dt); gRender(g);
    g.raf=requestAnimationFrame(loop);
  };
  g.raf=requestAnimationFrame(loop);
}
function gameStart(){
  const g=G; if(!g) return;
  Object.assign(g,{state:'play',items:[],fx:[],score:0,lives:3,combo:0,sorted:0,spawn:.2,newBest:false});
  $('gplay').classList.add('hidden'); gMsg(''); gHud(g);
}
function gLevel(g){ return 1+Math.floor(g.sorted/8); }
function gSpeed(g){ return 90+Math.min(150,g.sorted*3.5); }
function gSpawn(g){
  const glass=Math.random()<Math.max(.35,.5-g.sorted*.004), pool=GITEMS.filter(i=>glass?i.bin<3:i.bin===3);
  const t=pool[Math.floor(Math.random()*pool.length)];
  g.items.push(Object.assign({},t,{x:40+Math.random()*(GW-80),y:-30,rot:(Math.random()-.5)*.8,vr:(Math.random()-.5)*.8,vx:g.sorted>=6?(Math.random()-.5)*70:0}));
}
function gUpdate(g,dt){
  g.off=(g.off+(g.state==='play'?gSpeed(g):30)*dt)%40;
  g.fx=g.fx.filter(f=>(f.life-=dt)>0);
  if(g.state!=='play') return;
  g.spawn-=dt;
  if(g.spawn<=0){ gSpawn(g); if(g.sorted>=15&&Math.random()<.3) setTimeout(()=>{ if(G===g&&g.state==='play') gSpawn(g); },180); g.spawn=Math.max(.4,1.05-g.sorted*.022); }
  const sp=gSpeed(g);
  g.items.forEach(it=>{ it.y+=sp*dt; it.rot+=it.vr*dt; if(it.vx){ it.x+=it.vx*dt; if(it.x<24||it.x>GW-24) it.vx=-it.vx; } });
  for(let i=g.items.length-1;i>=0&&g.state==='play';i--){
    const it=g.items[i];
    if(it.y>GLINE){ g.items.splice(i,1); gFail(g,it,L('Trop tard ! ','Too late! ')+L(it.fr,it.en)+'.'); }
  }
}
function gFail(g,it,msg){
  g.lives--; g.combo=0;
  g.fx.push({x:it.x,y:Math.min(it.y,GLINE-10),life:.6,max:.6,txt:'✗',col:'#e04b4b'});
  gMsg(msg,'var(--danger-line)'); gHud(g);
  if(g.lives<=0) gOver(g);
}
function gSort(bin){
  const g=G; if(!g||g.state!=='play'||!g.items.length) return;
  let k=0; g.items.forEach((it,j)=>{ if(it.y>g.items[k].y) k=j; });
  const it=g.items.splice(k,1)[0];
  if(it.bin===bin){
    g.combo++; g.sorted++;
    const pts=10*(1+Math.floor((g.combo-1)/5)); g.score+=pts+Math.floor(g.sorted/8);
    g.fx.push({x:it.x,y:it.y,life:.3,max:.3,jet:true,col:GBINS[bin].col});
    g.fx.push({x:it.x,y:it.y,life:.6,max:.6,txt:'+'+pts,col:'#4cc57f'});
    gMsg(it.bin===3?L(it.fr+' : bien rejeté !',it.en+': rightly rejected!'):'','var(--ok)'); gHud(g);
  } else {
    const nm=L(it.fr,it.en), bn=L(GBINS[bin].fr,GBINS[bin].en);
    let m;
    if(it.bin===3) m=nm+' → '+L('Refus','Reject')+'. '+L(it.tfr,it.ten);
    else if(bin===3) m=L('Du bon verre rejeté : on perd de la matière recyclable.','Good glass rejected: recyclable material is lost.');
    else m=nm+' ≠ '+bn+'. '+L('Mélanger les couleurs change la teinte du verre recyclé.','Mixing colours changes the colour of recycled glass.');
    gFail(g,it,m);
  }
}
function gOver(g){
  g.state='over'; g.items=[];
  const b=gBest(); if(g.score>b){ gSetBest(g.score); g.newBest=true; }
  gRecord(g); gBoard();
  gMsg(L('Partie terminée','Game over')+' – '+g.score+' pts · '+g.sorted+' '+L('pièces triées','items sorted')+(g.newBest?' · '+L('Nouveau record !','New best!'):'')+'\n'+L('Le saviez-vous ? Le verre se recycle à l\'infini sans perdre en qualité.','Did you know? Glass can be recycled endlessly without losing quality.'));
  $('gmsg').style.whiteSpace='pre-line';
  $('gplay').textContent=L('Rejouer','Play again'); $('gplay').classList.remove('hidden'); gHud(g);
}
function gPoly(ctx,pts){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); }
function gItem(ctx,it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot); ctx.lineWidth=1.5; ctx.lineJoin='round';
  if(it.shape==='bottle'){
    ctx.globalAlpha=.92; ctx.fillStyle=it.col; ctx.strokeStyle='rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.moveTo(-5,-22); ctx.lineTo(5,-22); ctx.lineTo(5,-10); ctx.quadraticCurveTo(13,-6,13,4); ctx.lineTo(13,20); ctx.quadraticCurveTo(13,24,9,24); ctx.lineTo(-9,24); ctx.quadraticCurveTo(-13,24,-13,20); ctx.lineTo(-13,4); ctx.quadraticCurveTo(-13,-6,-5,-10); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.globalAlpha=.55; ctx.fillStyle='#fff'; ctx.fillRect(-9,0,3,18);
  } else if(it.shape==='stone'){
    ctx.fillStyle='#7d7f83'; ctx.strokeStyle='#4a4c50'; gPoly(ctx,[-16,-4,-8,-14,6,-15,16,-5,14,9,2,15,-11,12]); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5c5e62'; ctx.fillRect(-6,-4,3,3); ctx.fillRect(4,3,3,3); ctx.fillRect(-2,8,2,2);
  } else if(it.shape==='shard'){
    ctx.fillStyle='#f1e8d6'; ctx.strokeStyle='#b9a98c'; gPoly(ctx,[-16,10,-4,-16,14,-6,10,14]); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#3b6fb0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-9,4); ctx.lineTo(8,-2); ctx.stroke();
  } else if(it.shape==='cap'){
    ctx.fillStyle='#aab2ba'; ctx.strokeStyle='#6b747c'; ctx.beginPath(); ctx.arc(0,0,14,0,6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); for(let a=0;a<12;a++){ const r=a*Math.PI/6; ctx.moveTo(Math.cos(r)*11,Math.sin(r)*11); ctx.lineTo(Math.cos(r)*14,Math.sin(r)*14); } ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,7,0,6.2832); ctx.stroke();
  } else if(it.shape==='pyrex'){
    ctx.globalAlpha=.9; ctx.fillStyle='#d9f0f7'; ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(16,-6); ctx.lineTo(12,14); ctx.lineTo(-12,14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(-20,-9); ctx.moveTo(16,-6); ctx.lineTo(20,-9); ctx.stroke();
    ctx.globalAlpha=.5; ctx.fillStyle='#fff'; ctx.fillRect(-9,-2,3,12);
  } else if(it.shape==='bag'){
    ctx.globalAlpha=.85; ctx.fillStyle='#e0638a'; ctx.strokeStyle='#a8385c';
    ctx.beginPath(); ctx.moveTo(-14,-10); ctx.quadraticCurveTo(0,-16,14,-10); ctx.quadraticCurveTo(18,0,12,12); ctx.quadraticCurveTo(0,18,-12,12); ctx.quadraticCurveTo(-18,0,-14,-10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(-8,-6); ctx.lineTo(-2,8); ctx.moveTo(6,-8); ctx.lineTo(2,6); ctx.stroke();
  }
  ctx.restore();
}
function gRender(g){
  const c=g.ctx;
  c.clearRect(0,0,GW,GH);
  c.fillStyle='#0f2a44'; c.fillRect(0,0,GW,GH);
  c.strokeStyle='rgba(255,255,255,.07)'; c.lineWidth=2;
  for(let y=-40+g.off;y<GH;y+=40){ c.beginPath(); c.moveTo(0,y); c.lineTo(GW,y); c.stroke(); }
  c.fillStyle='#0a1d30'; c.fillRect(0,GLINE,GW,GH-GLINE);
  c.strokeStyle='#2d8fe0'; c.setLineDash([8,6]); c.lineWidth=2; c.beginPath(); c.moveTo(0,GLINE); c.lineTo(GW,GLINE); c.stroke(); c.setLineDash([]);
  c.fillStyle='#5aaeea'; for(let x=20;x<GW;x+=40){ c.beginPath(); c.arc(x,GLINE+12,4,0,6.2832); c.fill(); }
  c.fillStyle='rgba(255,255,255,.55)'; c.font='600 12px system-ui,sans-serif'; c.textAlign='center';
  c.fillText(L('ZONE D\'ÉJECTION','EJECTION ZONE'),GW/2,GLINE+38);
  g.items.forEach(it=>gItem(c,it));
  if(g.state==='play'&&g.items.length){
    let k=0; g.items.forEach((it,j)=>{ if(it.y>g.items[k].y) k=j; });
    const t=g.items[k]; c.strokeStyle='#fff'; c.lineWidth=2; c.setLineDash([5,4]); c.beginPath(); c.arc(t.x,t.y,30,0,6.2832); c.stroke(); c.setLineDash([]);
  }
  g.fx.forEach(f=>{
    const p=1-f.life/f.max;
    if(f.jet){ c.globalAlpha=1-p; c.strokeStyle=f.col; c.lineWidth=4; c.beginPath(); c.arc(f.x,f.y,12+p*34,0,6.2832); c.stroke(); c.globalAlpha=1; }
    else { c.globalAlpha=1-p; c.fillStyle=f.col; c.font='700 20px system-ui,sans-serif'; c.textAlign='center'; c.fillText(f.txt,f.x,f.y-p*30); c.globalAlpha=1; }
  });
  if(g.state!=='play'){
    c.fillStyle='rgba(10,29,48,.72)'; c.fillRect(0,0,GW,GH);
    c.fillStyle='#fff'; c.textAlign='center'; c.font='700 26px system-ui,sans-serif';
    c.fillText(g.state==='over'?L('Partie terminée','Game over'):L('Trieur Sibelco','Sibelco Sorter'),GW/2,GH/2-10);
    c.font='500 15px system-ui,sans-serif'; c.fillStyle='#c5d6ea';
    c.fillText(g.state==='over'?(g.score+' pts'):L('Appuyez sur « Jouer »','Press “Play”'),GW/2,GH/2+20);
  }
}

(function(){var i=new Image();i.onload=function(){document.documentElement.classList.add('photo');};i.src='fond-verre.jpg';})();
boot();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
