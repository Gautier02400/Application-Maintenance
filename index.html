function gMsg(t,col){ const m=$('gmsg'); if(m){ m.textContent=t||''; m.style.color=col||'var(--text)'; } }
function gHud(g){
  const sc=$('gsc'), li=$('gli'), be=$('gbest'); if(!sc) return;
  sc.innerHTML=`<b>Score</b> ${g.score} · ${L('Niv.','Lv.')} ${gLevel(g)}`+(g.combo>1?` · x${g.combo}`:'');
  li.innerHTML=`<span style="color:#e04b4b;letter-spacing:2px">${'♥'.repeat(Math.max(0,g.lives))}${'♡'.repeat(Math.max(0,3-g.lives))}</span>`;
  be.textContent=L('Record','Best')+' '+gBest();
}
/*
 MOTEUR DU JEU :
   gameInit()  prépare le canvas (netteté sur écrans haute densité : dpr)   gameStart()  lance la partie
   gLevel / gSpeed  niveau et vitesse qui augmentent avec le nombre de pièces triées
   gSpawn()  fait apparaître une pièce   gUpdate(g,dt)  fait avancer les pièces (dt = temps écoulé)
   gSort(bin)  vérifie le choix du joueur   gFail  perd une vie   gOver  fin de partie + enregistrement du score
*/
function gameInit(){
  if(G&&G.raf) cancelAnimationFrame(G.raf);
  const cv=$('gcv'), dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=GW*dpr; cv.height=GH*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const g=G={cv,ctx,state:'ready',items:[],fx:[],score:0,lives:3,combo:0,sorted:0,spawn:0,off:0,last:0,raf:0,newBest:false};
  gHud(g); gMsg('');
  if(!window._gkey){ window._gkey=true; document.addEventListener('keydown',e=>{ if(!G||!G.cv.isConnected) return; const i='1234'.indexOf(e.key); if(i>=0&&e.key.length===1) gSort(i); }); }
  const loop=ts=>{
    if(G!==g||!cv.isConnected) return;
    const dt=Math.min(.05,(ts-(g.last||ts))/1000); g.last=ts;
    gUpdate(g,dt); gRender(g);
    g.raf=requestAnimationFrame(loop);
  };
  g.raf=requestAnimationFrame(loop);
}
function gameStart(){
  const g=G; if(!g) return;
  Object.assign(g,{state:'play',items:[],fx:[],score:0,lives:3,combo:0,sorted:0,spawn:.2,newBest:false});
  $('gplay').classList.add('hidden'); gMsg(''); gHud(g);
}
function gLevel(g){ return 1+Math.floor(g.sorted/8); }
function gSpeed(g){ return 90+Math.min(150,g.sorted*3.5); }
function gSpawn(g){
  const glass=Math.random()<Math.max(.35,.5-g.sorted*.004), pool=GITEMS.filter(i=>glass?i.bin<3:i.bin===3);
  const t=pool[Math.floor(Math.random()*pool.length)];
  g.items.push(Object.assign({},t,{x:40+Math.random()*(GW-80),y:-30,rot:(Math.random()-.5)*.8,vr:(Math.random()-.5)*.8,vx:g.sorted>=6?(Math.random()-.5)*70:0}));
}
function gUpdate(g,dt){
  g.off=(g.off+(g.state==='play'?gSpeed(g):30)*dt)%40;
  g.fx=g.fx.filter(f=>(f.life-=dt)>0);
  if(g.state!=='play') return;
  g.spawn-=dt;
  if(g.spawn<=0){ gSpawn(g); if(g.sorted>=15&&Math.random()<.3) setTimeout(()=>{ if(G===g&&g.state==='play') gSpawn(g); },180); g.spawn=Math.max(.4,1.05-g.sorted*.022); }
  const sp=gSpeed(g);
  g.items.forEach(it=>{ it.y+=sp*dt; it.rot+=it.vr*dt; if(it.vx){ it.x+=it.vx*dt; if(it.x<24||it.x>GW-24) it.vx=-it.vx; } });
  for(let i=g.items.length-1;i>=0&&g.state==='play';i--){
    const it=g.items[i];
    if(it.y>GLINE){ g.items.splice(i,1); gFail(g,it,L('Trop tard ! ','Too late! ')+L(it.fr,it.en)+'.'); }
  }
}
function gFail(g,it,msg){
  g.lives--; g.combo=0;
  g.fx.push({x:it.x,y:Math.min(it.y,GLINE-10),life:.6,max:.6,txt:'✗',col:'#e04b4b'});
  gMsg(msg,'var(--danger-line)'); gHud(g);
  if(g.lives<=0) gOver(g);
}
function gSort(bin){
  const g=G; if(!g||g.state!=='play'||!g.items.length) return;
  let k=0; g.items.forEach((it,j)=>{ if(it.y>g.items[k].y) k=j; });
  const it=g.items.splice(k,1)[0];
  if(it.bin===bin){
    g.combo++; g.sorted++;
    const pts=10*(1+Math.floor((g.combo-1)/5)); g.score+=pts+Math.floor(g.sorted/8);
    g.fx.push({x:it.x,y:it.y,life:.3,max:.3,jet:true,col:GBINS[bin].col});
    g.fx.push({x:it.x,y:it.y,life:.6,max:.6,txt:'+'+pts,col:'#4cc57f'});
    gMsg(it.bin===3?L(it.fr+' : bien rejeté !',it.en+': rightly rejected!'):'','var(--ok)'); gHud(g);
  } else {
    const nm=L(it.fr,it.en), bn=L(GBINS[bin].fr,GBINS[bin].en);
    let m;
    if(it.bin===3) m=nm+' → '+L('Refus','Reject')+'. '+L(it.tfr,it.ten);
    else if(bin===3) m=L('Du bon verre rejeté : on perd de la matière recyclable.','Good glass rejected: recyclable material is lost.');
    else m=nm+' ≠ '+bn+'. '+L('Mélanger les couleurs change la teinte du verre recyclé.','Mixing colours changes the colour of recycled glass.');
    gFail(g,it,m);
  }
}
function gOver(g){
  g.state='over'; g.items=[];
  const b=gBest(); if(g.score>b){ gSetBest(g.score); g.newBest=true; }
  gRecord(g); gBoard();
  gMsg(L('Partie terminée','Game over')+' – '+g.score+' pts · '+g.sorted+' '+L('pièces triées','items sorted')+(g.newBest?' · '+L('Nouveau record !','New best!'):'')+'\n'+L('Le saviez-vous ? Le verre se recycle à l\'infini sans perdre en qualité.','Did you know? Glass can be recycled endlessly without losing quality.'));
  $('gmsg').style.whiteSpace='pre-line';
  $('gplay').textContent=L('Rejouer','Play again'); $('gplay').classList.remove('hidden'); gHud(g);
}
/*
 ===================== ILLUSTRATIONS : LES PIECES DU JEU =====================
 Les pièces ne sont pas des images : elles sont DESSINEES à chaque image avec l'API canvas.
   gPoly(ctx,[x1,y1,x2,y2,...]) trace un polygone à partir d'une liste de points.
   gItem(ctx,it) : dessine la pièce "it" selon sa forme (it.shape). On se place au centre de la pièce
   (translate) et on la fait tourner (rotate), donc toutes les coordonnées sont relatives au CENTRE (0,0).
   fillStyle = couleur de remplissage, strokeStyle = couleur du contour, globalAlpha = transparence,
   moveTo/lineTo = lignes, quadraticCurveTo = courbes, arc = cercle.
 POUR CHANGER L'ASPECT D'UNE PIECE : modifier les couleurs (#7d7f83 ...) ou les points dans la branche de sa forme.
 POUR AJOUTER UNE PIECE : ajouter un "else if(it.shape==='monobjet'){ ... }" puis une ligne dans GITEMS.
*/
function gPoly(ctx,pts){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); }
function gItem(ctx,it){
  ctx.save(); ctx.translate(it.x,it.y); ctx.rotate(it.rot); ctx.lineWidth=1.5; ctx.lineJoin='round';
  if(it.shape==='bottle'){
    ctx.globalAlpha=.92; ctx.fillStyle=it.col; ctx.strokeStyle='rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.moveTo(-5,-22); ctx.lineTo(5,-22); ctx.lineTo(5,-10); ctx.quadraticCurveTo(13,-6,13,4); ctx.lineTo(13,20); ctx.quadraticCurveTo(13,24,9,24); ctx.lineTo(-9,24); ctx.quadraticCurveTo(-13,24,-13,20); ctx.lineTo(-13,4); ctx.quadraticCurveTo(-13,-6,-5,-10); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.globalAlpha=.55; ctx.fillStyle='#fff'; ctx.fillRect(-9,0,3,18);
  } else if(it.shape==='stone'){
    ctx.fillStyle='#7d7f83'; ctx.strokeStyle='#4a4c50'; gPoly(ctx,[-16,-4,-8,-14,6,-15,16,-5,14,9,2,15,-11,12]); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#5c5e62'; ctx.fillRect(-6,-4,3,3); ctx.fillRect(4,3,3,3); ctx.fillRect(-2,8,2,2);
  } else if(it.shape==='shard'){
    ctx.fillStyle='#f1e8d6'; ctx.strokeStyle='#b9a98c'; gPoly(ctx,[-16,10,-4,-16,14,-6,10,14]); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#3b6fb0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-9,4); ctx.lineTo(8,-2); ctx.stroke();
  } else if(it.shape==='cap'){
    ctx.fillStyle='#aab2ba'; ctx.strokeStyle='#6b747c'; ctx.beginPath(); ctx.arc(0,0,14,0,6.2832); ctx.fill(); ctx.stroke();
    ctx.beginPath(); for(let a=0;a<12;a++){ const r=a*Math.PI/6; ctx.moveTo(Math.cos(r)*11,Math.sin(r)*11); ctx.lineTo(Math.cos(r)*14,Math.sin(r)*14); } ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,7,0,6.2832); ctx.stroke();
  } else if(it.shape==='pyrex'){
    ctx.globalAlpha=.9; ctx.fillStyle='#d9f0f7'; ctx.strokeStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(16,-6); ctx.lineTo(12,14); ctx.lineTo(-12,14); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(-20,-9); ctx.moveTo(16,-6); ctx.lineTo(20,-9); ctx.stroke();
    ctx.globalAlpha=.5; ctx.fillStyle='#fff'; ctx.fillRect(-9,-2,3,12);
  } else if(it.shape==='bag'){
    ctx.globalAlpha=.85; ctx.fillStyle='#e0638a'; ctx.strokeStyle='#a8385c';
    ctx.beginPath(); ctx.moveTo(-14,-10); ctx.quadraticCurveTo(0,-16,14,-10); ctx.quadraticCurveTo(18,0,12,12); ctx.quadraticCurveTo(0,18,-12,12); ctx.quadraticCurveTo(-18,0,-14,-10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(-8,-6); ctx.lineTo(-2,8); ctx.moveTo(6,-8); ctx.lineTo(2,6); ctx.stroke();
  }
  ctx.restore();
}
/*
 gRender(g) : dessine une image complète : fond bleu, bacs, ligne des buses, pièces, effets, messages.
*/
function gRender(g){
  const c=g.ctx;
  c.clearRect(0,0,GW,GH);
  c.fillStyle='#0f2a44'; c.fillRect(0,0,GW,GH);
  c.strokeStyle='rgba(255,255,255,.07)'; c.lineWidth=2;
  for(let y=-40+g.off;y<GH;y+=40){ c.beginPath(); c.moveTo(0,y); c.lineTo(GW,y); c.stroke(); }
  c.fillStyle='#0a1d30'; c.fillRect(0,GLINE,GW,GH-GLINE);
  c.strokeStyle='#2d8fe0'; c.setLineDash([8,6]); c.lineWidth=2; c.beginPath(); c.moveTo(0,GLINE); c.lineTo(GW,GLINE); c.stroke(); c.setLineDash([]);
  c.fillStyle='#5aaeea'; for(let x=20;x<GW;x+=40){ c.beginPath(); c.arc(x,GLINE+12,4,0,6.2832); c.fill(); }
  c.fillStyle='rgba(255,255,255,.55)'; c.font='600 12px system-ui,sans-serif'; c.textAlign='center';
  c.fillText(L('ZONE D\'ÉJECTION','EJECTION ZONE'),GW/2,GLINE+38);
  g.items.forEach(it=>gItem(c,it));
  if(g.state==='play'&&g.items.length){
    let k=0; g.items.forEach((it,j)=>{ if(it.y>g.items[k].y) k=j; });
    const t=g.items[k]; c.strokeStyle='#fff'; c.lineWidth=2; c.setLineDash([5,4]); c.beginPath(); c.arc(t.x,t.y,30,0,6.2832); c.stroke(); c.setLineDash([]);
  }
  g.fx.forEach(f=>{
    const p=1-f.life/f.max;
    if(f.jet){ c.globalAlpha=1-p; c.strokeStyle=f.col; c.lineWidth=4; c.beginPath(); c.arc(f.x,f.y,12+p*34,0,6.2832); c.stroke(); c.globalAlpha=1; }
    else { c.globalAlpha=1-p; c.fillStyle=f.col; c.font='700 20px system-ui,sans-serif'; c.textAlign='center'; c.fillText(f.txt,f.x,f.y-p*30); c.globalAlpha=1; }
  });
  if(g.state!=='play'){
    c.fillStyle='rgba(10,29,48,.72)'; c.fillRect(0,0,GW,GH);
    c.fillStyle='#fff'; c.textAlign='center'; c.font='700 26px system-ui,sans-serif';
    c.fillText(g.state==='over'?L('Partie terminée','Game over'):L('Trieur Sibelco','Sibelco Sorter'),GW/2,GH/2-10);
    c.font='500 15px system-ui,sans-serif'; c.fillStyle='#c5d6ea';
    c.fillText(g.state==='over'?(g.score+' pts'):L('Appuyez sur « Jouer »','Press “Play”'),GW/2,GH/2+20);
  }
}

/*
 (Les 4 jeux suivants réutilisent le même système de comptes pour les scores.)
*/
/* ======================================================================
   JEUX : MENU + QUIZ / VRAI-FAUX / MÉMOIRE / REMETTRE DANS L’ORDRE
   (le jeu « Trieur Sibelco » est plus haut ; ceux-ci réutilisent les mêmes
   comptes pour enregistrer les scores et afficher un classement)
   ====================================================================== */
/*
 SCORES DES 4 JEUX : stockés dans le localStorage sous G2KEY, par jeu puis par utilisateur.
   g2Record(jeu,score) enregistre une partie et indique si c'est un nouveau record ;
   g2Board(jeu,idDeLaZone) affiche le classement.   shuffle(tableau) mélange un tableau.
*/
const G2KEY='sibelco_games2_v1';   // scores : { jeu : { idUtilisateur : {best,games,date,last} } }
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const G2NAME={quiz:['Quiz maintenance','Maintenance quiz'],vf:['Vrai ou faux','True or false'],link:['Relier','Link'],order:['Dans l’ordre','Put in order']};

/* Lecture / écriture des scores (localStorage) */
function g2All(){ try{ const r=JSON.parse(localStorage.getItem(G2KEY)); if(r&&typeof r==='object') return r; }catch(e){} return {}; }
function g2Best(game){ const r=(g2All()[game]||{})[settings.id||'x']; return r?r.best:0; }
function g2Record(game,score){            // renvoie true si c’est un nouveau record personnel
  const all=g2All(), t=all[game]||(all[game]={}), id=settings.id||'x';
  const r=t[id]||(t[id]={best:0,games:0,date:0});
  r.games++; r.last=score;
  const nb=score>r.best; if(nb){ r.best=score; r.date=Date.now(); }
  try{ localStorage.setItem(G2KEY,JSON.stringify(all)); }catch(e){}
  return nb;
}
/* Classement des comptes de l’appareil pour un jeu, affiché dans #boxId */
function g2Board(game,boxId){
  const box=$(boxId); if(!box) return;
  const t=g2All()[game]||{};
  const rows=users.map(u=>({id:u.id,name:u.name||u.id,best:(t[u.id]||{}).best||0,games:(t[u.id]||{}).games||0}))
    .filter(r=>r.best>0).sort((a,b)=>b.best-a.best||a.games-b.games);
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
  box.innerHTML=`<div class="panel"><h2 style="margin-top:0">🏆 ${L('Classement','Ranking')}</h2>`+
   (rows.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.9rem"><thead><tr style="text-align:left;color:var(--muted);font-size:.75rem"><th style="padding:6px 4px">#</th><th style="padding:6px 4px">${L('Joueur','Player')}</th><th style="padding:6px 4px;text-align:right">${L('Meilleur score','Best score')}</th><th style="padding:6px 4px;text-align:right">${L('Parties','Games')}</th></tr></thead><tbody>`+
    rows.map((r,i)=>`<tr style="border-top:1px solid var(--line);${r.id===settings.id?'font-weight:700;background:rgba(45,143,224,.15)':''}"><td style="padding:8px 4px">${medal(i)}</td><td style="padding:8px 4px">${esc(r.name)}${r.id===settings.id?' ('+L('vous','you')+')':''}</td><td style="padding:8px 4px;text-align:right">${r.best}</td><td style="padding:8px 4px;text-align:right">${r.games}</td></tr>`).join('')+
    `</tbody></table></div>`:`<div class="empty">${L('Aucun score pour le moment. Soyez le premier !','No score yet. Be the first!')}</div>`)+
   `<p class="meta" style="margin:8px 0 0;font-size:.75rem">${L('Classement des comptes de cet appareil.','Ranking of the accounts on this device.')}</p></div>`;
}

/*
 Moteur du quiz : quizStart(kind) prépare la partie, quizShow() affiche la question + lance le chrono,
 quizAnswer(i) corrige (i = -1 si le temps est écoulé), quizNext() passe à la suivante, quizEnd() affiche le résultat.
*/
let Q=null;   // état de la partie de quiz / vrai-faux en cours
function quizStart(kind){
  const bank=kind==='vf'?VF:QUIZ;
  const qs=shuffle(bank.slice()).slice(0,10).map(q=>kind==='vf'
    ?{q:q.q,e:q.e,o:[{t:['Vrai','True'],c:q.a},{t:['Faux','False'],c:!q.a}]}              // vrai/faux : 2 boutons fixes
    :{q:q.q,e:q.e,o:shuffle(q.o.map((t,i)=>({t,c:i===q.a})))});                            // quiz : réponses mélangées
  if(Q) clearInterval(Q.timer);
  Q={kind,qs,i:0,score:0,ok:0,streak:0,left:0,total:kind==='vf'?12:20,locked:false,timer:null};
  gFrame(G2NAME[kind][0],G2NAME[kind][1],'<div id="qz"></div>');
  quizShow(); g2Board(kind,'g2lb');
}
function quizShow(){                       // affiche la question courante et lance le chrono
  const me=Q, box=$('qz'); if(!me||!box) return;
  const q=me.qs[me.i]; me.locked=false; me.left=me.total;
  box.innerHTML=`<div class="row" style="justify-content:space-between"><b>${L('Question','Question')} ${me.i+1}/${me.qs.length}</b><span class="meta">Score ${me.score}${me.streak>1?' · 🔥 x'+me.streak:''}</span></div>
   <div class="qbar"><div id="qbar" style="width:100%"></div></div>
   <p style="font-size:1.05rem;font-weight:600;margin:10px 0">${esc(L(q.q[0],q.q[1]))}</p>
   <div id="qopts">${q.o.map((o,i)=>`<button class="qopt" onclick="quizAnswer(${i})">${esc(L(o.t[0],o.t[1]))}</button>`).join('')}</div><div id="qfb"></div>`;
  clearInterval(me.timer);
  const t0=Date.now();
  me.timer=setInterval(()=>{
    if(Q!==me||!box.isConnected){ clearInterval(me.timer); return; }   // on a quitté la page : on arrête le chrono
    me.left=Math.max(0,me.total-(Date.now()-t0)/1000);
    const b=$('qbar'); if(b) b.style.width=(me.left/me.total*100)+'%';
    if(me.left<=0) quizAnswer(-1);                                        // temps écoulé = mauvaise réponse
  },100);
}
function quizAnswer(i){                    // i = bouton choisi (-1 si temps écoulé)
  const me=Q; if(!me||me.locked) return; me.locked=true; clearInterval(me.timer);
  const q=me.qs[me.i], good=i>=0&&q.o[i].c;
  let pts=0;
  if(good){ pts=10+Math.ceil(me.left/me.total*5)+Math.min(me.streak,5)*2; me.score+=pts; me.ok++; me.streak++; }   // 10 pts + bonus rapidité + bonus série
  else me.streak=0;
  document.querySelectorAll('#qopts .qopt').forEach((b,k)=>{ b.disabled=true; if(q.o[k].c) b.classList.add('good'); else if(k===i) b.classList.add('bad'); });
  const last=me.i>=me.qs.length-1;
  $('qfb').innerHTML=`<div class="box ${good?'':'danger'}" style="${good?'border-left-color:var(--ok);background:rgba(26,138,74,.14);color:var(--text)':''}"><b>${good?L('Bonne réponse ! +'+pts,'Correct! +'+pts):(i<0?L('Temps écoulé.','Time is up.'):L('Raté.','Not quite.'))}</b><br>${esc(L(q.e[0],q.e[1]))}</div>
   <div style="margin-top:10px;text-align:right"><button class="primary" onclick="${last?'quizEnd()':'quizNext()'}">${last?L('Voir le résultat','See result'):L('Suivante →','Next →')}</button></div>`;
}
function quizNext(){ if(!Q) return; Q.i++; quizShow(); }
function quizEnd(){                        // écran de résultat + enregistrement du score
  const me=Q; if(!me) return; clearInterval(me.timer);
  const nb=g2Record(me.kind,me.score), n=me.qs.length, r=me.ok/n;
  const msg=r>=.9?L('Excellent, vous maîtrisez !','Excellent, you know your stuff!'):r>=.6?L('Bien joué, continuez à réviser.','Well done, keep revising.'):L('À revoir : relisez les tutos et rejouez !','Needs work: reread the tutorials and play again!');
  $('qz').innerHTML=`<div style="text-align:center;padding:10px 0"><div style="font-size:2.4rem;font-weight:800">${me.score} pts</div>
   <p>${me.ok}/${n} ${L('bonnes réponses','correct answers')}${nb?' · 🏆 '+L('Nouveau record !','New best!'):''}</p><p class="meta">${msg}</p>
   <div class="row" style="justify-content:center"><button class="primary" onclick="quizStart('${me.kind}')">${L('Rejouer','Play again')}</button><button onclick="renderGame()">${L('Autres jeux','Other games')}</button></div></div>`;
  g2Board(me.kind,'g2lb');
}

/* ---------- RELIER : relier chaque objet (composant, équipement) à son expression (rôle) ---------- */
/*
 ===================== RELIER =====================
 LNK = les paires du jeu : [emoji, [objet FR, objet EN], [expression FR, expression EN]].
 À chaque partie, 6 paires sont tirées au hasard parmi celles-ci. Le joueur touche un OBJET puis l'EXPRESSION qui lui correspond
 (ou l'inverse) : un trait de couleur les relie. Toucher un élément déjà relié efface son lien. Quand tout est relié : bouton « Valider ».
 POUR CHANGER / AJOUTER / RETIRER UNE PAIRE : modifier, copier ou supprimer une ligne (gardez l'expression COURTE : environ 50 caractères).
 Pour changer le nombre de paires par partie : modifier LNK_N.
*/
const LNK=[
 ['📷',['Caméra','Camera'],['Voit la couleur et les défauts du verre','Sees the glass colour and defects']],
 ['💡',['Éclairage','Lighting'],['Éclaire le verre pour une image nette','Lights the glass for a sharp image']],
 ['💨',['Buse d’éjection','Ejection nozzle'],['Souffle l’indésirable hors du flux','Blows the reject out of the stream']],
 ['⚡',['Électrovanne','Solenoid valve'],['Commande l’air envoyé à la buse','Controls the air sent to the nozzle']],
 ['🖥️',['Écran de commande','Control screen'],['Affiche les alarmes et les réglages','Shows alarms and settings']],
 ['🔍',['Vitre optique','Optical window'],['À nettoyer pour éviter les fausses détections','Clean it to avoid false detections']],
 ['🔒',['Cadenas LOTO','LOTO padlock'],['Empêche tout redémarrage pendant l’intervention','Prevents any restart during the job']],
 ['🎚️',['Manomètre','Pressure gauge'],['Air à 0 bar avant tout démontage','Air at 0 bar before any dismantling']],
 ['🧤',['Gants','Gloves'],['À porter pour manipuler le verre coupant','Wear them to handle sharp glass']],
 ['🥽',['Lunettes de protection','Safety glasses'],['Protègent les yeux des éclats de verre','Protect the eyes from glass splinters']]
];
const LNK_N=6;
const LNK_COL=['#2d8fe0','#e8943a','#9a6be0','#2fb59a','#e0638a','#c9a400'];   // couleur du trait de chaque lien
let LK=null;   // état de la partie en cours
function lnkStart(){
  const idx=shuffle(LNK.map((_,i)=>i)).slice(0,LNK_N);
  LK={left:idx.slice(), right:shuffle(idx.slice()), links:{}, sel:null, t0:0, over:false};   // links : {positionGauche : positionDroite}
  gFrame('Relier','Link',`<p class="meta" style="margin:0 0 8px">${L('Touchez un objet puis l’expression qui lui correspond pour les relier. Touchez un élément relié pour effacer son lien. Plus vite = plus de points.','Tap an object, then the expression that matches it, to link them. Tap a linked item to remove its link. Faster = more points.')}</p>
   <div class="row" style="justify-content:space-between;margin-bottom:8px"><span id="lkhud" class="meta"></span><button class="small" onclick="lnkStart()">${L('Recommencer','Restart')}</button></div>
   <div id="lkbox" class="lkbox"></div><div id="lkact" style="margin-top:12px;text-align:center"></div><div id="lkfb"></div>`);
  lnkDraw(); g2Board('link','g2lb');
}
function lnkDraw(){
  const g=LK, box=$('lkbox'); if(!g||!box) return;
  const rOf={}; Object.keys(g.links).forEach(l=>rOf[g.links[l]]=+l);   // position droite -> position gauche
  let h='<svg id="lksvg" class="lksvg" aria-hidden="true"></svg>';
  g.left.forEach((pi,k)=>{
    const a=LNK[pi], b=LNK[g.right[k]];
    const lc=g.links[k]!==undefined, rc=rOf[k]!==undefined;
    const lcol=lc?LNK_COL[k%6]:'', rcol=rc?LNK_COL[rOf[k]%6]:'';
    const res=(i,linked)=>{ if(!g.over||!linked) return ''; return g.ok[i]?' ok':' ko'; };
    h+=`<button class="lkit${g.sel&&g.sel.s==='l'&&g.sel.i===k?' sel':''}${res(k,lc)}" data-s="l" data-i="${k}" ${lc&&!g.over?`style="border-color:${lcol}"`:''} onclick="lnkTap('l',${k})" ${g.over?'disabled':''}><span class="me">${a[0]}</span><span>${esc(L(a[1][0],a[1][1]))}</span></button>`;
    h+=`<button class="lkit${g.sel&&g.sel.s==='r'&&g.sel.i===k?' sel':''}${g.over&&rc?(g.ok[rOf[k]]?' ok':' ko'):''}" data-s="r" data-i="${k}" ${rc&&!g.over?`style="border-color:${rcol}"`:''} onclick="lnkTap('r',${k})" ${g.over?'disabled':''}><span>${esc(L(b[2][0],b[2][1]))}</span></button>`;
  });
  box.innerHTML=h;
  const n=Object.keys(g.links).length;
  const sec=g.t0?Math.round(((g.over?g.tend:Date.now())-g.t0)/1000):0;
  $('lkhud').textContent=L('Liens','Links')+' '+n+'/'+LNK_N+(g.t0?' · '+L('Temps','Time')+' '+sec+' s':'');
  if(!g.over) $('lkact').innerHTML=`<button class="primary" onclick="lnkCheck()" ${n<LNK_N?'disabled':''}>${L('Valider','Check')}</button>`;
  lnkLines();
}
function lnkLines(){                       // trace les traits entre les éléments reliés
  const g=LK, box=$('lkbox'), svg=$('lksvg'); if(!g||!box||!svg) return;
  const bb=box.getBoundingClientRect(); let s='';
  Object.keys(g.links).forEach(l=>{
    const a=box.querySelector(`[data-s="l"][data-i="${l}"]`), b=box.querySelector(`[data-s="r"][data-i="${g.links[l]}"]`); if(!a||!b) return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const x1=ra.right-bb.left, y1=ra.top+ra.height/2-bb.top, x2=rb.left-bb.left, y2=rb.top+rb.height/2-bb.top;
    const col=g.over?(g.ok[l]?'#1a8a4a':'#c0392b'):LNK_COL[l%6];
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="4.5" fill="${col}"/><circle cx="${x2}" cy="${y2}" r="4.5" fill="${col}"/>`;
  });
  svg.innerHTML=s;
}
function lnkTap(side,i){
  const g=LK; if(!g||g.over) return;
  if(!g.t0) g.t0=Date.now();
  const rOf=Object.keys(g.links).find(l=>g.links[l]===i);                        // pour un élément de droite : son partenaire de gauche
  if(side==='l'&&g.links[i]!==undefined){ delete g.links[i]; g.sel=null; return lnkDraw(); }   // lien existant : on l'efface
  if(side==='r'&&rOf!==undefined){ delete g.links[rOf]; g.sel=null; return lnkDraw(); }
  if(!g.sel||g.sel.s===side){ g.sel=(g.sel&&g.sel.s===side&&g.sel.i===i)?null:{s:side,i}; return lnkDraw(); }   // (dé)sélection
  const l=side==='l'?i:g.sel.i, r=side==='r'?i:g.sel.i;                            // un objet + une expression : on crée le lien
  g.links[l]=r; g.sel=null; lnkDraw();
}
function lnkCheck(){
  const g=LK; if(!g||g.over||Object.keys(g.links).length<LNK_N) return;
  g.over=true; g.tend=Date.now(); g.ok={}; let good=0;
  g.left.forEach((pi,k)=>{ const ok=g.right[g.links[k]]===pi; g.ok[k]=ok; if(ok) good++; });
  const sec=Math.round((g.tend-g.t0)/1000), pts=Math.max(0,Math.round(good*70+Math.max(0,80-sec)*(good/LNK_N)));   // 500 pts max : 70 par bonne paire + bonus de vitesse
  const nb=g2Record('link',pts);
  const wrong=g.left.map((pi,k)=>g.ok[k]?'':`<li><b>${LNK[pi][0]} ${esc(L(LNK[pi][1][0],LNK[pi][1][1]))}</b> → ${esc(L(LNK[pi][2][0],LNK[pi][2][1]))}</li>`).join('');
  lnkDraw(); $('lkact').innerHTML='';
  $('lkfb').innerHTML=`<div class="box" style="border-left-color:${good===LNK_N?'var(--ok)':'var(--danger-line)'};background:${good===LNK_N?'rgba(26,138,74,.14)':'rgba(192,57,43,.10)'};color:var(--text);margin-top:12px"><b>${good===LNK_N?L('Bravo !','Well done!'):L('Résultat','Result')} ${pts} pts</b>${nb?' · 🏆 '+L('Nouveau record !','New best!'):''}<br>${good}/${LNK_N} ${L('liens corrects','correct links')} · ${sec} s
   ${wrong?`<div style="margin-top:8px"><b>${L('À retenir :','To remember:')}</b><ul style="margin:4px 0 0;padding-left:20px">${wrong}</ul></div>`:''}
   <div style="margin-top:8px"><button class="primary" onclick="lnkStart()">${L('Rejouer','Play again')}</button> <button onclick="renderGame()">${L('Autres jeux','Other games')}</button></div></div>`;
  g2Board('link','g2lb');
}
window.addEventListener('resize',()=>{ if(LK&&$('lksvg')) lnkLines(); });

/* ---------- DANS L’ORDRE : remettre les étapes d’une procédure dans le bon ordre ---------- */
/* t = titre [fr,en] ; s = étapes dans le BON ordre [[fr,en],…] */
/*
 ===================== DANS L'ORDRE =====================
 ORD : t = titre de la procédure [fr,en] ; s = liste des étapes dans le BON ordre [[fr,en],...].
 Le jeu les mélange et le joueur doit les toucher dans l'ordre correct. POUR AJOUTER UNE PROCEDURE : copier une entrée.
*/
const ORD=[
 {t:['Consignation (LOTO)','Lockout / tagout'],s:[
  ['Prévenir le poste de conduite et arrêter l’alimentation en verre','Warn the control room and stop the glass feed'],
  ['Arrêter la machine par la séquence d’arrêt normale','Stop the machine with the normal stop sequence'],
  ['Ouvrir le sectionneur général et poser son cadenas + étiquette','Open the main disconnect and fit your padlock + tag'],
  ['Isoler et purger l’air comprimé (manomètre à 0 bar)','Isolate and bleed compressed air (gauge at 0 bar)'],
  ['Faire l’essai de démarrage (VAT) : la machine ne doit pas démarrer','Run the start test (VAT): the machine must not start']]},
 {t:['Nettoyage de la zone optique','Cleaning the optical area'],s:[
  ['Consigner la machine','Lock out the machine'],
  ['Aspirer poussières et éclats autour de la zone de détection','Vacuum dust and splinters around the detection area'],
  ['Nettoyer les vitres avec un chiffon propre et le produit adapté','Clean the windows with a clean cloth and the right product'],
  ['Contrôler l’absence de traces, de buée ou de rayures','Check for marks, mist or scratches'],
  ['Remettre les protections, déconsigner et vérifier l’écran','Refit guards, remove lockout and check the screen']]},
 {t:['Calibration du trieur','Sorter calibration'],s:[
  ['Vérifier que la zone optique est propre','Check the optical area is clean'],
  ['Vider le convoyeur / la goulotte','Empty the belt / chute'],
  ['Lancer la procédure de calibration depuis le menu','Start the calibration from the menu'],
  ['Comparer les valeurs obtenues aux tolérances','Compare the values obtained with the tolerances'],
  ['Faire un essai avec du verre connu','Run a test with known glass']]},
 {t:['Contrôle des buses d’éjection','Ejection nozzle check'],s:[
  ['Vérifier la pression d’air d’alimentation','Check the supply air pressure'],
  ['Consigner et purger l’air avant tout démontage','Lock out and bleed the air before dismantling'],
  ['Contrôler visuellement les buses suspectes','Visually inspect the suspect nozzles'],
  ['Remplacer les buses défectueuses','Replace the faulty nozzles'],
  ['Relancer le test d’éjection et noter l’intervention','Run the ejection test again and log the job']]}
];
/*
 ordStart / ordRound / ordDraw / ordTap / ordNext / ordEnd : démarrer, préparer une procédure, dessiner la liste,
 gérer un clic, passer à la suivante, afficher le score (maximum 300 points).
*/
let O=null;   // état de la partie « Dans l’ordre » en cours
function ordStart(){
  const rounds=shuffle(ORD.slice()).slice(0,3);          // 3 procédures tirées au hasard
  O={rounds,r:0,total:0,cur:null};
  gFrame('Dans l’ordre','Put in order','<div id="ordbox"></div>');
  ordRound(); g2Board('order','g2lb');
}
function ordRound(){                       // prépare la procédure courante (étapes mélangées)
  const p=O.rounds[O.r];
  O.cur={p,order:shuffle(p.s.map((s,i)=>i)),next:0,mist:0,pts:0};
  ordDraw();
}
function ordDraw(){
  const c=O.cur, p=c.p, box=$('ordbox'); if(!box) return;
  const done=c.next>=p.s.length, last=O.r>=O.rounds.length-1;
  box.innerHTML=`<div class="row" style="justify-content:space-between"><b>${L('Procédure','Procedure')} ${O.r+1}/${O.rounds.length} : ${esc(L(p.t[0],p.t[1]))}</b><span class="meta">Score ${O.total}</span></div>
   <p class="meta" style="margin:6px 0">${L('Touchez les étapes dans le bon ordre, de la première à la dernière.','Tap the steps in the right order, from first to last.')}</p>
   <ol class="ordlist">${p.s.slice(0,c.next).map(s=>`<li>${esc(L(s[0],s[1]))}</li>`).join('')}</ol>
   ${done?'':`<div>${c.order.filter(ix=>ix>=c.next).map(ix=>`<button class="qopt" onclick="ordTap(${ix})">${esc(L(p.s[ix][0],p.s[ix][1]))}</button>`).join('')}</div>`}
   <div id="ordfb" style="min-height:1.4em;color:var(--danger-line);font-size:.9rem"></div>
   ${done?`<div class="box" style="border-left-color:var(--ok);background:rgba(26,138,74,.14);color:var(--text)"><b>${L('Procédure réussie !','Procedure complete!')} +${c.pts} pts</b> (${c.mist} ${L('erreur(s)','mistake(s)')})
     <div style="margin-top:8px"><button class="primary" onclick="${last?'ordEnd()':'ordNext()'}">${last?L('Voir le résultat','See result'):L('Procédure suivante →','Next procedure →')}</button></div></div>`:''}`;
}
function ordTap(ix){                       // ix = index de l’étape touchée (dans l’ordre correct d’origine)
  const c=O&&O.cur; if(!c||c.next>=c.p.s.length) return;
  if(ix===c.next){                         // bonne étape
    c.next++;
    if(c.next>=c.p.s.length){ c.pts=Math.max(10,100-15*c.mist); O.total+=c.pts; }   // 100 pts par procédure, -15 par erreur (min. 10)
    ordDraw();
  } else {                                 // mauvaise étape
    c.mist++; const f=$('ordfb'); if(f) f.textContent=L('Pas encore : ce n’est pas l’étape suivante.','Not yet: that is not the next step.');
  }
}
function ordNext(){ O.r++; ordRound(); }
function ordEnd(){
  const nb=g2Record('order',O.total);
  $('ordbox').innerHTML=`<div style="text-align:center;padding:10px 0"><div style="font-size:2.4rem;font-weight:800">${O.total} pts</div>
   <p class="meta">${nb?'🏆 '+L('Nouveau record !','New best!')+' · ':''}${L('Maximum possible : 300 pts','Maximum possible: 300 pts')}</p>
   <div class="row" style="justify-content:center"><button class="primary" onclick="ordStart()">${L('Rejouer','Play again')}</button><button onclick="renderGame()">${L('Autres jeux','Other games')}</button></div></div>`;
  g2Board('order','g2lb');
}

/*
 ===================== DEMARRAGE =====================
 1) Test de la photo de fond : si fond-verre.jpg se charge, on active la classe "photo" sur <html>.
 2) boot() lance l'appli (connexion ou accueil).
 3) Enregistrement du service worker sw.js : c'est lui qui permet d'ouvrir l'appli hors connexion
    et de l'installer comme une application.
*/
/*
 ============================================================================
 ===================== 4. SIBELCO 2.0 : LOGO 3D ET CONFORT =====================
 Tout ce bloc est NOUVEAU. Il ne modifie pas la logique existante (tutos, fiches, jeux, comptes) :
   - Logo3D()          : globe Sibelco en 3D (dessiné au canvas, SANS bibliothèque -> marche hors connexion)
   - openLogoViewer()  : agrandit le logo 3D quand on clique sur le logo du bandeau
   - confetti()        : pluie de confettis (record battu dans un jeu, formation validée)
   - pastille Hors ligne, bouton Installer, bandeau "nouvelle version disponible"
   - petits confort : afficher/masquer le mot de passe, alerte Verr. Maj, raccourci "/" pour chercher,
     effet d'onde sur les boutons, compteurs animés sur l'accueil.
 ============================================================================
*/

/* ============================ COMMENT EST FAIT LE LOGO 3D ============================
 Il n'y a AUCUNE image ni bibliothèque 3D (pas de Three.js) : tout est calculé et dessiné par le code, 60 fois par seconde,
 dans un <canvas> (une zone de dessin). Les étapes, dans l'ordre :
   1) LA FORME   : on part d'un "icosaèdre" (une boule à 20 faces triangulaires) qu'on découpe 3 fois en petits triangles
                   -> environ 1300 triangles qui forment une sphère. Chaque sommet a 3 coordonnées (x, y, z).
                   (voir LOGO_GEO ci-dessous ; calculé UNE seule fois au démarrage)
   2) LA ROTATION: à chaque image, on fait tourner tous les points avec 2 angles : "yaw" (gauche-droite) et "pitch"
                   (haut-bas). Quand vous glissez la souris, on ajoute à ces angles le déplacement de la souris.
                   Quand vous lâchez, la vitesse de rotation (vy) diminue doucement = l'inertie.
   3) LA PERSPECTIVE : les points proches de nous sont dessinés plus grands que ceux du fond (fonction prj).
   4) LA LUMIERE : chaque triangle est plus ou moins clair selon qu'il est tourné vers la lumière (en haut à gauche).
                   Couleur = mélange entre LOGO_COL.dark (bleu foncé) et LOGO_COL.light (bleu clair), + un reflet blanc.
   5) L'EFFET "LOGO SIBELCO" : chaque triangle est dessiné RETRECI vers son centre (variable s) : on voit du blanc entre
                   les triangles, comme sur votre logo. Ceux tournés vers le bord de la boule sont plus petits.
   6) L'ANNEAU   : un ruban en croissant (fin aux 2 bouts, large au milieu) tourne autour. La moitié derrière la boule est
                   dessinée AVANT elle, la moitié devant APRES -> l'anneau passe bien devant/derrière.
   7) LE CLIC    : un "ressort" (spring) pousse les triangles vers l'extérieur puis les ramène (= l'éclatement), la vitesse
                   de rotation est boostée (spin), un halo (glow) et des ondes (ripples) sont dessinés.
 Si le dessin échoue (navigateur très ancien), le code affiche simplement l'image icon-512.png à la place.

 >>> POUR MODIFIER : changez uniquement les chiffres de LOGO_CFG ci-dessous (le reste n'a pas besoin d'être touché). <<<
===================================================================================== */
const LOGO_CFG = {
  size    : 0.29,   // taille du globe dans son cadre (0.20 = petit, 0.35 = très grand ; au-delà l'anneau est coupé)
  idle    : 0.007,  // vitesse de rotation quand on ne touche pas (0 = immobile, 0.02 = rapide)
  spin    : 0.38,   // force du tour sur lui-même au clic (0.2 = doux, 0.6 = toupie)
  explode : 0.30,   // force de l'éclatement au clic (0 = aucun, 0.5 = gros éclatement)
  detail  : 3,      // nombre de triangles : 2 = 320 (facetté, rapide), 3 = 1280 (joli), 4 = 5120 (lent sur vieux téléphone)
  tri     : 0.54,   // taille des triangles : 0.3 = beaucoup de blanc entre eux, 0.95 = globe presque plein
  ringR   : 1.45,   // rayon de l'anneau (1 = colle au globe, 1.8 = très large)
  ringW   : 0.34,   // épaisseur du croissant (0.15 = fin, 0.5 = épais)
  ringArc : 4.9,    // longueur du croissant en radians (3.1 = demi-tour, 6.28 = anneau complet)
  ringTilt: -0.5    // inclinaison de l'anneau sur le côté (0 = horizontal)
};

/* ---------- LOGO 3D ----------
 Principe : une sphère faite de ~1300 petits triangles (icosphère), un anneau en croissant autour,
 le tout éclairé et dessiné face par face. Interactions :
   - GLISSER (souris ou doigt) : fait tourner le globe, avec de l'inertie
   - CLIQUER / TAPOTER        : le globe "explose" en éclats qui reviennent, tourne vite, onde lumineuse
   - SURVOL                   : le globe s'incline légèrement vers le pointeur
   - CLAVIER                  : flèches = tourner, Entrée/Espace = éclat
 Pour changer les couleurs : voir LOGO_COL (bleu foncé -> bleu clair) et RING_COL.            */
/* Couleurs du globe (rouge,vert,bleu de 0 à 255). Pour un autre bleu, changez ces 6 chiffres. */
const LOGO_COL = { dark:[5,48,126], light:[118,204,250] };
/* Couleurs de l'anneau (même principe) */
const RING_COL = { dark:[8,42,104], light:[38,122,212] };
const LOGO_GEO = (()=>{
  const nrm = v => { const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; };
  const t=(1+Math.sqrt(5))/2;
  const V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(nrm);
  let F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const cache={};
  const mid=(a,b)=>{ const k=a<b?a+'_'+b:b+'_'+a; if(cache[k]!==undefined) return cache[k];
    V.push(nrm([(V[a][0]+V[b][0])/2,(V[a][1]+V[b][1])/2,(V[a][2]+V[b][2])/2])); return cache[k]=V.length-1; };
  for(let s=0;s<LOGO_CFG.detail;s++){ const N=[]; for(const [a,b,c] of F){ const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a); N.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]); } F=N; }
  const faces=F.map((f,i)=>({ i:f, n:nrm([V[f[0]][0]+V[f[1]][0]+V[f[2]][0],V[f[0]][1]+V[f[1]][1]+V[f[2]][1],V[f[0]][2]+V[f[1]][2]+V[f[2]][2]]),
                              r:((Math.imul(i+1,2654435761)>>>0)%10007)/10007 }));
  return { V, faces };
})();

function Logo3D(host,opt){
  opt=opt||{};
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.createElement('canvas'), ctx=cv.getContext('2d');
  host.appendChild(cv);
  const sh=document.createElement('div'); sh.className='shadow'; host.appendChild(sh);
  if(opt.hint){ const h=document.createElement('div'); h.className='hint'; h.textContent=opt.hint; host.appendChild(h); host._hint=h; }
  host.setAttribute('role','img'); host.setAttribute('aria-label','Logo Sibelco 3D'); host.tabIndex=0;

  const { V, faces } = LOGO_GEO, nV=V.length;
  const PX=new Float32Array(nV), PY=new Float32Array(nV), PZ=new Float32Array(nV);
  let W=0, DPR=Math.min(2,window.devicePixelRatio||1);
  // ETAT : yaw/pitch = angles actuels ; vy/vp = vitesses (l'inertie) ; spring = éclatement ; glow/pulse = lueur du clic
  let yaw=-0.5, pitch=0.32, vy=reduce?0:LOGO_CFG.idle, vp=0, hx=0, hy=0, hxT=0, hyT=0;
  let spring=0, springV=0, glow=0, pulse=0, ringSpin=0; const ripples=[];
  let drag=false, lx=0, ly=0, moved=0, t0=0, lastT=performance.now(), running=true, ptrId=null;
  const IDLE = reduce?0:LOGO_CFG.idle;

  // fit() : adapte la résolution du canvas à la taille réelle (et aux écrans Retina) -> le dessin reste net
  function fit(){ const w=Math.max(90,Math.round(host.clientWidth)); if(w!==W){ W=w; cv.width=cv.height=Math.round(W*DPR); cv.style.width=cv.style.height=W+'px'; } }
  // burst() = ce qui se passe au CLIC : éclatement + rotation rapide + lueur + onde. Appelé aussi par Entrée/Espace.
  function burst(dir){
    if(host._hint){ host._hint.classList.add('gone'); }
    springV=reduce?0:LOGO_CFG.explode; glow=1; pulse=1; ripples.push({t:0});
    if(!reduce) vy=(dir||1)*(LOGO_CFG.spin+Math.random()*0.12);
  }
  // SOURIS / DOIGT : pointerdown = on attrape, pointermove = on tourne, pointerup = on lâche.
  // Bougé de moins de 6 px en moins de 0,45 s = c'est un CLIC (burst) et non un glissement.
  host.addEventListener('pointerdown',e=>{
    drag=true; ptrId=e.pointerId; lx=e.clientX; ly=e.clientY; moved=0; t0=performance.now();
    try{ host.setPointerCapture(e.pointerId); }catch(x){}
    vp=0; if(host._hint) host._hint.classList.add('gone');
  });
  host.addEventListener('pointermove',e=>{
    const r=host.getBoundingClientRect();
    if(drag&&e.pointerId===ptrId){
      const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
      yaw+=dx*0.011; pitch=Math.max(-1.25,Math.min(1.25,pitch+dy*0.009));
      vy=dx*0.011*0.9+vy*0.1; vp=dy*0.009*0.5;
    }else if(e.pointerType==='mouse'){
      hxT=((e.clientX-r.left)/r.width-0.5)*2; hyT=((e.clientY-r.top)/r.height-0.5)*2;
    }
  });
  const up=e=>{
    if(!drag||(e.pointerId!==undefined&&e.pointerId!==ptrId)) return; drag=false;
    if(moved<6 && performance.now()-t0<450) burst(1);
  };
  host.addEventListener('pointerup',up); host.addEventListener('pointercancel',()=>{drag=false;});
  host.addEventListener('pointerleave',()=>{ hxT=0; hyT=0; });
  host.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){ vy-=0.05; e.preventDefault(); } else if(e.key==='ArrowRight'){ vy+=0.05; e.preventDefault(); }
    else if(e.key==='ArrowUp'){ pitch=Math.max(-1.25,pitch-0.15); e.preventDefault(); } else if(e.key==='ArrowDown'){ pitch=Math.min(1.25,pitch+0.15); e.preventDefault(); }
    else if(e.key==='Enter'||e.key===' '){ burst(1); e.preventDefault(); }
  });

  const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
  const rgb=(c,k)=>`rgb(${Math.max(0,Math.min(255,c[0]*k|0))},${Math.max(0,Math.min(255,c[1]*k|0))},${Math.max(0,Math.min(255,c[2]*k|0))})`;
  const LX=-0.45, LY=0.62, LZ=0.64, HL=Math.hypot(LX,LY,LZ+1);           // lumière + demi-vecteur (reflet)
  const lx0=LX/Math.hypot(LX,LY,LZ), ly0=LY/Math.hypot(LX,LY,LZ), lz0=LZ/Math.hypot(LX,LY,LZ);
  const hx0=LX/HL, hy0=LY/HL, hz0=(LZ+1)/HL;
  const DCAM=3.6;

  // frame() = UNE IMAGE d'animation, appelée ~60 fois/s par le navigateur (requestAnimationFrame).
  // Elle s'arrête toute seule quand le logo disparaît de la page (host.isConnected).
  function frame(now){
    if(!host.isConnected){ running=false; return; }
    requestAnimationFrame(frame);
    if(document.hidden) { lastT=now; return; }
    const dt=Math.min(3,(now-lastT)/16.667); lastT=now;
    fit(); const S=W*DPR, cx=S/2, cy=S/2, R0=S*LOGO_CFG.size*(1+pulse*0.05);

    // --- 1. MOUVEMENT : inertie (la vitesse revient doucement vers la vitesse de repos IDLE), ressort, lueur ---
    if(!drag){
      yaw+=vy*dt; pitch+=vp*dt;
      vy+=(IDLE-vy)*0.022*dt; vp*=Math.pow(0.92,dt);
      const rest=0.32+hy*0.28; pitch+=(rest-pitch)*0.03*dt;
    }
    hx+=(hxT-hx)*0.08*dt; hy+=(hyT-hy)*0.08*dt;
    springV+=(-0.05*spring-0.22*springV)*dt; spring+=springV*dt;
    glow*=Math.pow(0.95,dt); pulse*=Math.pow(0.92,dt); ringSpin+=(reduce?0:0.004)*dt;
    const Y=yaw+hx*0.4, P=pitch;
    const cY=Math.cos(Y), sY=Math.sin(Y), cP=Math.cos(P), sP=Math.sin(P);
    const rot=(x,y,z)=>{ const x1=x*cY+z*sY, z1=-x*sY+z*cY; return [x1, y*cP-z1*sP, y*sP+z1*cP]; };
    const prj=(x,y,z)=>{ const q=DCAM/(DCAM-z); return [cx+x*q*R0, cy-y*q*R0]; };

    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,S,S);

    // halo lumineux sous le globe (s'intensifie au clic)
    const g=ctx.createRadialGradient(cx,cy,R0*0.4,cx,cy,Math.min(S*0.5,R0*(1.9+glow*0.5)));
    g.addColorStop(0,`rgba(70,170,255,${0.18+glow*0.35})`); g.addColorStop(1,'rgba(70,170,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,S,S);

    // --- anneau en croissant : partie ARRIERE (z<0) dessinée avant le globe ---
    const ringQuads=[];
    { const N=56, arc=LOGO_CFG.ringArc, Rr=LOGO_CFG.ringR, Wm=LOGO_CFG.ringW, tz=LOGO_CFG.ringTilt;
      const cz=Math.cos(tz), sz=Math.sin(tz);
      const pt=(a,r)=>{ const x=Math.cos(a)*r, y=0, z=Math.sin(a)*r;     // anneau à plat, puis incliné sur le côté
        return rot(x*cz-y*sz, x*sz+y*cz, z); };
      let prevO=null, prevI=null, prevU=0;
      for(let k=0;k<=N;k++){
        const u=k/N, a=ringSpin+u*arc+0.2, w=Wm*Math.pow(Math.sin(Math.PI*u),0.75);
        const o=pt(a,Rr+w*0.5), i=pt(a,Rr-w*0.5);
        if(prevO){ const z=(prevO[2]+prevI[2]+o[2]+i[2])/4; ringQuads.push({z,u:(u+prevU)/2,q:[prevO,o,i,prevI]}); }
        prevO=o; prevI=i; prevU=u;
      }
    }
    const drawRing=front=>{
      for(const r of ringQuads){ if((r.z>=0)!==front) continue;
        const k=0.55+0.55*Math.max(0,Math.min(1,(r.z+1.2)/2.4)), c=mix(RING_COL.dark,RING_COL.light,Math.pow(Math.sin(Math.PI*r.u),0.8)*0.75*k);
        ctx.fillStyle=rgb(c,0.9+0.25*k); ctx.beginPath();
        r.q.forEach((p,j)=>{ const s=prj(p[0],p[1],p[2]); j?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]); }); ctx.closePath(); ctx.fill();
      }
    };
    drawRing(false);

    // --- 3. GLOBE : rotation de tous les sommets puis dessin des faces tournées vers nous ---
    for(let i=0;i<nV;i++){ const v=V[i], r=rot(v[0],v[1],v[2]); PX[i]=r[0]; PY[i]=r[1]; PZ[i]=r[2]; }
    const exp=Math.max(-0.04,spring);
    // pour chaque petit triangle : tourné vers nous ? quelle lumière ? quelle taille ? -> puis on le dessine
    for(const f of faces){
      const n=rot(f.n[0],f.n[1],f.n[2]);
      if(n[2]<=-0.02 && exp<0.05) continue;
      const a=f.i[0], b=f.i[1], c=f.i[2];
      const mx=(PX[a]+PX[b]+PX[c])/3, my=(PY[a]+PY[b]+PY[c])/3, mz=(PZ[a]+PZ[b]+PZ[c])/3;
      const lam=Math.max(0,n[0]*lx0+n[1]*ly0+n[2]*lz0);
      const face=Math.max(0,Math.min(1,n[2]*1.5+0.1));
      const s=(LOGO_CFG.tri+(0.98-LOGO_CFG.tri)*Math.min(1,0.4*face+0.6*lam+0.1))*(0.86+0.14*f.r);           // taille du triangle (effet "pixels")
      const off=exp*(0.5+f.r*1.1);                                                         // éclatement au clic
      const spec=Math.pow(Math.max(0,n[0]*hx0+n[1]*hy0+n[2]*hz0),28);
      let col=mix(LOGO_COL.dark,LOGO_COL.light,Math.max(0,Math.min(1,0.06+lam*0.9+(f.r-0.5)*0.26)));
      col=[col[0]+spec*140,col[1]+spec*110,col[2]+spec*70];
      ctx.fillStyle=rgb(col,0.72+0.4*face);
      ctx.beginPath();
      const ids=[a,b,c];
      for(let j=0;j<3;j++){ const id=ids[j];
        const x=mx+(PX[id]-mx)*s+n[0]*off, y=my+(PY[id]-my)*s+n[1]*off, z=mz+(PZ[id]-mz)*s+n[2]*off;
        const p=prj(x,y,z); j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }
      ctx.closePath(); ctx.fill();
    }
    drawRing(true);

    // --- 5. ONDES lumineuses du clic (cercles qui s'agrandissent en s'effaçant) ---
    for(let i=ripples.length-1;i>=0;i--){ const r=ripples[i]; r.t+=dt;
      if(r.t>40){ ripples.splice(i,1); continue; }
      ctx.strokeStyle=`rgba(60,160,240,${Math.pow(1-r.t/40,1.5)*0.7})`; ctx.lineWidth=Math.max(1,2.2*DPR*(1-r.t/60));
      ctx.beginPath(); ctx.arc(cx,cy,R0*(1.05+r.t*0.02),0,Math.PI*2); ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
  return { burst, stop(){ running=false; } };
}

/* Monte un globe dans chaque bloc .logo3d de la page qui n'en a pas encore */
function mountLogos(){
  document.querySelectorAll('.logo3d:not([data-ok])').forEach(h=>{
    h.dataset.ok='1';
    try{ h._l3=Logo3D(h,{hint:h.classList.contains('nohint')?'':L('Cliquez ou faites glisser','Click or drag')}); }catch(e){ h.innerHTML='<img src="icon-512.png" alt="Sibelco" style="width:100%">'; }
  });
  document.querySelectorAll('[data-count]:not([data-done])').forEach(el=>{
    el.dataset.done='1'; const to=+el.dataset.count||0; if(!to){ el.textContent='0'; return; }
    const t0=performance.now(); (function tick(n){ const k=Math.min(1,(n-t0)/900), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e); if(k<1&&el.isConnected) requestAnimationFrame(tick); })(t0);
  });
}
new MutationObserver(mountLogos).observe($('app'),{childList:true});

/* Agrandir le logo : clic sur le logo du bandeau (Ctrl/Maj+clic ouvre quand même le site Sibelco) */
function openLogoViewer(e){
  if(e&&(e.ctrlKey||e.metaKey||e.shiftKey||e.button===1)) return true;
  if(e&&e.preventDefault) e.preventDefault();
  if($('logoov')) return false;
  const o=document.createElement('div'); o.id='logoov'; o.className='logoov noprint';
  o.innerHTML=`<div class="logoov-card" role="dialog" aria-modal="true" aria-label="Logo Sibelco 3D">
    <button class="logoov-x" aria-label="${L('Fermer','Close')}">✕</button>
    <div class="logo3d big"></div><div class="wordmark">SIBELCO</div>
    <p class="meta" style="text-align:center;margin:6px 0 12px">${L('Faites tourner le logo avec la souris ou le doigt','Spin the logo with your mouse or finger')}</p>
    <a class="btn primary" href="https://www.sibelco.com/en/country/france" target="_blank" rel="noopener">sibelco.com ↗</a></div>`;
  const close=()=>{ o.classList.add('out'); setTimeout(()=>o.remove(),180); document.removeEventListener('keydown',esc); };
  const esc=ev=>{ if(ev.key==='Escape') close(); };
  o.addEventListener('click',ev=>{ if(ev.target===o||ev.target.closest('.logoov-x')) close(); });
  document.addEventListener('keydown',esc); document.body.appendChild(o); mountLogos();
  return false;
}

/* ---------- CONFETTIS ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti noprint'; document.body.appendChild(cv);
  const D=Math.min(2,window.devicePixelRatio||1), w=cv.width=innerWidth*D, h=cv.height=innerHeight*D, x=cv.getContext('2d');
  const cols=['#0a5aa8','#2d8fe0','#5aaeea','#9fd8fb','#ffffff','#e8943a'];
  const P=Array.from({length:110},()=>({x:w/2+(Math.random()-.5)*w*.25,y:h*0.35,vx:(Math.random()-.5)*14*D,vy:(-Math.random()*13-4)*D,s:(4+Math.random()*6)*D,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(n){ const k=(n-t0)/2400; x.clearRect(0,0,w,h);
    P.forEach(p=>{ p.vy+=0.38*D; p.x+=p.vx; p.y+=p.vy; p.vx*=.992; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-k*k); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); x.restore(); });
    if(k<1) requestAnimationFrame(f); else cv.remove(); })(t0);
}
// Déclenchement : record battu dans un jeu, formation validée (on "enveloppe" les fonctions existantes)
(function(){
  const _gRecord=gRecord;
  gRecord=function(g){ const id=settings.id||'x', before=((gScores()[id]||{}).best)||0; _gRecord(g); if(g&&g.score>before&&g.score>0) setTimeout(confetti,250); };
  const _g2=g2Record;
  g2Record=function(a,b){ const nb=_g2(a,b); if(nb&&b>0) setTimeout(confetti,250); return nb; };
  const _vt=validateTraining;
  validateTraining=function(){ _vt(); confetti(); };
})();

/* ---------- HORS LIGNE / INSTALLATION / MISE A JOUR ---------- */
let deferredInstall=null;
function netUpdate(){ const n=$('net'); if(!n) return; n.textContent='● '+L('Hors ligne','Offline'); n.classList.toggle('hidden',navigator.onLine!==false); }
function isStandalone(){ return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true; }
function instUpdate(){
  const b=$('bInstall'); if(!b) return;
  const st=isStandalone(), lbl=st?L('Désinstaller','Uninstall'):L('Installer','Install');
  b.innerHTML='<span aria-hidden="true">'+(st?'✕':'⤓')+'</span><span class="instlbl"> '+lbl+'</span>';
  b.title=lbl; b.setAttribute('aria-label',lbl);
  b.classList.toggle('primary',!st);
  b.classList.remove('hidden');
}
window.addEventListener('online',()=>{ netUpdate(); toast(L('Connexion rétablie','Back online')); });
window.addEventListener('offline',()=>{ netUpdate(); toast(L('Mode hors ligne : l’appli reste utilisable','Offline mode: the app still works')); });
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; instUpdate(); });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; instUpdate(); toast(L('Application installée','App installed')); });

/* Fenêtre d'aide Installer / Désinstaller.
   Un site web ne peut pas désinstaller lui-même une appli : seul l'appareil le peut. On explique donc comment faire,
   et on propose en plus de supprimer la copie hors ligne gardée par l'appli (service worker + cache). */
function instPlatform(){
  const ua=navigator.userAgent||'';
  if(/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)) return 'ios';
  if(/android/i.test(ua)) return 'android';
  return 'desktop';
}
function instClose(){ const o=$('instov'); if(o) o.remove(); document.removeEventListener('keydown',instKey); }
function instKey(e){ if(e.key==='Escape') instClose(); }
async function instClearOffline(){
  if(!confirm(L('Supprimer la copie hors ligne de l’appli ? Vos données (comptes, tutos) ne sont pas touchées, mais l’appli ne s’ouvrira plus sans Internet tant que vous ne l’aurez pas rouverte avec une connexion.','Delete the app’s offline copy? Your data (accounts, tutorials) is not affected, but the app will not open without Internet until you reopen it while online.'))) return;
  try{
    if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
    toast(L('Copie hors ligne supprimée','Offline copy deleted'));
  }catch(e){ toast(L('Impossible de supprimer la copie hors ligne','Could not delete the offline copy')); }
  instClose();
}

  };
  const o=document.createElement('div'); o.id='instov'; o.className='instov noprint'; o.setAttribute('role','dialog'); o.setAttribute('aria-modal','true');
  o.innerHTML='<div class="instbox"><h2>'+(un?L('Désinstaller l’appli','Uninstall the app'):L('Installer l’appli','Install the app'))+'</h2>'
    +'<p>'+steps[mode][pf]+'</p>'
    +(un?'':'<p class="instnote">'+L('Si l’option n’apparaît pas, vérifiez que la page est ouverte en https et dans Chrome, Edge ou Safari (Firefox ne propose pas l’installation sur ordinateur).','If the option does not appear, make sure the page is opened over https in Chrome, Edge or Safari (Firefox does not offer installation on desktop).')+'</p>')
    +(un?'<p class="instnote">'+L('Un site ne peut pas se désinstaller lui-même : c’est l’appareil qui le fait avec les étapes ci-dessus.','A website cannot uninstall itself: the device does it using the steps above.')+'</p>':'')
    +'<div class="instact">'+(un?'<button type="button" id="instClr" class="small">'+L('Supprimer la copie hors ligne','Delete offline copy')+'</button>':'')
    +'<button type="button" id="instOk" class="primary small">'+L('Fermer','Close')+'</button></div></div>';
  o.addEventListener('click',e=>{ if(e.target===o) instClose(); });
  document.body.appendChild(o); document.addEventListener('keydown',instKey);
  $('instOk').onclick=instClose; if($('instClr')) $('instClr').onclick=instClearOffline;

/* ============================================================================
 ===================== 5. PROTECTION DES DONNEES (tutos, fiches, comptes) =====================
 PROBLEME : les tutos que vous créez sont gardés dans le navigateur de l'appareil (localStorage). Le navigateur peut les
 effacer (nettoyage du cache, manque de place, désinstallation...). Cette section ajoute 4 protections :
   1) "STOCKAGE PERSISTANT" : on demande au navigateur de ne JAMAIS effacer nos données tout seul (navigator.storage.persist).
   2) COPIE DE SECOURS AUTOMATIQUE : à chaque enregistrement, une 2e copie est faite dans IndexedDB (autre zone du navigateur,
      base "sibelco_backup"). Au démarrage, si les données principales ont disparu, elles sont RESTAUREES toutes seules.
   3) SAUVEGARDE COMPLETE EN FICHIER (Paramètres > "Sauvegarde des données") : tutos + fiches + comptes + scores dans un seul
      fichier .json à garder (mail, clé USB, Drive...) et à réimporter sur n'importe quel appareil.
   4) RAPPEL sur l'accueil (classes 3 et 4) si aucune sauvegarde fichier depuis 14 jours.
 LIMITES A CONNAITRE : les PDF/PowerPoint ajoutés aux fiches sont dans une autre zone (sibelco_files) : ils ne sont pas
 dans la copie de secours ni dans le fichier .json (trop volumineux). Et chaque appareil a SES données : pour partager
 des tutos entre téléphones, utilisez la sauvegarde en fichier (ou un vrai serveur, non prévu ici).
 ============================================================================ */
const BK_KEYS=[KEY,UKEY,FKEY,SKEY,GSKEY,G2KEY,LANG_KEY,'sibelco_seed_aa_v2','sibelco_last_export'];  // données à protéger
const LAST_EXPORT='sibelco_last_export';
// petite base IndexedDB "sibelco_backup" : un seul enregistrement "snap" = copie de toutes les clés ci-dessus
function bkDb(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('sibelco_backup',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function bkPut(v){ const db=await bkDb(); return new Promise((ok,ko)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,'snap'); tx.oncomplete=()=>ok(); tx.onerror=()=>ko(tx.error); }); }
async function bkGet(){ const db=await bkDb(); return new Promise((ok,ko)=>{ const tx=db.transaction('kv','readonly'), rq=tx.objectStore('kv').get('snap'); tx.oncomplete=()=>ok(rq.result); tx.onerror=()=>ko(tx.error); }); }
function bkSnapshot(){ const data={}; BK_KEYS.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!==null) data[k]=v; }catch(e){} }); return data; }
let bkTimer=null;
function bkSchedule(){ clearTimeout(bkTimer); bkTimer=setTimeout(bkNow,700); }       // attend 0,7 s après le dernier enregistrement
async function bkNow(){ try{ const data=bkSnapshot(); if(data[KEY]||data[UKEY]) await bkPut({ts:Date.now(),data}); }catch(e){} }
// on "enveloppe" les fonctions d'enregistrement existantes : elles font leur travail PUIS déclenchent la copie de secours
(function(){
  const a=save, b=saveFiches, c=saveUsers;
  save=function(){ a(); bkSchedule(); };
  saveFiches=function(){ b(); bkSchedule(); };
  saveUsers=function(){ c(); bkSchedule(); };
  const e=exportJSON; exportJSON=function(){ e(); try{ localStorage.setItem(LAST_EXPORT,String(Date.now())); }catch(x){} bkSchedule(); };
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) bkNow(); });   // copie aussi quand on quitte l'appli
})();
// stockage persistant : le navigateur ne doit plus effacer nos données de lui-même
async function askPersist(){ try{ if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted())) await navigator.storage.persist(); }catch(e){} }
// RESTAURATION : appelée AVANT le démarrage. Si tout a disparu du stockage principal mais que la copie de secours existe -> on remet tout.
async function safeBoot(){
  let restored=false;
  try{
    const lost=localStorage.getItem(KEY)===null&&localStorage.getItem(UKEY)===null;
    if(lost&&!sessionStorage.getItem('sibelco_restoring')){
      const b=await bkGet();
      if(b&&b.data&&(b.data[KEY]||b.data[UKEY])){ Object.keys(b.data).forEach(k=>localStorage.setItem(k,b.data[k])); sessionStorage.setItem('sibelco_restoring','1'); restored=true; }
    }
  }catch(e){}
  if(restored){ location.reload(); return; }          // le script relit alors les données restaurées
  try{ sessionStorage.removeItem('sibelco_restoring'); }catch(e){}
  boot(); askPersist(); setTimeout(bkNow,1500);
}
// SAUVEGARDE COMPLETE en fichier / RESTAURATION depuis un fichier
function fullBackup(){
  const data=bkSnapshot(); const blob=new Blob([JSON.stringify({app:'sibelco-tutos',version:2,date:new Date().toISOString(),data},null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='sibelco-sauvegarde-complete-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{ localStorage.setItem(LAST_EXPORT,String(Date.now())); }catch(e){} bkSchedule();
  toast(L('Sauvegarde complète téléchargée','Full backup downloaded')); setTimeout(()=>{ if(state.view==='settings') renderSettings(); },300);
}
function fullRestore(ev){
  const f=ev.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result); if(!d||d.app!=='sibelco-tutos'||!d.data||typeof d.data!=='object') throw 0;
      if(!confirm(L('Remplacer TOUTES les données de cet appareil (tutos, fiches, comptes, scores) par celles de la sauvegarde ?','Replace ALL data on this device (tutorials, sheets, accounts, scores) with the backup?'))) return;
      Object.keys(d.data).forEach(k=>{ if(BK_KEYS.includes(k)&&typeof d.data[k]==='string') localStorage.setItem(k,d.data[k]); });
      localStorage.removeItem(SESS); location.reload();
    }catch(e){ toast(T('invalid')); } ev.target.value=''; };
  r.readAsText(f);
}
const fmtD=t=>t?new Date(+t).toLocaleString(lang,{dateStyle:'short',timeStyle:'short'}):L('jamais','never');
// Panneau "Sauvegarde des données" ajouté en bas des Paramètres
(function(){
  const rs=renderSettings;
  renderSettings=function(){
    rs();
    const adm=settings.cls>=3;
    $('app').insertAdjacentHTML('beforeend',`<div class="panel" id="safepanel"><h3 style="margin-top:0">${L('Sauvegarde des données','Data backup')}</h3>
      <p class="meta">${L('Les tutos sont enregistrés sur CET appareil. Une copie de secours automatique est faite, mais gardez aussi un fichier de sauvegarde.','Tutorials are stored on THIS device. An automatic safety copy is made, but also keep a backup file.')}</p>
      <div id="safest" class="meta" style="display:block;line-height:1.9">…</div>
      ${adm?`<div class="row" style="margin-top:10px"><button class="primary" onclick="fullBackup()">${L('Télécharger la sauvegarde complète','Download full backup')}</button>
      <button onclick="document.getElementById('fullimp').click()">${L('Restaurer depuis un fichier','Restore from file')}</button>
      <input id="fullimp" type="file" accept="application/json" class="hidden" onchange="fullRestore(event)"></div>`:''}</div>`);
    (async()=>{
      let per=false, use='', snap=null;
      try{ per=!!(navigator.storage&&navigator.storage.persisted&&await navigator.storage.persisted()); }catch(e){}
      try{ const es=await navigator.storage.estimate(); use=(es.usage/1048576).toFixed(1)+' Mo / '+(es.quota/1048576/1024).toFixed(1)+' Go'; }catch(e){}
      try{ snap=await bkGet(); }catch(e){}
      const el=$('safest'); if(!el) return;
      el.innerHTML=`<div>${per?'✅':'⚠️'} ${L('Protection du navigateur','Browser protection')} : <b>${per?L('activée (non effaçable automatiquement)','on (not auto-erased)'):L('non accordée','not granted')}</b>${per?'':` <button class="small" onclick="askPersist().then(()=>renderSettings())">${L('Activer','Enable')}</button>`}</div>
        <div>${snap?'✅':'⚠️'} ${L('Copie de secours automatique','Automatic safety copy')} : <b>${snap?fmtD(snap.ts):L('aucune pour l’instant','none yet')}</b></div>
        <div>${localStorage.getItem(LAST_EXPORT)?'✅':'⚠️'} ${L('Dernière sauvegarde en fichier','Last backup file')} : <b>${fmtD(localStorage.getItem(LAST_EXPORT))}</b></div>
        ${use?`<div>${L('Espace utilisé','Space used')} : ${use}</div>`:''}`;
    })();
  };
})();
// Rappel sur l'accueil (classes 3 et 4) : pas de sauvegarde fichier depuis 14 jours alors que des tutos ont été créés
(function(){
  const rh=renderHome;
  renderHome=function(){
    rh();
    try{
      const last=+localStorage.getItem(LAST_EXPORT)||0, mine=tutos.some(t=>t.updated>0);
      if(settings.cls>=3&&mine&&Date.now()-last>14*864e5){
        const t=document.querySelector('#app .tiles');
        if(t) t.insertAdjacentHTML('beforebegin',`<div class="box"><b>${L('Pensez à sauvegarder','Remember to back up')}</b><br>${L('Dernière sauvegarde en fichier','Last backup file')} : ${fmtD(last)}. ${L('Un fichier de sauvegarde protège vos tutos si le téléphone est réinitialisé.','A backup file protects your tutorials if the phone is reset.')}<div style="margin-top:8px"><button class="primary small" onclick="fullBackup()">${L('Sauvegarder maintenant','Back up now')}</button></div></div>`);
      }
    }catch(e){}
  };
})();
