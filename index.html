<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!--
============================================================================
 TUTOS MAINTENANCE - TRIEURS OPTIQUES VERRE (Sibelco Reims)
 Guide de lecture du fichier index.html
============================================================================
 C'est une application web (PWA) en 3 fichiers principaux : index.html (la page), style.css (l'apparence)
 et app.js (le programme). Elle fonctionne sans serveur et sans base de données : les données sont gardées
 dans le navigateur de chaque appareil. On peut toujours l'ouvrir en double-cliquant sur index.html.

 FICHIERS DU PROJET (à mettre ensemble dans le même dossier) :
   index.html            -> ce fichier : la structure fixe de la page (bandeau, menu, zone #app)
   style.css             -> l'apparence (couleurs, cartes, boutons, menu, mode sombre...)
   app.js                -> le programme (JavaScript) : il "dessine" les pages en remplissant la zone #app
   sw.js                 -> "service worker" : garde l'appli en cache pour qu'elle marche hors connexion
   maj-version.ps1       -> à lancer après chaque modification : change le numéro de version dans sw.js
   manifest.webmanifest  -> carte d'identité de l'appli (nom, couleurs, icônes) pour l'installer comme une appli
   icon-192.png / icon-512.png -> logo Sibelco : icône de l'appli ET logo en haut à gauche
   fond-verre.jpg        -> photo de fond du site (remplacez-la par une autre photo du même nom pour la changer pour tous ;
                            chacun peut aussi choisir sa photo ou un fond uni dans Paramètres > Fond d'écran)
   donnees.json          -> contenu partagé du site (Paramètres > Exporter pour le site)
   flowsheets/           -> un fichier .js par site (plan interactif)
   lib/                  -> copies locales de pdf.js, JSZip et qrcode-generator (PDF, PowerPoint et QR codes hors ligne)

 LES 3 PARTIES DE L'APPLI :
   1. style.css  : l'apparence (couleurs, cartes, boutons, menu, mode sombre...)
   2. index.html : la structure fixe (bandeau du haut, menu latéral, zone #app)
   3. app.js     : le cerveau. Il "dessine" les pages en remplissant la zone #app.
 Le guide « OÙ MODIFIER QUOI ? » plus bas reste valable : les mots à chercher sont dans app.js (et :root dans style.css).

 OU SONT STOCKEES LES DONNEES (dans le navigateur, par appareil) :
   localStorage  : tutoriels, fiches, comptes, scores, langue, thème, menu épinglé
   IndexedDB     : les gros fichiers (PDF et PowerPoint ajoutés aux fiches)
   => Pour partager des tutoriels entre appareils : bouton Exporter / Importer (fichier .json).
   => Vider les données du navigateur efface tout : pensez à exporter régulièrement.

 COMMENT SONT FAITES LES ILLUSTRATIONS (résumé, détails plus bas dans le code) :
   a) Les pictogrammes (bouteille, clé, livre...) sont des petits dessins SVG
      (de simples traits) définis dans la liste "const ICO" du script.
   b) Les fonds colorés des tuiles/cartes sont des couleurs unies (classes ".cover.c-xxx" dans style.css).
   c) Les photos que vous ajoutez vous-même sont réduites puis stockées dans la fiche.
   d) Les pièces du jeu "Trieur" sont dessinées au pinceau (canvas) dans la fonction gItem.
-->
<!--
 EXPLICATION SUPPLÉMENTAIRE : FICHE D'IDENTITE DU PROJET ET VOCABULAIRE
 PROJET        : Tutos Maintenance – trieurs optiques verre (Sibelco Reims)
 AUTEUR        : [A COMPLETER : votre nom]      DATE DE CREATION : [A COMPLETER]
 HISTORIQUE    : notez ici chaque version (ex. v17 = ajout des machines 3D, date, ce qui a changé).
                 Conservez aussi vos anciennes copies de ce fichier : elles datent et prouvent votre travail.
 IA / OUTILS   : si un assistant IA vous a aidé, écrivez-le ici honnêtement (ex. "code rédigé avec l'aide de Claude,
                 conçu, testé et adapté par [votre nom]"). C'est plus solide qu'une affirmation que vous ne pourriez pas défendre.
 MARQUES       : le logo SIBELCO et les noms Redwave, Binder+Co, Steinert appartiennent à leurs propriétaires ;
                 ce fichier ne prouve que l'auteur du CODE (animations, interface), pas des marques.
 
 VOCABULAIRE (pour comprendre le code) :
   DOM         = la page web vue comme un arbre d'éléments que le JavaScript peut modifier.
   canvas      = une zone de dessin pixel par pixel ; le logo 3D, les machines 3D et le jeu y sont dessinés.
   localStorage= petit coffre du navigateur (texte uniquement, quelques Mo) : tutos, comptes, scores.
   IndexedDB   = coffre plus gros du navigateur : PDF, PowerPoint, copie de secours.
   fonction    = un bloc de code nommé qu'on appelle (ex. save()). "async/await" = fonction qui attend un résultat.
   requestAnimationFrame = demande au navigateur de rappeler une fonction avant chaque image (~60 fois/s) : base de toute animation.
   dt          = durée écoulée depuis l'image précédente ; multiplier un mouvement par dt le rend identique sur PC lent ou rapide.
   `...${x}...`= texte "modèle" : ${x} est remplacé par la valeur de x. Sert à fabriquer le HTML de chaque page.
   esc()       = protège un texte avant de l'insérer dans le HTML (évite d'injecter du code par erreur).
 LECTURE CONSEILLEE : suivre l'ordre du démarrage -> fin du fichier : safeBoot() -> boot() -> enter() -> renderHome().
-->
<!--
 ============================================================================
 GUIDE SIMPLE : OU MODIFIER QUOI ?   (Ctrl+F puis tapez le mot de la colonne de droite)
 ============================================================================
  Ce que vous voulez changer                          Mot à chercher dans ce fichier
  ---------------------------------------------------  ------------------------------
  Les textes de l'appli (menus, boutons) FR / EN       const I18N
  Les tutoriels d'exemple                              const SEED
  Les questions du quiz / vrai-faux / relier / ordre   const QUIZ  const VF  const LNK  const ORD
  Les pièces du jeu "Trieur"                           const GITEMS
  Les 5 classes d'utilisateurs                         const CLS
  Les textes de la page Machines 3D                    -> DANS L'APPLI : bouton "Modifier leS texteS" (classes 3 et 4)
     (au-dessus, sous la machine, à droite)             textes d'origine : M3_TXT_DEFAULT  et  M3_PARTS
  Marques et modèles de trieurs                        const M3_BRANDS   const M3_MODELS
  Couleurs des technologies VIS / UV / NIR / inductif  const M3_TECH
  Les grains de verre qui circulent                    const M3_GRAINS
  Les couleurs de toute l'appli                        :root (dans le style, en haut)
  Hors connexion (cache)                               sw.js : changer le numéro de version
  Bouton Retour / carte Reprendre / recherche globale   section 6 (fin du script) : histPush  resumeHTML  gSearch

 Repères : chaque réglage modifiable est précédé de la ligne " MODIFIABLE" dans le code.

 REGLES POUR MODIFIER SANS RIEN CASSER :
   1. Faites une COPIE du fichier avant (index-copie.html).
   2. Ne changez que le texte entre guillemets '...' ou les chiffres ; gardez les virgules, les guillemets et les crochets.
   3. Enregistrez, rechargez la page (Ctrl+F5), testez. Si ça ne marche plus, revenez à la copie.
   4. Après toute modification, lancez maj-version.ps1 (ou changez le numéro de version dans sw.js à la main).
 ============================================================================
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutos Maintenance – Tri optique verre</title>
<!--
 PWA : ces lignes relient la page au manifest (nom, couleurs, icônes) pour pouvoir
 "installer" l'appli sur un téléphone / PC. theme-color = couleur de la barre du navigateur.
 apple-touch-icon = icône utilisée sur iPhone/iPad.
-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a2f5a">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Tutoriels de maintenance des trieurs optiques verre – Sibelco Reims">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tutos Maintenance">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script>
/* Capte tout de suite la proposition d'installation du navigateur (elle peut arriver avant la fin du chargement de la page) */
window.__bip=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); window.__bip=e; if(window.instUpdate) try{ instUpdate(); }catch(x){} });
</script>
<!-- 1. APPARENCE : toutes les règles de style sont dans style.css -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<img class="printlogo" src="icon-512.png" alt="Sibelco">

<!--
 ===================== 2. STRUCTURE FIXE DE LA PAGE =====================
 BANDEAU DU HAUT : bouton menu, logo + titre, choix de langue FR/EN et boutons
 (Nouveau / Exporter / Importer) qui ne s'affichent que dans la section "Tutos maintenance",
 puis la barre de recherche et les filtres.
 Les textes "data-i18n" sont remplis par le script selon la langue (voir I18N plus bas).
 "noprint" = élément caché à l'impression.
-->
<header class="noprint">
  <div class="wrap">
    <div class="top">
      <button class="menu-btn" onclick="toggleNav()" aria-label="Menu"><svg viewBox="0 0 24 24" width="1.6em" height="1.6em" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="display:block"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 class="brand">
      <a href="https://www.sibelco.com/en/country/france" target="_blank" rel="noopener" title="Logo 3D · Sibelco France" style="display:inline-flex" onclick="return openLogoViewer(event)"><img src="icon-192.png" alt="Sibelco" class="logo"></a>
      <span><span data-i18n="app_title"></span> <small data-i18n="app_sub"></small></span>
      </h1>
      <div class="row">
        <span id="net" class="netpill hidden" role="status"></span>
        <button id="bInstall" class="primary" type="button"></button>
        <div class="lang" role="group" aria-label="Langue / Language">
          <button id="bFr" onclick="setLang('fr')">FR</button>
          <button id="bEn" onclick="setLang('en')">EN</button>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- BARRE D'OUTILS (sous le bandeau) : Nouveau / Exporter / Importer, recherche et filtres. Affichée uniquement dans "Tutos maintenance" (voir buildNav et renderList). -->
<div id="toolbar" class="noprint">
  <div class="wrap">
    <div class="actions" id="actions">
      <button class="primary tbtn" id="btnNew" onclick="newTuto()" data-i18n="new"></button>
      <button class="tbtn" onclick="exportJSON()" data-i18n="export"></button>
      <button class="tbtn" id="btnImp" onclick="document.getElementById('imp').click()" data-i18n="import"></button>
      <input id="imp" type="file" accept="application/json" class="hidden" onchange="importJSON(event)">
    </div>
    <div class="filters" id="filters">
      <input id="q" type="search" data-i18n-ph="search" oninput="renderList()">
      <select id="fMachine" onchange="renderList()"></select>
      <select id="fStatus" onchange="renderList()"></select>
    </div>
  </div>
</div>

<!--
 MENU LATERAL : vide au départ, rempli par la fonction buildNav() du script.
 #scrim = voile sombre derrière le menu sur téléphone (un clic dessus ferme le menu).
-->
<nav id="side" class="noprint"></nav><div id="scrim" onclick="toggleNav(false)"></div>
<!--
 ZONE PRINCIPALE #app : c'est ici que le script affiche chaque page (accueil, liste de tutos, fiche, jeu...).
 À chaque changement de page, le contenu de #app est entièrement remplacé (innerHTML).
 Le "toast" ci-dessous est la petite bulle de message qui apparaît en bas ("Tutoriel enregistré"...).
-->
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--
 ===================== 3. PROGRAMME (JavaScript) =====================
 Plan du script :
   - Traductions FR/EN (I18N)               - Tutoriels d'exemple (SEED) et leur traduction
   - État et stockage (load/save)           - Liste des tutos, lecture, édition, export/import
   - Icônes et illustrations (ICO)          - Classes d'utilisateur, menu, accueil
   - Comptes / connexion / paramètres       - PDF et PowerPoint (IndexedDB, pdf.js, JSZip)
   - Fiches (constructeur, consommables, présentation)
   - Jeux : Trieur Sibelco (canvas), Quiz, Vrai/Faux, Relier, Dans l'ordre
   - Démarrage : boot()
-->
<script src="app.js"></script>
</body>
</html>
