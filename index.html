/*
 Moteur du quiz : quizStart(kind) prépare la partie, quizShow() affiche la question + lance le chrono,
 quizAnswer(i) corrige (i = -1 si le temps est écoulé), quizNext() passe à la suivante, quizEnd() affiche le résultat.
*/
let Q=null;   // état de la partie de quiz / vrai-faux en cours
/* EXPLICATION SUPPLÉMENTAIRE : MOTEUR COMMUN QUIZ / VRAI-FAUX
 Même code pour les deux jeux : on tire 10 questions au hasard (shuffle) dans la banque QUIZ ou VF. En quiz les 4 réponses sont mélangées ;
 en vrai/faux il y a 2 boutons fixes. Q = état de la partie (score, série, chrono). Les scores sont enregistrés par g2Record().
*/
function quizStart(kind){
  const bank=kind==='vf'?VF:QUIZ;
  const qs=shuffle(bank.slice()).slice(0,10).map(q=>kind==='vf'
    ?{q:q.q,e:q.e,o:[{t:['Vrai','True'],c:q.a},{t:['Faux','False'],c:!q.a}]}              // vrai/faux : 2 boutons fixes
    :{q:q.q,e:q.e,o:shuffle(q.o.map((t,i)=>({t,c:i===q.a})))});                            // quiz : réponses mélangées
  if(Q) clearInterval(Q.timer);
  Q={kind,qs,i:0,score:0,ok:0,streak:0,left:0,total:kind==='vf'?12:20,locked:false,timer:null};
  gFrame(G2NAME[kind][0],G2NAME[kind][1],'<div id="qz"></div>');
  quizShow(); g2Board(kind,'g2lb');
}
function quizShow(){                       // affiche la question courante et lance le chrono
  const me=Q, box=$('qz'); if(!me||!box) return;
  const q=me.qs[me.i]; me.locked=false; me.left=me.total;
  box.innerHTML=`<div class="row" style="justify-content:space-between"><b>${L('Question','Question')} ${me.i+1}/${me.qs.length}</b><span class="meta">Score ${me.score}${me.streak>1?' · 🔥 x'+me.streak:''}</span></div>
   <div class="qbar"><div id="qbar" style="width:100%"></div></div>
   <p style="font-size:1.05rem;font-weight:600;margin:10px 0">${esc(L(q.q[0],q.q[1]))}</p>
   <div id="qopts">${q.o.map((o,i)=>`<button class="qopt" onclick="quizAnswer(${i})">${esc(L(o.t[0],o.t[1]))}</button>`).join('')}</div><div id="qfb"></div>`;
  clearInterval(me.timer);
  const t0=Date.now();
  me.timer=setInterval(()=>{
    if(Q!==me||!box.isConnected){ clearInterval(me.timer); return; }   // on a quitté la page : on arrête le chrono
    me.left=Math.max(0,me.total-(Date.now()-t0)/1000);
    const b=$('qbar'); if(b) b.style.width=(me.left/me.total*100)+'%';
    if(me.left<=0) quizAnswer(-1);                                        // temps écoulé = mauvaise réponse
  },100);
}
function quizAnswer(i){                    // i = bouton choisi (-1 si temps écoulé)
  const me=Q; if(!me||me.locked) return; me.locked=true; clearInterval(me.timer);
  const q=me.qs[me.i], good=i>=0&&q.o[i].c;
  let pts=0;
  if(good){ pts=10+Math.ceil(me.left/me.total*5)+Math.min(me.streak,5)*2; me.score+=pts; me.ok++; me.streak++; }   // 10 pts + bonus rapidité + bonus série
  else me.streak=0;
  document.querySelectorAll('#qopts .qopt').forEach((b,k)=>{ b.disabled=true; if(q.o[k].c) b.classList.add('good'); else if(k===i) b.classList.add('bad'); });
  const last=me.i>=me.qs.length-1;
  $('qfb').innerHTML=`<div class="box ${good?'':'danger'}" style="${good?'border-left-color:var(--ok);background:rgba(26,138,74,.14);color:var(--text)':''}"><b>${good?L('Bonne réponse ! +'+pts,'Correct! +'+pts):(i<0?L('Temps écoulé.','Time is up.'):L('Raté.','Not quite.'))}</b><br>${esc(L(q.e[0],q.e[1]))}</div>
   <div style="margin-top:10px;text-align:right"><button class="primary" onclick="${last?'quizEnd()':'quizNext()'}">${last?L('Voir le résultat','See result'):L('Suivante →','Next →')}</button></div>`;
}
function quizNext(){ if(!Q) return; Q.i++; quizShow(); }
function quizEnd(){                        // écran de résultat + enregistrement du score
  const me=Q; if(!me) return; clearInterval(me.timer);
  const nb=g2Record(me.kind,me.score), n=me.qs.length, r=me.ok/n;
  const msg=r>=.9?L('Excellent, vous maîtrisez !','Excellent, you know your stuff!'):r>=.6?L('Bien joué, continuez à réviser.','Well done, keep revising.'):L('À revoir : relisez les tutos et rejouez !','Needs work: reread the tutorials and play again!');
  $('qz').innerHTML=`<div style="text-align:center;padding:10px 0"><div style="font-size:2.4rem;font-weight:800">${me.score} pts</div>
   <p>${me.ok}/${n} ${L('bonnes réponses','correct answers')}${nb?' · 🏆 '+L('Nouveau record !','New best!'):''}</p><p class="meta">${msg}</p>
   <div class="row" style="justify-content:center"><button class="primary" onclick="quizStart('${me.kind}')">${L('Rejouer','Play again')}</button><button onclick="renderGame()">${L('Autres jeux','Other games')}</button></div></div>`;
  g2Board(me.kind,'g2lb');
}

/* ---------- RELIER : relier chaque objet (composant, équipement) à son expression (rôle) ---------- */
/*
 ===================== RELIER =====================
 LNK = les paires du jeu : [emoji, [objet FR, objet EN], [expression FR, expression EN]].
 À chaque partie, 6 paires sont tirées au hasard parmi celles-ci. Le joueur touche un OBJET puis l'EXPRESSION qui lui correspond
 (ou l'inverse) : un trait de couleur les relie. Toucher un élément déjà relié efface son lien. Quand tout est relié : bouton « Valider ».
 POUR CHANGER / AJOUTER / RETIRER UNE PAIRE : modifier, copier ou supprimer une ligne (gardez l'expression COURTE : environ 50 caractères).
 Pour changer le nombre de paires par partie : modifier LNK_N.
*/
// ✏️ MODIFIABLE : paires à relier (objet <-> rôle)
const LNK=[
 ['📷',['Caméra','Camera'],['Voit la couleur et les défauts du verre','Sees the glass colour and defects']],
 ['💡',['Éclairage','Lighting'],['Éclaire le verre pour une image nette','Lights the glass for a sharp image']],
 ['💨',['Buse d’éjection','Ejection nozzle'],['Souffle l’indésirable hors du flux','Blows the reject out of the stream']],
 ['⚡',['Électrovanne','Solenoid valve'],['Commande l’air envoyé à la buse','Controls the air sent to the nozzle']],
 ['🖥️',['Écran de commande','Control screen'],['Affiche les alarmes et les réglages','Shows alarms and settings']],
 ['🔍',['Vitre optique','Optical window'],['À nettoyer pour éviter les fausses détections','Clean it to avoid false detections']],
 ['🔒',['Cadenas LOTO','LOTO padlock'],['Empêche tout redémarrage pendant l’intervention','Prevents any restart during the job']],
 ['🎚️',['Manomètre','Pressure gauge'],['Air à 0 bar avant tout démontage','Air at 0 bar before any dismantling']],
 ['🧤',['Gants','Gloves'],['À porter pour manipuler le verre coupant','Wear them to handle sharp glass']],
 ['🥽',['Lunettes de protection','Safety glasses'],['Protègent les yeux des éclats de verre','Protect the eyes from glass splinters']]
];
const LNK_N=6;
const LNK_COL=['#2d8fe0','#e8943a','#9a6be0','#2fb59a','#e0638a','#c9a400'];   // couleur du trait de chaque lien
let LK=null;   // état de la partie en cours
function lnkStart(){
  const idx=shuffle(LNK.map((_,i)=>i)).slice(0,LNK_N);
  LK={left:idx.slice(), right:shuffle(idx.slice()), links:{}, sel:null, t0:0, over:false};   // links : {positionGauche : positionDroite}
  gFrame('Relier','Link',`<p class="meta" style="margin:0 0 8px">${L('Touchez un objet puis l’expression qui lui correspond pour les relier. Touchez un élément relié pour effacer son lien. Plus vite = plus de points.','Tap an object, then the expression that matches it, to link them. Tap a linked item to remove its link. Faster = more points.')}</p>
   <div class="row" style="justify-content:space-between;margin-bottom:8px"><span id="lkhud" class="meta"></span><button class="small" onclick="lnkStart()">${L('Recommencer','Restart')}</button></div>
   <div id="lkbox" class="lkbox"></div><div id="lkact" style="margin-top:12px;text-align:center"></div><div id="lkfb"></div>`);
  lnkDraw(); g2Board('link','g2lb');
}
function lnkDraw(){
  const g=LK, box=$('lkbox'); if(!g||!box) return;
  const rOf={}; Object.keys(g.links).forEach(l=>rOf[g.links[l]]=+l);   // position droite -> position gauche
  let h='<svg id="lksvg" class="lksvg" aria-hidden="true"></svg>';
  g.left.forEach((pi,k)=>{
    const a=LNK[pi], b=LNK[g.right[k]];
    const lc=g.links[k]!==undefined, rc=rOf[k]!==undefined;
    const lcol=lc?LNK_COL[k%6]:'', rcol=rc?LNK_COL[rOf[k]%6]:'';
    const res=(i,linked)=>{ if(!g.over||!linked) return ''; return g.ok[i]?' ok':' ko'; };
    h+=`<button class="lkit${g.sel&&g.sel.s==='l'&&g.sel.i===k?' sel':''}${res(k,lc)}" data-s="l" data-i="${k}" ${lc&&!g.over?`style="border-color:${lcol}"`:''} onclick="lnkTap('l',${k})" ${g.over?'disabled':''}><span class="me">${a[0]}</span><span>${esc(L(a[1][0],a[1][1]))}</span></button>`;
    h+=`<button class="lkit${g.sel&&g.sel.s==='r'&&g.sel.i===k?' sel':''}${g.over&&rc?(g.ok[rOf[k]]?' ok':' ko'):''}" data-s="r" data-i="${k}" ${rc&&!g.over?`style="border-color:${rcol}"`:''} onclick="lnkTap('r',${k})" ${g.over?'disabled':''}><span>${esc(L(b[2][0],b[2][1]))}</span></button>`;
  });
  box.innerHTML=h;
  const n=Object.keys(g.links).length;
  const sec=g.t0?Math.round(((g.over?g.tend:Date.now())-g.t0)/1000):0;
  $('lkhud').textContent=L('Liens','Links')+' '+n+'/'+LNK_N+(g.t0?' · '+L('Temps','Time')+' '+sec+' s':'');
  if(!g.over) $('lkact').innerHTML=`<button class="primary" onclick="lnkCheck()" ${n<LNK_N?'disabled':''}>${L('Valider','Check')}</button>`;
  lnkLines();
}
function lnkLines(){                       // trace les traits entre les éléments reliés
  const g=LK, box=$('lkbox'), svg=$('lksvg'); if(!g||!box||!svg) return;
  const bb=box.getBoundingClientRect(); let s='';
  Object.keys(g.links).forEach(l=>{
    const a=box.querySelector(`[data-s="l"][data-i="${l}"]`), b=box.querySelector(`[data-s="r"][data-i="${g.links[l]}"]`); if(!a||!b) return;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const x1=ra.right-bb.left, y1=ra.top+ra.height/2-bb.top, x2=rb.left-bb.left, y2=rb.top+rb.height/2-bb.top;
    const col=g.over?(g.ok[l]?'#1a8a4a':'#c0392b'):LNK_COL[l%6];
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3.5" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="4.5" fill="${col}"/><circle cx="${x2}" cy="${y2}" r="4.5" fill="${col}"/>`;
  });
  svg.innerHTML=s;
}
function lnkTap(side,i){
  const g=LK; if(!g||g.over) return;
  if(!g.t0) g.t0=Date.now();
  const rOf=Object.keys(g.links).find(l=>g.links[l]===i);                        // pour un élément de droite : son partenaire de gauche
  if(side==='l'&&g.links[i]!==undefined){ delete g.links[i]; g.sel=null; return lnkDraw(); }   // lien existant : on l'efface
  if(side==='r'&&rOf!==undefined){ delete g.links[rOf]; g.sel=null; return lnkDraw(); }
  if(!g.sel||g.sel.s===side){ g.sel=(g.sel&&g.sel.s===side&&g.sel.i===i)?null:{s:side,i}; return lnkDraw(); }   // (dé)sélection
  const l=side==='l'?i:g.sel.i, r=side==='r'?i:g.sel.i;                            // un objet + une expression : on crée le lien
  g.links[l]=r; g.sel=null; lnkDraw();
}
function lnkCheck(){
  const g=LK; if(!g||g.over||Object.keys(g.links).length<LNK_N) return;
  g.over=true; g.tend=Date.now(); g.ok={}; let good=0;
  g.left.forEach((pi,k)=>{ const ok=g.right[g.links[k]]===pi; g.ok[k]=ok; if(ok) good++; });
  const sec=Math.round((g.tend-g.t0)/1000), pts=Math.max(0,Math.round(good*70+Math.max(0,80-sec)*(good/LNK_N)));   // 500 pts max : 70 par bonne paire + bonus de vitesse
  const nb=g2Record('link',pts);
  const wrong=g.left.map((pi,k)=>g.ok[k]?'':`<li><b>${LNK[pi][0]} ${esc(L(LNK[pi][1][0],LNK[pi][1][1]))}</b> → ${esc(L(LNK[pi][2][0],LNK[pi][2][1]))}</li>`).join('');
  lnkDraw(); $('lkact').innerHTML='';
  $('lkfb').innerHTML=`<div class="box" style="border-left-color:${good===LNK_N?'var(--ok)':'var(--danger-line)'};background:${good===LNK_N?'rgba(26,138,74,.14)':'rgba(192,57,43,.10)'};color:var(--text);margin-top:12px"><b>${good===LNK_N?L('Bravo !','Well done!'):L('Résultat','Result')} ${pts} pts</b>${nb?' · 🏆 '+L('Nouveau record !','New best!'):''}<br>${good}/${LNK_N} ${L('liens corrects','correct links')} · ${sec} s
   ${wrong?`<div style="margin-top:8px"><b>${L('À retenir :','To remember:')}</b><ul style="margin:4px 0 0;padding-left:20px">${wrong}</ul></div>`:''}
   <div style="margin-top:8px"><button class="primary" onclick="lnkStart()">${L('Rejouer','Play again')}</button> <button onclick="renderGame()">${L('Autres jeux','Other games')}</button></div></div>`;
  g2Board('link','g2lb');
}
window.addEventListener('resize',()=>{ if(LK&&$('lksvg')) lnkLines(); });

/*
 ordStart / ordRound / ordDraw / ordTap / ordNext / ordEnd : démarrer, préparer une procédure, dessiner la liste,
 gérer un clic, passer à la suivante, afficher le score (maximum 300 points).
*/
let O=null;   // état de la partie « Dans l’ordre » en cours
function ordStart(){
  const rounds=shuffle(ORD.slice()).slice(0,3);          // 3 procédures tirées au hasard
  O={rounds,r:0,total:0,cur:null};
  gFrame('Dans l’ordre','Put in order','<div id="ordbox"></div>');
  ordRound(); g2Board('order','g2lb');
}
function ordRound(){                       // prépare la procédure courante (étapes mélangées)
  const p=O.rounds[O.r];
  O.cur={p,order:shuffle(p.s.map((s,i)=>i)),next:0,mist:0,pts:0};
  ordDraw();
}
function ordDraw(){
  const c=O.cur, p=c.p, box=$('ordbox'); if(!box) return;
  const done=c.next>=p.s.length, last=O.r>=O.rounds.length-1;
  box.innerHTML=`<div class="row" style="justify-content:space-between"><b>${L('Procédure','Procedure')} ${O.r+1}/${O.rounds.length} : ${esc(L(p.t[0],p.t[1]))}</b><span class="meta">Score ${O.total}</span></div>
   <p class="meta" style="margin:6px 0">${L('Touchez les étapes dans le bon ordre, de la première à la dernière.','Tap the steps in the right order, from first to last.')}</p>
   <ol class="ordlist">${p.s.slice(0,c.next).map(s=>`<li>${esc(L(s[0],s[1]))}</li>`).join('')}</ol>
   ${done?'':`<div>${c.order.filter(ix=>ix>=c.next).map(ix=>`<button class="qopt" onclick="ordTap(${ix})">${esc(L(p.s[ix][0],p.s[ix][1]))}</button>`).join('')}</div>`}
   <div id="ordfb" style="min-height:1.4em;color:var(--danger-line);font-size:.9rem"></div>
   ${done?`<div class="box" style="border-left-color:var(--ok);background:rgba(26,138,74,.14);color:var(--text)"><b>${L('Procédure réussie !','Procedure complete!')} +${c.pts} pts</b> (${c.mist} ${L('erreur(s)','mistake(s)')})
     <div style="margin-top:8px"><button class="primary" onclick="${last?'ordEnd()':'ordNext()'}">${last?L('Voir le résultat','See result'):L('Procédure suivante →','Next procedure →')}</button></div></div>`:''}`;
}
function ordTap(ix){                       // ix = index de l’étape touchée (dans l’ordre correct d’origine)
  const c=O&&O.cur; if(!c||c.next>=c.p.s.length) return;
  if(ix===c.next){                         // bonne étape
    c.next++;
    if(c.next>=c.p.s.length){ c.pts=Math.max(10,100-15*c.mist); O.total+=c.pts; }   // 100 pts par procédure, -15 par erreur (min. 10)
    ordDraw();
  } else {                                 // mauvaise étape
    c.mist++; const f=$('ordfb'); if(f) f.textContent=L('Pas encore : ce n’est pas l’étape suivante.','Not yet: that is not the next step.');
  }
}
function ordNext(){ O.r++; ordRound(); }
function ordEnd(){
  const nb=g2Record('order',O.total);
  $('ordbox').innerHTML=`<div style="text-align:center;padding:10px 0"><div style="font-size:2.4rem;font-weight:800">${O.total} pts</div>
   <p class="meta">${nb?'🏆 '+L('Nouveau record !','New best!')+' · ':''}${L('Maximum possible : 300 pts','Maximum possible: 300 pts')}</p>
   <div class="row" style="justify-content:center"><button class="primary" onclick="ordStart()">${L('Rejouer','Play again')}</button><button onclick="renderGame()">${L('Autres jeux','Other games')}</button></div></div>`;
  g2Board('order','g2lb');
}

 1) Test de la photo de fond : si fond-verre.jpg se charge, on active la classe "photo" sur <html>.
 2) boot() lance l'appli (connexion ou accueil).
 3) Enregistrement du service worker sw.js : c'est lui qui permet d'ouvrir l'appli hors connexion
    et de l'installer comme une application.
*/
/*
 ============================================================================
 ===================== 4. SIBELCO 2.0 : LOGO 3D ET CONFORT =====================
 Tout ce bloc est NOUVEAU. Il ne modifie pas la logique existante (tutos, fiches, jeux, comptes) :
   - Logo3D()          : globe Sibelco en 3D (dessiné au canvas, SANS bibliothèque -> marche hors connexion)
   - openLogoViewer()  : agrandit le logo 3D quand on clique sur le logo du bandeau
   - confetti()        : pluie de confettis (record battu dans un jeu, formation validée)
   - pastille Hors ligne, bouton Installer, bandeau "nouvelle version disponible"
   - petits confort : afficher/masquer le mot de passe, alerte Verr. Maj, raccourci "/" pour chercher,
     effet d'onde sur les boutons, compteurs animés sur l'accueil.
 ============================================================================
*/

/* ============================ COMMENT EST FAIT LE LOGO 3D ============================
 Il n'y a AUCUNE image ni bibliothèque 3D (pas de Three.js) : tout est calculé et dessiné par le code, 60 fois par seconde,
 dans un <canvas> (une zone de dessin). Les étapes, dans l'ordre :
   1) LA FORME   : on part d'un "icosaèdre" (une boule à 20 faces triangulaires) qu'on découpe 3 fois en petits triangles
                   -> environ 1300 triangles qui forment une sphère. Chaque sommet a 3 coordonnées (x, y, z).
                   (voir LOGO_GEO ci-dessous ; calculé UNE seule fois au démarrage)
   2) LA ROTATION: à chaque image, on fait tourner tous les points avec 2 angles : "yaw" (gauche-droite) et "pitch"
                   (haut-bas). Quand vous glissez la souris, on ajoute à ces angles le déplacement de la souris.
                   Quand vous lâchez, la vitesse de rotation (vy) diminue doucement = l'inertie.
   3) LA PERSPECTIVE : les points proches de nous sont dessinés plus grands que ceux du fond (fonction prj).
   4) LA LUMIERE : chaque triangle est plus ou moins clair selon qu'il est tourné vers la lumière (en haut à gauche).
                   Couleur = mélange entre LOGO_COL.dark (bleu foncé) et LOGO_COL.light (bleu clair), + un reflet blanc.
   5) L'EFFET "LOGO SIBELCO" : chaque triangle est dessiné RETRECI vers son centre (variable s) : on voit du blanc entre
                   les triangles, comme sur votre logo. Ceux tournés vers le bord de la boule sont plus petits.
   6) L'ANNEAU   : un ruban en croissant (fin aux 2 bouts, large au milieu) tourne autour. La moitié derrière la boule est
                   dessinée AVANT elle, la moitié devant APRES -> l'anneau passe bien devant/derrière.
   7) LE CLIC    : un "ressort" (spring) pousse les triangles vers l'extérieur puis les ramène (= l'éclatement), la vitesse
                   de rotation est boostée (spin), un halo (glow) et des ondes (ripples) sont dessinés.
 Si le dessin échoue (navigateur très ancien), le code affiche simplement l'image icon-512.png à la place.

 >>> POUR MODIFIER : changez uniquement les chiffres de LOGO_CFG ci-dessous (le reste n'a pas besoin d'être touché). <<<
===================================================================================== */
// ✏️ MODIFIABLE : réglages du globe 3D : changez seulement les chiffres (le commentaire à droite dit quoi mettre)
const LOGO_CFG = {
  size    : 0.25,   // taille du globe dans son cadre (0.20 = petit, 0.35 = très grand ; au-delà l'anneau est coupé)
  idle    : 0.007,  // vitesse de rotation quand on ne touche pas (0 = immobile, 0.02 = rapide)
  spin    : 0.38,   // force du tour sur lui-même au clic (0.2 = doux, 0.6 = toupie)
  explode : 0.30,   // force de l'éclatement au clic (0 = aucun, 0.5 = gros éclatement)
  detail  : 2,      // nombre de triangles : 2 = 320 (facetté, rapide), 3 = 1280 (joli), 4 = 5120 (lent sur vieux téléphone)
  tri     : 0.54,   // taille des triangles : 0.3 = beaucoup de blanc entre eux, 0.95 = globe presque plein
  ringR   : 1.25,   // rayon de l'anneau (1 = colle au globe, 1.8 = très large)
  ringW   : 0.30,   // épaisseur du croissant (0.15 = fin, 0.5 = épais)
  ringArc : 4.9,    // longueur du croissant en radians (3.1 = demi-tour, 6.28 = anneau complet)
  ringTilt: -0.5    // inclinaison de l'anneau sur le côté (0 = horizontal)
};

/* ---------- LOGO 3D ----------
 Principe : une sphère faite de ~1300 petits triangles (icosphère), un anneau en croissant autour,
 le tout éclairé et dessiné face par face. Interactions :
   - GLISSER (souris ou doigt) : fait tourner le globe, avec de l'inertie
   - CLIQUER / TAPOTER        : le globe "explose" en éclats qui reviennent, tourne vite, onde lumineuse
   - SURVOL                   : le globe s'incline légèrement vers le pointeur
   - CLAVIER                  : flèches = tourner, Entrée/Espace = éclat
 Pour changer les couleurs : voir LOGO_COL (bleu foncé -> bleu clair) et RING_COL.            */
/* Couleurs du globe (rouge,vert,bleu de 0 à 255). Pour un autre bleu, changez ces 6 chiffres. */
// ✏️ MODIFIABLE : couleurs du globe [rouge, vert, bleu] de 0 à 255
const LOGO_COL = { dark:[5,48,126], light:[118,204,250] };
/* Couleurs de l'anneau (même principe) */
// ✏️ MODIFIABLE : couleurs de l'anneau [rouge, vert, bleu] de 0 à 255
const RING_COL = { dark:[8,42,104], light:[38,122,212] };
const LOGO_GEO = (()=>{
  const nrm = v => { const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; };
  const t=(1+Math.sqrt(5))/2;
  const V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(nrm);
  let F=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const cache={};
  const mid=(a,b)=>{ const k=a<b?a+'_'+b:b+'_'+a; if(cache[k]!==undefined) return cache[k];
    V.push(nrm([(V[a][0]+V[b][0])/2,(V[a][1]+V[b][1])/2,(V[a][2]+V[b][2])/2])); return cache[k]=V.length-1; };
  for(let s=0;s<LOGO_CFG.detail;s++){ const N=[]; for(const [a,b,c] of F){ const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a); N.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]); } F=N; }
  const faces=F.map((f,i)=>({ i:f, n:nrm([V[f[0]][0]+V[f[1]][0]+V[f[2]][0],V[f[0]][1]+V[f[1]][1]+V[f[2]][1],V[f[0]][2]+V[f[1]][2]+V[f[2]][2]]),
                              r:((Math.imul(i+1,2654435761)>>>0)%10007)/10007 }));
  return { V, faces };
})();

function Logo3D(host,opt){
  opt=opt||{};
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.createElement('canvas'), ctx=cv.getContext('2d');
  host.appendChild(cv);
  const sh=document.createElement('div'); sh.className='shadow'; host.appendChild(sh);
  if(opt.hint){ const h=document.createElement('div'); h.className='hint'; h.textContent=opt.hint; host.appendChild(h); host._hint=h; }
  host.setAttribute('role','img'); host.setAttribute('aria-label','Logo Sibelco 3D'); host.tabIndex=0;

  const { V, faces } = LOGO_GEO, nV=V.length;
  const PX=new Float32Array(nV), PY=new Float32Array(nV), PZ=new Float32Array(nV);
  let W=0, DPR=Math.min(2,window.devicePixelRatio||1);
  // ETAT : yaw/pitch = angles actuels ; vy/vp = vitesses (l'inertie) ; spring = éclatement ; glow/pulse = lueur du clic
  let yaw=-0.5, pitch=0.32, vy=reduce?0:LOGO_CFG.idle, vp=0, hx=0, hy=0, hxT=0, hyT=0;
  let spring=0, springV=0, glow=0, pulse=0, ringSpin=0; const ripples=[];
  let drag=false, lx=0, ly=0, moved=0, t0=0, lastT=performance.now(), running=true, ptrId=null;
  const IDLE = reduce?0:LOGO_CFG.idle;

  // fit() : adapte la résolution du canvas à la taille réelle (et aux écrans Retina) -> le dessin reste net
  function fit(){ const w=Math.max(90,Math.round(host.clientWidth)); if(w!==W){ W=w; cv.width=cv.height=Math.round(W*DPR); cv.style.width=cv.style.height=W+'px'; } }
  // burst() = ce qui se passe au CLIC : éclatement + rotation rapide + lueur + onde. Appelé aussi par Entrée/Espace.
  function burst(dir){
    if(host._hint){ host._hint.classList.add('gone'); }
    springV=reduce?0:LOGO_CFG.explode; glow=1; pulse=1; ripples.push({t:0});
    if(!reduce) vy=(dir||1)*(LOGO_CFG.spin+Math.random()*0.12);
  }
  // SOURIS / DOIGT : pointerdown = on attrape, pointermove = on tourne, pointerup = on lâche.
  // Bougé de moins de 6 px en moins de 0,45 s = c'est un CLIC (burst) et non un glissement.
  host.addEventListener('pointerdown',e=>{
    drag=true; ptrId=e.pointerId; lx=e.clientX; ly=e.clientY; moved=0; t0=performance.now();
    try{ host.setPointerCapture(e.pointerId); }catch(x){}
    vp=0; if(host._hint) host._hint.classList.add('gone');
  });
  host.addEventListener('pointermove',e=>{
    const r=host.getBoundingClientRect();
    if(drag&&e.pointerId===ptrId){
      const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
      yaw+=dx*0.011; pitch=Math.max(-1.25,Math.min(1.25,pitch+dy*0.009));
      vy=dx*0.011*0.9+vy*0.1; vp=dy*0.009*0.5;
    }else if(e.pointerType==='mouse'){
      hxT=((e.clientX-r.left)/r.width-0.5)*2; hyT=((e.clientY-r.top)/r.height-0.5)*2;
    }
  });
  const up=e=>{
    if(!drag||(e.pointerId!==undefined&&e.pointerId!==ptrId)) return; drag=false;
    if(moved<6 && performance.now()-t0<450) burst(1);
  };
  host.addEventListener('pointerup',up); host.addEventListener('pointercancel',()=>{drag=false;});
  host.addEventListener('pointerleave',()=>{ hxT=0; hyT=0; });
  host.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){ vy-=0.05; e.preventDefault(); } else if(e.key==='ArrowRight'){ vy+=0.05; e.preventDefault(); }
    else if(e.key==='ArrowUp'){ pitch=Math.max(-1.25,pitch-0.15); e.preventDefault(); } else if(e.key==='ArrowDown'){ pitch=Math.min(1.25,pitch+0.15); e.preventDefault(); }
    else if(e.key==='Enter'||e.key===' '){ burst(1); e.preventDefault(); }
  });

  const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
  const rgb=(c,k)=>`rgb(${Math.max(0,Math.min(255,c[0]*k|0))},${Math.max(0,Math.min(255,c[1]*k|0))},${Math.max(0,Math.min(255,c[2]*k|0))})`;
  const LX=-0.45, LY=0.62, LZ=0.64, HL=Math.hypot(LX,LY,LZ+1);           // lumière + demi-vecteur (reflet)
  const lx0=LX/Math.hypot(LX,LY,LZ), ly0=LY/Math.hypot(LX,LY,LZ), lz0=LZ/Math.hypot(LX,LY,LZ);
  const hx0=LX/HL, hy0=LY/HL, hz0=(LZ+1)/HL;
  const DCAM=3.6;

  // frame() = UNE IMAGE d'animation, appelée ~60 fois/s par le navigateur (requestAnimationFrame).
  // Elle s'arrête toute seule quand le logo disparaît de la page (host.isConnected).
  /* EXPLICATION SUPPLÉMENTAIRE : LE GLOBE : CE QUI SE PASSE A CHAQUE IMAGE
   Ordre exact dans frame() : (1) mise à jour du mouvement (inertie, ressort, lueur) -> (2) halo -> (3) moitié ARRIERE de l'anneau ->
   (4) rotation de tous les sommets -> (5) dessin des triangles du globe -> (6) moitié AVANT de l'anneau -> (7) ondes du clic.
   Dessiner dans cet ordre (peintre) donne la bonne profondeur sans moteur 3D : ce qui est derrière est peint d'abord.
  */
  function frame(now){
    if(!host.isConnected){ running=false; return; }
    requestAnimationFrame(frame);
    if(document.hidden) { lastT=now; return; }
    const dt=Math.min(3,(now-lastT)/16.667); lastT=now;
    fit(); const S=W*DPR, cx=S/2, cy=S/2, R0=S*LOGO_CFG.size*(1+pulse*0.05);

    // --- 1. MOUVEMENT : inertie (la vitesse revient doucement vers la vitesse de repos IDLE), ressort, lueur ---
    if(!drag){
      yaw+=vy*dt; pitch+=vp*dt;
      vy+=(IDLE-vy)*0.022*dt; vp*=Math.pow(0.92,dt);
      const rest=0.32+hy*0.28; pitch+=(rest-pitch)*0.03*dt;
    }
    hx+=(hxT-hx)*0.08*dt; hy+=(hyT-hy)*0.08*dt;
    springV+=(-0.05*spring-0.22*springV)*dt; spring+=springV*dt;
    glow*=Math.pow(0.95,dt); pulse*=Math.pow(0.92,dt); ringSpin+=(reduce?0:0.004)*dt;
    const Y=yaw+hx*0.4, P=pitch;
    const cY=Math.cos(Y), sY=Math.sin(Y), cP=Math.cos(P), sP=Math.sin(P);
    /* EXPLICATION SUPPLÉMENTAIRE : ROTATION D'UN POINT
     Deux rotations classiques enchaînées : autour de l'axe vertical (angle Y = yaw) puis autour de l'axe horizontal (angle P = pitch),
     avec cos/sin. Entrée : un point (x,y,z) ; sortie : le même point tourné. Appliquée à tous les sommets à chaque image.
    */
    const rot=(x,y,z)=>{ const x1=x*cY+z*sY, z1=-x*sY+z*cY; return [x1, y*cP-z1*sP, y*sP+z1*cP]; };
    /* EXPLICATION SUPPLÉMENTAIRE : PERSPECTIVE
     q = DCAM/(DCAM - z) : plus un point est proche de la caméra (z grand), plus q est grand, donc plus il s'éloigne du centre et paraît gros.
     On obtient les coordonnées 2D (écran) : x*q*R0 et y*q*R0 autour du centre du canvas (cx,cy). C'est la "vraie" 3D de ce logo.
    */
    const prj=(x,y,z)=>{ const q=DCAM/(DCAM-z); return [cx+x*q*R0, cy-y*q*R0]; };

    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,S,S);

    // halo lumineux sous le globe (s'intensifie au clic)
    const g=ctx.createRadialGradient(cx,cy,R0*0.4,cx,cy,Math.min(S*0.5,R0*(1.9+glow*0.5)));
    g.addColorStop(0,`rgba(70,170,255,${0.18+glow*0.35})`); g.addColorStop(1,'rgba(70,170,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,S,S);

    // --- anneau en croissant : partie ARRIERE (z<0) dessinée avant le globe ---
    const ringQuads=[];
    { const N=56, arc=LOGO_CFG.ringArc, Rr=LOGO_CFG.ringR, Wm=LOGO_CFG.ringW, tz=LOGO_CFG.ringTilt;
      const cz=Math.cos(tz), sz=Math.sin(tz);
      const pt=(a,r)=>{ const x=Math.cos(a)*r, y=0, z=Math.sin(a)*r;     // anneau à plat, puis incliné sur le côté
        return rot(x*cz-y*sz, x*sz+y*cz, z); };
      let prevO=null, prevI=null, prevU=0;
      for(let k=0;k<=N;k++){
        const u=k/N, a=ringSpin+u*arc+0.2, w=Wm*Math.pow(Math.sin(Math.PI*u),0.75);
        const o=pt(a,Rr+w*0.5), i=pt(a,Rr-w*0.5);
        if(prevO){ const z=(prevO[2]+prevI[2]+o[2]+i[2])/4; ringQuads.push({z,u:(u+prevU)/2,q:[prevO,o,i,prevI]}); }
        prevO=o; prevI=i; prevU=u;
      }
    }
    const drawRing=front=>{
      for(const r of ringQuads){ if((r.z>=0)!==front) continue;
        const k=0.55+0.55*Math.max(0,Math.min(1,(r.z+1.2)/2.4)), c=mix(RING_COL.dark,RING_COL.light,Math.pow(Math.sin(Math.PI*r.u),0.8)*0.75*k);
        ctx.fillStyle=rgb(c,0.9+0.25*k); ctx.beginPath();
        r.q.forEach((p,j)=>{ const s=prj(p[0],p[1],p[2]); j?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1]); }); ctx.closePath(); ctx.fill();
      }
    };
    drawRing(false);

    // --- 3. GLOBE : rotation de tous les sommets puis dessin des faces tournées vers nous ---
    for(let i=0;i<nV;i++){ const v=V[i], r=rot(v[0],v[1],v[2]); PX[i]=r[0]; PY[i]=r[1]; PZ[i]=r[2]; }
    const exp=Math.max(-0.04,spring);
    // pour chaque petit triangle : tourné vers nous ? quelle lumière ? quelle taille ? -> puis on le dessine
    for(const f of faces){
      const n=rot(f.n[0],f.n[1],f.n[2]);
      if(n[2]<=-0.02 && exp<0.05) continue;
      const a=f.i[0], b=f.i[1], c=f.i[2];
      const mx=(PX[a]+PX[b]+PX[c])/3, my=(PY[a]+PY[b]+PY[c])/3, mz=(PZ[a]+PZ[b]+PZ[c])/3;
      const lam=Math.max(0,n[0]*lx0+n[1]*ly0+n[2]*lz0);
      const face=Math.max(0,Math.min(1,n[2]*1.5+0.1));
      const s=(LOGO_CFG.tri+(0.98-LOGO_CFG.tri)*Math.min(1,0.4*face+0.6*lam+0.1))*(0.86+0.14*f.r);           // taille du triangle (effet "pixels")
      const off=exp*(0.5+f.r*1.1);                                                         // éclatement au clic
      const spec=Math.pow(Math.max(0,n[0]*hx0+n[1]*hy0+n[2]*hz0),28);
      let col=mix(LOGO_COL.dark,LOGO_COL.light,Math.max(0,Math.min(1,0.06+lam*0.9+(f.r-0.5)*0.26)));
      col=[col[0]+spec*140,col[1]+spec*110,col[2]+spec*70];
      ctx.fillStyle=rgb(col,0.72+0.4*face);
      ctx.beginPath();
      const ids=[a,b,c];
      for(let j=0;j<3;j++){ const id=ids[j];
        const x=mx+(PX[id]-mx)*s+n[0]*off, y=my+(PY[id]-my)*s+n[1]*off, z=mz+(PZ[id]-mz)*s+n[2]*off;
        const p=prj(x,y,z); j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }
      ctx.closePath(); ctx.fill();
    }
    drawRing(true);

    // --- 5. ONDES lumineuses du clic (cercles qui s'agrandissent en s'effaçant) ---
    for(let i=ripples.length-1;i>=0;i--){ const r=ripples[i]; r.t+=dt;
      if(r.t>40){ ripples.splice(i,1); continue; }
      ctx.strokeStyle=`rgba(60,160,240,${Math.pow(1-r.t/40,1.5)*0.7})`; ctx.lineWidth=Math.max(1,2.2*DPR*(1-r.t/60));
      ctx.beginPath(); ctx.arc(cx,cy,R0*(1.05+r.t*0.02),0,Math.PI*2); ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
  return { burst, stop(){ running=false; } };
}

/* ---------- CONFETTIS ---------- */
/* EXPLICATION SUPPLÉMENTAIRE : CONFETTIS
 Crée un canvas plein écran, y dessine 110 petits rectangles colorés (couleurs bleues Sibelco + blanc + orange) qui partent vers le haut
 puis retombent (gravité vy += 0.38), et le supprime après 2,4 s. Rien n'est dessiné si l'appareil demande de réduire les animations.
 Appelé quand un record est battu dans un jeu ou quand une formation obligatoire est validée. */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confetti noprint'; document.body.appendChild(cv);
  const D=Math.min(2,window.devicePixelRatio||1), w=cv.width=innerWidth*D, h=cv.height=innerHeight*D, x=cv.getContext('2d');
  const cols=['#0a5aa8','#2d8fe0','#5aaeea','#9fd8fb','#ffffff','#e8943a'];
  const P=Array.from({length:110},()=>({x:w/2+(Math.random()-.5)*w*.25,y:h*0.35,vx:(Math.random()-.5)*14*D,vy:(-Math.random()*13-4)*D,s:(4+Math.random()*6)*D,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(n){ const k=(n-t0)/2400; x.clearRect(0,0,w,h);
    P.forEach(p=>{ p.vy+=0.38*D; p.x+=p.vx; p.y+=p.vy; p.vx*=.992; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-k*k); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); x.restore(); });
    if(k<1) requestAnimationFrame(f); else cv.remove(); })(t0);
}

  try{
    if('serviceWorker' in navigator){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }

/* ---------- petits outils de géométrie ---------- */
const m3={
 hx(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; },
 dist(a,b){ return Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]); },
 lerp(a,b,t){ return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]; },
 mean(ps){ const c=[0,0,0]; ps.forEach(p=>{c[0]+=p[0];c[1]+=p[1];c[2]+=p[2];}); return [c[0]/ps.length,c[1]/ps.length,c[2]/ps.length]; },
 normal(p){ let x=0,y=0,z=0; for(let i=0;i<p.length;i++){ const a=p[i],b=p[(i+1)%p.length]; x+=(a[1]-b[1])*(a[2]+b[2]); y+=(a[2]-b[2])*(a[0]+b[0]); z+=(a[0]-b[0])*(a[1]+b[1]); } const l=Math.hypot(x,y,z)||1; return [x/l,y/l,z/l]; },
 /* un quadrilatère trop grand est découpé en petites cases (sinon le tri « du fond vers l'avant » se trompe) */
 splitQuad(q,max){
   const nu=Math.max(1,Math.ceil(m3.dist(q[0],q[1])/max)), nv=Math.max(1,Math.ceil(m3.dist(q[0],q[3])/max)), out=[];
   const P=(u,v)=>m3.lerp(m3.lerp(q[0],q[1],u),m3.lerp(q[3],q[2],u),v);
   for(let i=0;i<nu;i++) for(let j=0;j<nv;j++) out.push([P(i/nu,j/nv),P((i+1)/nu,j/nv),P((i+1)/nu,(j+1)/nv),P(i/nu,(j+1)/nv)]);
   return out;
 },
 splitTri(t,max,out,depth){
   const e=[m3.dist(t[0],t[1]),m3.dist(t[1],t[2]),m3.dist(t[2],t[0])], k=e.indexOf(Math.max(...e));
   if(e[k]<=max||(depth||0)>6){ out.push(t); return; }
   const a=t[k], b=t[(k+1)%3], c=t[(k+2)%3], mid=m3.lerp(a,b,.5);
   m3.splitTri([a,mid,c],max,out,(depth||0)+1); m3.splitTri([mid,b,c],max,out,(depth||0)+1);
 },
 /* transforme un ensemble de polygones en « solide » : normales tournées vers l'extérieur (pour cacher les faces de dos) */
 solid(polys,col,tag,g,T,o){
   o=o||{}; const C=m3.hx(col);
   polys=polys.map(p=>p.map(q=>T?T(q):q));
   const all=[]; polys.forEach(p=>p.forEach(q=>all.push(q))); const cen=m3.mean(all);
   return polys.map(p=>{
     const ctr=m3.mean(p); let n=m3.normal(p);
     if(n[0]*(ctr[0]-cen[0])+n[1]*(ctr[1]-cen[1])+n[2]*(ctr[2]-cen[2])<0){ p=p.slice().reverse(); n=[-n[0],-n[1],-n[2]]; }
     let c=C; if(o.top&&n[1]>.9) c=m3.hx(o.top);
     return {p,n,ctr,c,tag:tag||'',g:g||'ext',a:o.a||1,dec:!!o.dec};
   });
 },
 box(x0,x1,y0,y1,z0,z1,col,tag,g,T,o){
   const P=(x,y,z)=>[x,y,z];
   const q=[ [P(x0,y0,z0),P(x1,y0,z0),P(x1,y1,z0),P(x0,y1,z0)], [P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],
             [P(x0,y0,z0),P(x0,y0,z1),P(x0,y1,z1),P(x0,y1,z0)], [P(x1,y0,z0),P(x1,y0,z1),P(x1,y1,z1),P(x1,y1,z0)],
             [P(x0,y0,z0),P(x1,y0,z0),P(x1,y0,z1),P(x0,y0,z1)], [P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)] ];
   let polys=[]; q.forEach(f=>{ m3.splitQuad(f,(o&&o.cell)||.7).forEach(c=>polys.push(c)); });
   return m3.solid(polys,col,tag,g,T,o);
 },
 /* prisme : un contour 2D CONVEXE (prof) extrudé le long d'un axe ('z' : contour en x,y ; 'x' : contour en z,y ; 'y' : contour en x,z) */
 extrude(prof,ax,a0,a1,col,tag,g,T,o){
   const M=(u,v,a)=>ax==='z'?[u,v,a]:ax==='x'?[a,v,u]:[u,a,v], polys=[], n=prof.length, cell=(o&&o.cell)||.7;
   for(let i=0;i<n;i++){ const j=(i+1)%n; m3.splitQuad([M(prof[i][0],prof[i][1],a0),M(prof[j][0],prof[j][1],a0),M(prof[j][0],prof[j][1],a1),M(prof[i][0],prof[i][1],a1)],cell).forEach(c=>polys.push(c)); }
   [a0,a1].forEach(a=>{
     const ring=prof.map(p=>M(p[0],p[1],a)), c=m3.mean(ring);
     for(let i=0;i<n;i++) m3.splitTri([c,ring[i],ring[(i+1)%n]],cell*1.3,polys);
   });
   return m3.solid(polys,col,tag,g,T,o);
 },
 circle(cx,cy,r,n){ const o=[]; for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; o.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]); } return o; }
};

/* ---------- construction d'une machine (liste de faces + points utiles) ---------- */
const M3_SCENES={};
/* EXPLICATION SUPPLÉMENTAIRE : CONSTRUIRE UNE MACHINE 3D
 Une machine = une liste de FACES (polygones) étiquetées : tag = repère auquel elles appartiennent (feed, chute, vis...),
 g = "ext" (carter visible) ou "int" (intérieur, visible seulement en Vue interne). Les formes viennent des outils m3.box / m3.extrude,
 puis T() déplace/met à l'échelle l'intérieur pour chaque marque (tableau tf). Le résultat est mis en cache (M3_SCENES) :
 la machine n'est calculée qu'une fois par marque. S.pins = position 3D des 8 repères ; S.path = trajets du verre.
*/
function m3Build(brand){
  if(M3_SCENES[brand]) return M3_SCENES[brand];
  const F=[], add=a=>{ a.forEach(f=>F.push(f)); };
  /* réglage de l'intérieur (même principe sur les 3 marques) à l'échelle de chaque carter : s = échelle, zs = largeur, ox/oy = position */
  const tf={redwave:{s:.88,zs:1,ox:0,oy:.35}, binder:{s:.85,zs:1.15,ox:0,oy:.25,rot:true}, steinert:{s:.92,zs:1,ox:-.35,oy:.3}}[brand];
  const T=tf.rot?(p=>[tf.ox+tf.zs*p[2], tf.oy+tf.s*p[1], -tf.s*p[0]]):(p=>[tf.ox+tf.s*p[0], tf.oy+tf.s*p[1], tf.zs*p[2]]);
  const W=.8, DK='#2c323a';
  const chuteY=x=>1.62-.827*(x+.75);                      // hauteur de la goulotte (pente)

  /* ===== INTERIEUR (identique en principe sur les 3 marques) ===== */
  add(m3.box(-1.35,-.75,1.6,1.74,-W,W,'#9aa5b0','feed','int',T));                         // plateau vibrant
  add(m3.box(-1.15,-.85,1.74,1.9,-.3,.3,'#5b6670','feed','int',T));                        // moteur vibrant
  add(m3.box(-1.35,-.75,1.74,1.8,-W,-W+.05,'#7d8792','feed','int',T)); add(m3.box(-1.35,-.75,1.74,1.8,W-.05,W,'#7d8792','feed','int',T));
  add(m3.extrude([[-.75,1.62],[0,1],[0,.94],[-.75,1.56]],'z',-W,W,'#b4bec8','chute','int',T));    // goulotte
  /* capteurs inductifs : barre sous la goulotte */
  const ci=[[-.5,chuteY(-.5)-.07],[-.1,chuteY(-.1)-.07],[-.1,chuteY(-.1)-.17],[-.5,chuteY(-.5)-.17]];
  add(m3.extrude(ci,'z',-W+.04,W-.04,'#0b8f7e','ind','int',T));
  for(let i=0;i<6;i++){ const z=-W+.2+i*(2*W-.4)/5; add(m3.extrude([[-.46,chuteY(-.46)-.175],[-.14,chuteY(-.14)-.175],[-.14,chuteY(-.14)-.2],[-.46,chuteY(-.46)-.2]],'z',z-.07,z+.07,'#5fe3cf','ind','int',T)); }
  /* modules de détection côté +x : VIS (haut), UV (milieu), NIR (bas) */
  [['vis',1.36,'#f2b705','#394a5d'],['uv',.96,'#9b5cff','#39325a'],['nir',.56,'#ff6a3d','#54403a']].forEach(([id,y0,hi,body])=>{
    add(m3.box(.78,1.02,y0,y0+.14,-W,W,body,id,'int',T));
    add(m3.box(.74,.78,y0+.02,y0+.12,-W+.03,W-.03,hi,id,'int',T));
  });
  add(m3.box(-.3,-.17,.55,.85,-W,W,'#e6ecf2','vis','int',T)); add(m3.box(-.17,-.14,.58,.82,-W+.04,W-.04,'#f2b705','vis','int',T));   // panneau lumineux de fond
  /* buses : barre + 16 petits becs */
  add(m3.box(.3,.42,.44,.6,-W,W,'#505a64','nozzle','int',T));
  for(let i=0;i<16;i++){ const z=-W+.05+i*(2*W-.1)/15; add(m3.extrude(m3.circle(z,.52,.02,6),'x',.42,.49,'#d9dee3','nozzle','int',T,{cell:2})); }
  /* trémies : bon verre (bleu) / refus (rouge) + séparateur */
  add(m3.extrude([[.08,.3],[.74,.3],[.58,0],[.24,0]],'z',-W,W,'#7fb4e2','out','int',T,{top:'#274a68'}));
  add(m3.extrude([[.84,.3],[1.46,.3],[1.32,0],[.96,0]],'z',-W,W,'#d9463d','out','int',T,{top:'#6b1f1b'}));
  add(m3.extrude([[.72,.1],[.84,.1],[.78,.44]],'z',-W,W,'#9aa5b0','out','int',T));

  /* ===== EXTERIEUR : une branche par marque ===== */
  if(brand==='redwave'){
    const R='#d7261e', R2='#ee4a3f';
    add(m3.box(-1.8,1.7,0,.3,-1.05,1.05,'#6d7782','base','ext'));                                  // châssis
    [[-1.6,-.95],[1.5,-.95],[-1.6,.95],[1.5,.95]].forEach(([x,z])=>add(m3.box(x-.1,x+.1,.3,.34,z-.1,z+.1,'#444c55','base','ext')));
    add(m3.extrude([[-1.55,.3],[1.45,.3],[1.6,.55],[1.6,1.55],[1.0,2.15],[-1.0,2.2],[-1.55,1.7]],'z',-1,1,R,'hood','hood'));        // grand carter rouge
    for(const sg of [1,-1]){                                                                                                  // portes d'accès (les 2 côtés)
      for(let i=0;i<5;i++) add(m3.box(-1.25+i*.62,-1.21+i*.62,.5,1.75,sg>0?1:-1.03,sg>0?1.03:-1,'#9a1913','door','hood',null,{dec:true,cell:3}));
      for(let i=0;i<4;i++) add(m3.box(-1.0+i*.62,-.82+i*.62,1.05,1.12,sg>0?1:-1.045,sg>0?1.045:-1,'#f3f4f6','door','hood',null,{dec:true,cell:3}));
    }
    add(m3.box(1.6,1.64,.6,1.5,-.9,.9,'#f0f2f4','door','hood',null,{dec:true,cell:3}));                                          // plaque
    /* cadre gris + convoyeur d'alimentation côté entrée (x<0) */
    [[-2.2,-.9],[-1.7,-.9],[-2.2,.9],[-1.7,.9]].forEach(([x,z])=>add(m3.box(x-.04,x+.04,0,1.85,z-.04,z+.04,'#c8cdd2','frame','ext')));
    add(m3.box(-2.25,-1.65,1.82,1.9,-.95,-.85,'#c8cdd2','frame','ext')); add(m3.box(-2.25,-1.65,1.82,1.9,.85,.95,'#c8cdd2','frame','ext'));
    add(m3.box(-2.25,-1.6,1.9,2.0,-.7,.7,'#7c858e','feed','ext'));
    add(m3.box(-2.25,-1.6,1.0,1.04,-.9,.9,'#c8cdd2','frame','ext'));
  }else if(brand==='binder'){
    const BL='#1f7ac8', GR='#dde1e6', BL2='#176099';
    add(m3.box(-2,2.3,0,.22,-1.75,1.75,'#c4c9cf','base','ext'));                                                                   // socle gris
    add(m3.box(-2,2.3,.22,.27,-1.7,1.7,'#aab0b7','base','ext'));
    const arch=[]; for(let i=0;i<=16;i++){ const a=i/16*Math.PI; arch.push([1.45*Math.cos(a),.22+1.9*Math.sin(a)]); }
    const edges=[-1.55,-.95,-.45,.15,.75,1.55]; const cols=[GR,BL,GR,BL,GR];
    for(let i=0;i<5;i++) add(m3.extrude(arch,'x',edges[i],edges[i+1],cols[i],'hood','hood'));                                       // dôme à bandes bleu / gris
    add(m3.extrude([[-.9,.22],[.9,.22],[.9,1.25],[.55,1.5],[-.55,1.5],[-.9,1.25]],'x',1.55,2.05,BL2,'hood','hood'));               // nez bleu
    add(m3.box(2.0,2.07,.45,1.15,-.6,.6,'#16222f','hood','hood'));                                                                  // vitre sombre
    /* ENTREE DU VERRE SUR LE COTE (+z) : convoyeur incliné qui vient déposer le calcin sur l'extracteur vibrant */
    add(m3.extrude([[1.0,1.38],[2.9,2.05],[2.9,2.15],[1.0,1.48]],'x',-.95,.95,'#3b4148','feed','ext'));                              // bande
    for(const sx of [-.95,.9]) add(m3.extrude([[1.0,1.48],[2.9,2.15],[2.9,2.3],[1.0,1.63]],'x',sx,sx+.05,'#8b9299','feed','ext'));   // rebords
    for(const [zz,hh] of [[1.9,1.62],[2.7,2.1]]) for(const sx of [-.8,.8]) add(m3.box(sx-.04,sx+.04,0,hh,zz-.04,zz+.04,'#8b9299','frame','ext'));
    add(m3.box(-.95,.95,.0,.0+.05,2.45,3.1,'#aab0b7','base','ext'));
  }else{
    const Y='#e8b800', DKG='#5a616a', ST='#8b9299';
    [[-1.65,-.85],[1.0,-.85],[-1.65,.85],[1.0,.85]].forEach(([x,z])=>add(m3.box(x-.09,x+.09,0,.25,z-.09,z+.09,ST,'base','ext')));
    add(m3.box(-1.75,1.1,.2,.25,-.97,.97,ST,'base','ext'));
    add(m3.box(-1.75,1.1,.25,1.0,-.97,.97,Y,'hood','hood'));                                                                        // caisson jaune
    add(m3.extrude([[-1.75,1.0],[1.1,1.0],[1.1,1.75],[.45,2.2],[-1.2,2.25],[-1.75,1.85]],'z',-.97,.97,DKG,'hood','hood'));        // capot gris foncé
    [-1.3,-.9].forEach(x=>add(m3.extrude(m3.circle(x,.55,.13,12),'y',2.1,2.5,'#b9c0c7','base','ext',null,{cell:2})));
    /* extracteur vibrant sur son bâti, côté entrée (x<-1.75) */
    [[-2.5,-.8],[-1.85,-.8],[-2.5,.8],[-1.85,.8]].forEach(([x,z])=>add(m3.box(x-.05,x+.05,0,1.95,z-.05,z+.05,ST,'frame','ext')));
    add(m3.box(-2.55,-1.8,1.9,2.0,-.88,.88,ST,'frame','ext'));
    add(m3.box(-2.45,-1.75,2.0,2.14,-.7,.7,'#4b5057','feed','ext')); add(m3.box(-2.45,-1.75,2.14,2.34,-.7,-.62,'#4b5057','feed','ext')); add(m3.box(-2.45,-1.75,2.14,2.34,.62,.7,'#4b5057','feed','ext'));
    add(m3.box(-2.3,-1.9,1.7,1.9,-.4,.4,Y,'feed','ext'));
  }

  /* trajectoire du verre (coordonnées de l'intérieur, converties) : alimentation -> goulotte -> chute -> buses -> sortie */
  const bz=(a,b,c,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];
  const E=[0,1.0], P1=[.28,.78], N=[.52,.5];
  const path={
    feed:t=>[-1.3+.55*t, 1.8-.14*t],
    chute:t=>{ const x=-.75+.75*t; return [x,chuteY(x)+.05]; },
    fall:t=>bz(E,P1,N,t),
    acc:t=>bz(N,[.56,.3],[.55,.02],t),
    rej:t=>bz(N,[.98,.46],[1.2,.02],t),
    det:{vis:.1,uv:.45,nir:.75}
  };
  /* repères numérotés (3D, au centre de la machine) */
  const pins={feed:[-1.05,1.95,0],chute:[-.4,1.5,0],vis:[1.06,1.43,0],uv:[1.06,1.03,0],nir:[1.06,.63,0],ind:[-.3,chuteY(-.3)-.26,0],nozzle:[.36,.52,0],out:[.9,.02,0]};
  const pinsW={}; Object.keys(pins).forEach(k=>pinsW[k]=T(pins[k]));
  /* rideaux de lumière VIS / UV / NIR vers le flux */
  const beams=['vis','uv','nir'].map(id=>{
    const y0={vis:1.43,uv:1.03,nir:.63}[id], tt=path.det[id], tp=path.fall(tt);
    return {id,p:[T([.74,y0,-W]),T([.74,y0,W]),T([tp[0],tp[1],W]),T([tp[0],tp[1],-W])]};
  });
  const S={hoodA:tf.rot?.07:.16,sideYaw:tf.rot?1.17:-.4,faces:F,T,tf,W,path,pins:pinsW,beams,coil:T([-.3,chuteY(-.3)-.12,0]),coilL:[-.3,chuteY(-.3)-.12,0],zmax:tf.zs*(W-.08)};
  M3_SCENES[brand]=S; return S;
}

/* ---------- le moteur de rendu ---------- */
/* EXPLICATION SUPPLÉMENTAIRE : MOTEUR D'AFFICHAGE 3D DES MACHINES (même principe que le logo, en plus complet)
 Contient tout ce qui anime le canvas : camera() (position de la caméra autour de la machine selon yaw/pitch/dist),
 proj() (perspective : point 3D -> pixel), draw() (peint les faces triées du fond vers l'avant + grains + repères), update() (inertie,
 caméra qui glisse vers le repère choisi, apparition des grains), puis les écouteurs souris/doigt/molette/clavier et loop().
 Pas de bibliothèque : tout est du calcul vectoriel simple (produits scalaires et vectoriels) + ctx.fill() sur des polygones.
*/
function m3Start(){
  const cv=$('m3cv'); if(!cv) return;
  const id=++M3S.raf; const ctx=cv.getContext('2d'); let W=0,H=0,dpr=1,last=0,cam=null,pinHit=[],theme={t:0};
  const ptr=new Map(); let drag=null, pinch=0;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
  const rgb=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a==null?1:a})`;

  function readTheme(){
    const cs=getComputedStyle(document.documentElement), card=m3.hx(rgb2hex(cs.getPropertyValue('--card')||'#ffffff')), line=m3.hx(rgb2hex(cs.getPropertyValue('--line')||'#dbe1e7'));
    theme={bg:card,line,dark:(card[0]+card[1]+card[2])<240,acc:cs.getPropertyValue('--accent').trim()||'#0a5aa8',txt:cs.getPropertyValue('--text').trim()||'#1b2733'};
  }
  function rgb2hex(s){ s=(s||'').trim(); if(s[0]==='#'){ if(s.length===4) s='#'+s[1]+s[1]+s[2]+s[2]+s[3]+s[3]; return s; } return '#ffffff'; }
  function resize(){
    const r=cv.getBoundingClientRect(); const nd=Math.min(2,window.devicePixelRatio||1);
    const w=Math.max(200,Math.round(r.width)), h=Math.round(w*(w<560?.82:.62));
    if(w!==W||h!==H||nd!==dpr){ W=w;H=h;dpr=nd; cv.style.height=h+'px'; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  }
  /* EXPLICATION SUPPLÉMENTAIRE : LA CAMERA
   La caméra orbite autour d'une cible (tx,ty,tz) à la distance dist. f = direction du regard, r = droite, u = haut (produit vectoriel).
   Ces 3 axes servent à exprimer n'importe quel point 3D dans le repère de la caméra (voir proj).
  */
  function camera(){
    const t=[M3S.tx,M3S.ty,M3S.tz], cp=Math.cos(M3S.pitch), sp=Math.sin(M3S.pitch), d=M3S.dist;
    const pos=[t[0]+d*cp*Math.sin(M3S.yaw), t[1]+d*sp, t[2]+d*cp*Math.cos(M3S.yaw)];
    let f=[t[0]-pos[0],t[1]-pos[1],t[2]-pos[2]]; const fl=Math.hypot(...f); f=f.map(v=>v/fl);
    let r=[-f[2],0,f[0]]; const rl=Math.hypot(...r)||1; r=r.map(v=>v/rl);                       // droite = avant x haut
    const u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];                // haut = droite x avant
    return {pos,f,r,u,fl:H*1.2,cx:W/2,cy:H*.54};
  }
  /* EXPLICATION SUPPLÉMENTAIRE : PROJECTION 3D -> ECRAN
   On mesure le point dans le repère de la caméra : z = profondeur, x/y = écart latéral/vertical. k = focale/z (perspective).
   Si z<0,3 le point est derrière/trop près de la caméra : on renvoie null (non dessiné). Sinon pixel = centre + (x,y)*k.
  */
  function proj(p){
    const dx=p[0]-cam.pos[0],dy=p[1]-cam.pos[1],dz=p[2]-cam.pos[2];
    const z=dx*cam.f[0]+dy*cam.f[1]+dz*cam.f[2]; if(z<.3) return null;
    const x=dx*cam.r[0]+dy*cam.r[1]+dz*cam.r[2], y=dx*cam.u[0]+dy*cam.u[1]+dz*cam.u[2], k=cam.fl/z;
    return [cam.cx+x*k, cam.cy-y*k, z, k];
  }
  const bez=(a,b,c,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];

  /* --- le verre qui circule --- */
  function pick(){ let s=0; M3_GRAINS.forEach(g=>s+=g.w); let r=Math.random()*s; for(const g of M3_GRAINS){ r-=g.w; if(r<=0) return g; } return M3_GRAINS[0]; }
  function spawn(S){
    let g=pick(); if(g.det&&!m3Avail(g.det)) g=M3_GRAINS[0];
    M3S.parts.push({g,z:(Math.random()*2-1)*S.zmax/S.tf.zs*.92,age:0,rot:Math.random()*6,sz:.075+Math.random()*.04,mark:0,det:false});
  }
  /* EXPLICATION SUPPLÉMENTAIRE : CHRONOLOGIE DU VERRE
   Un grain vit en 4 phases (durées en secondes) : a = plateau vibrant, b = goulotte, c = chute devant les capteurs, d = sortie.
   ppos() donne sa position selon son âge. Les contaminants sont "repérés" pendant la chute par leur technologie, puis soufflés
   par une buse (burst) et partent vers la sortie "refus" au lieu de la sortie "bon verre".
  */
  const D={a:.55,b:1.0,c:.55,d:.6}; // durées : plateau, goulotte, chute, sortie (s)
  function ppos(S,p){
    const a=p.age; let xy,ph;
    if(a<D.a){ xy=S.path.feed(a/D.a); ph=0; }
    else if(a<D.a+D.b){ const u=(a-D.a)/D.b; xy=S.path.chute(u*u*.55+u*.45); ph=1; }
    else if(a<D.a+D.b+D.c){ const u=(a-D.a-D.b)/D.c; xy=S.path.fall(u); ph=2; p.u=u; }
    else { const u=Math.min(1,(a-D.a-D.b-D.c)/D.d); xy=(p.g.det?S.path.rej:S.path.acc)(u); ph=3; p.u=u; }
    return {w:S.T([xy[0],xy[1],p.z]),ph};
  }

  /* --- dessin --- */
  function floor(S){
    const R=4.2, y=0, c=theme.dark?[255,255,255]:[16,40,70];
    const ring=[]; for(let i=0;i<48;i++){ const a=i/48*Math.PI*2; ring.push(proj([Math.cos(a)*R*1.05,y,Math.sin(a)*R*.75])); }
    if(ring.every(Boolean)){ ctx.beginPath(); ring.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.fillStyle=rgb(c,theme.dark?.045:.05); ctx.fill(); }
    ctx.lineWidth=1; ctx.strokeStyle=rgb(c,theme.dark?.08:.07);
    for(let i=-4;i<=4;i++){ const a=proj([i*.9,0,-3.2]), b=proj([i*.9,0,3.2]), c2=proj([-4.2,0,i*.75]), d2=proj([4.2,0,i*.75]);
      if(a&&b){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();} if(c2&&d2){ctx.beginPath();ctx.moveTo(c2[0],c2[1]);ctx.lineTo(d2[0],d2[1]);ctx.stroke();} }
    for(let k=0;k<4;k++){ const e=1.55+k*.1, pts=[[-e*1.35,0,-e*.9],[e*1.35,0,-e*.9],[e*1.35,0,e*.9],[-e*1.35,0,e*.9]].map(proj);
      if(pts.every(Boolean)){ ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.fillStyle=rgb([0,0,0],.045); ctx.fill(); } }
  }
  function shadeCol(f,L){ const k=.6+.55*Math.max(0,f.n[0]*L[0]+f.n[1]*L[1]+f.n[2]*L[2]); return [f.c[0]*k,f.c[1]*k,f.c[2]*k]; }

  /* EXPLICATION SUPPLÉMENTAIRE : DESSIN D'UNE IMAGE DE LA MACHINE
   Fond dégradé -> sol -> toutes les faces (carter seulement si pas en Vue interne ; carter rendu transparent selon xr) triées par
   profondeur (algorithme du peintre) et ombrées par shadeCol() -> grains -> repères numérotés cliquables (pinHit).
  */
  function draw(S,dt){
    ctx.clearRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,0,0,H); const b=theme.bg;
    g.addColorStop(0,rgb(mixc(b,theme.dark?[40,60,80]:[200,220,240],theme.dark?.35:.38))); g.addColorStop(1,rgb(mixc(b,theme.dark?[10,14,18]:[255,255,255],.35)));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    cam=camera(); floor(S);
    const Lg=(()=>{ const v=[-.45*cam.r[0]+.8*cam.u[0]-.5*cam.f[0], -.45*cam.r[1]+.8*cam.u[1]-.5*cam.f[1], -.45*cam.r[2]+.8*cam.u[2]-.5*cam.f[2]]; const l=Math.hypot(...v); return v.map(x=>x/l); })();
    const xr=M3S.xr, sel=M3S.sel, selTech=sel&&M3_TECH[sel]?sel:null, seeInt=xr>.03;
    const inList=[], outList=[];
    for(const f of S.faces){
      if(f.g==='int'&&!seeInt) continue;
      const dx=f.ctr[0]-cam.pos[0],dy=f.ctr[1]-cam.pos[1],dz=f.ctr[2]-cam.pos[2];
      if(f.n[0]*dx+f.n[1]*dy+f.n[2]*dz>=0) continue;
      (f.g==='int'?inList:outList).push({d:dx*dx+dy*dy+dz*dz-(f.dec?1e3:0),f});
    }
    /* particules et faisceaux de l'intérieur */
    if(seeInt){
      S.beams.forEach(bm=>{
        const on=selTech?(selTech===bm.id?1:0):(sel?0:.22); if(!on||!m3Avail(bm.id)) return;
        const c=m3.mean(bm.p); const dx=c[0]-cam.pos[0],dy=c[1]-cam.pos[1],dz=c[2]-cam.pos[2];
        inList.push({d:dx*dx+dy*dy+dz*dz,beam:bm,on});
      });
      if(selTech==='ind'&&m3Avail('ind')){ const c=S.coil; const dx=c[0]-cam.pos[0],dy=c[1]-cam.pos[1],dz=c[2]-cam.pos[2]; inList.push({d:dx*dx+dy*dy+dz*dz-.5,coil:1}); }
      M3S.parts.forEach(p=>{ const q=ppos(S,p); p._w=q.w; p._ph=q.ph; const dx=q.w[0]-cam.pos[0],dy=q.w[1]-cam.pos[1],dz=q.w[2]-cam.pos[2]; inList.push({d:dx*dx+dy*dy+dz*dz-.02,part:p}); });
      M3S.bursts.forEach(bu=>{ const dx=bu.w[0]-cam.pos[0],dy=bu.w[1]-cam.pos[1],dz=bu.w[2]-cam.pos[2]; inList.push({d:dx*dx+dy*dy+dz*dz-.05,burst:bu}); });
    }
    inList.sort((a,b)=>b.d-a.d); outList.sort((a,b)=>b.d-a.d);
    const bgc=theme.bg;
    const drawFace=(f,alpha,dim)=>{
      const pts=f.p.map(proj); if(pts.some(q=>!q)) return;
      let c=shadeCol(f,Lg), hi=false;
      if(sel&&f.g==='int'){ if(f.tag===sel||(sel==='out'&&f.tag==='out')) hi=true; else c=mixc(c,[bgc[0],bgc[1],bgc[2]],.62); }
      if(sel&&f.g!=='int'&&f.tag===sel) hi=true;
      if(hi) c=mixc(c,[255,255,255],.12);
      ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
      ctx.fillStyle=rgb(c,alpha); ctx.fill();
      if(alpha<.95&&!hi) return;
      ctx.lineWidth=hi?1.3:.8; ctx.lineJoin='round'; ctx.strokeStyle=hi?rgb(m3.hx(M3_TECH[sel]||'#ffffff'),Math.min(1,alpha+.3)):rgb(c,alpha);
      ctx.stroke();
    };
    /* 1) intérieur */
    inList.forEach(o=>{
      if(o.f){ drawFace(o.f,Math.min(1,xr*1.6)); return; }
      if(o.beam){ const q=o.beam.p.map(proj); if(q.some(v=>!v)) return; const col=m3.hx(M3_TECH[o.beam.id]), pul=.65+.35*Math.sin(M3S.t*7+(o.beam.id==='uv'?1:o.beam.id==='nir'?2:0));
        ctx.beginPath(); q.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1])); ctx.closePath(); ctx.fillStyle=rgb(col,(.18+.22*pul)*o.on*xr); ctx.fill();
        ctx.strokeStyle=rgb(col,.75*o.on*xr); ctx.lineWidth=1.4; ctx.stroke(); return; }
      if(o.coil){ const col=m3.hx(M3_TECH.ind); for(let k=0;k<3;k++){ const ph=((M3S.t*.9+k/3)%1), rx=.12+ph*.55, rz=.4+ph*.35; const ring=[]; for(let i=0;i<=40;i++){ const a=i/40*Math.PI*2; ring.push(proj(S.T([S.coilL[0]+Math.cos(a)*rx, S.coilL[1]-.02, Math.sin(a)*rz]))); }
        if(ring.every(Boolean)){ ctx.beginPath(); ring.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1])); ctx.strokeStyle=rgb(col,(1-ph)*.9*xr); ctx.lineWidth=2; ctx.stroke(); } } return; }
      if(o.burst){ const bu=o.burst, a=proj(bu.w), e=proj(S.T([.5+.45*bu.k,.47,bu.lz])); if(a&&e){ ctx.strokeStyle=`rgba(255,255,255,${(1-bu.k)*.9*xr})`; ctx.lineWidth=Math.max(2,a[3]*.05); ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(e[0],e[1]); ctx.stroke();
        ctx.strokeStyle=`rgba(120,200,255,${(1-bu.k)*.8*xr})`; ctx.lineWidth=1.2; ctx.stroke(); } return; }
      if(o.part){ const p=o.part, q=proj(p._w); if(!q) return; const r=p.sz*q[3];
        let al=Math.min(1,p.age/.15)*xr; if(p._ph===3&&p.u>.7) al*=Math.max(0,(1-p.u)/.3);
        const emph=selTech&&p.g.det===selTech;
        const rr=r*(emph?1.5:1);
        if(p.mark>0){ const col=m3.hx(M3_TECH[p.det]||'#ffffff'); ctx.beginPath(); ctx.arc(q[0],q[1],rr*(1.6+p.mark*1.6),0,6.3); ctx.strokeStyle=rgb(col,Math.min(1,p.mark)*.9*al); ctx.lineWidth=2; ctx.stroke(); }
        if(emph&&p.det!==false){ ctx.beginPath(); ctx.arc(q[0],q[1],rr*1.9,0,6.3); ctx.fillStyle=rgb(m3.hx(M3_TECH[selTech]),.25*al); ctx.fill(); }
        const col=m3.hx(p.g.c); ctx.beginPath(); for(let i=0;i<6;i++){ const a=p.rot+i/6*6.283, rad=rr*(i%2?.8:1.1); ctx.lineTo(q[0]+Math.cos(a)*rad,q[1]+Math.sin(a)*rad); } ctx.closePath();
        ctx.fillStyle=rgb(col,.95*al); ctx.fill(); ctx.strokeStyle=rgb([col[0]*.55,col[1]*.55,col[2]*.55],al); ctx.lineWidth=.8; ctx.stroke(); }
    });
    /* 2) extérieur (carter qui devient transparent) */
    outList.forEach(o=>{ const f=o.f; const a=f.g==='hood'?(1-xr*(1-S.hoodA)):(f.tag==='base'?(1-xr*.55):1); drawFace(f,a); });
    /* 3) repères numérotés par-dessus */
    pinHit=[]; const tm=M3S.t;
    M3_PARTS.forEach(p=>{
      const w=S.pins[p.id]; const q=proj(w); if(!q) return;
      const isSel=sel===p.id, col=M3_TECH[p.id]||theme.acc, off=!m3Avail(p.id), inside=xr<.4;
      const R=(isSel?14:10.5)*Math.min(1.2,Math.max(.8,q[3]/62));
      pinHit.push({id:p.id,x:q[0],y:q[1],r:R+5});
      ctx.globalAlpha=off?.35:(inside&&!isSel?.78:1);
      if(isSel){ const k=(tm*1.4)%1; ctx.beginPath(); ctx.arc(q[0],q[1],R+k*12,0,6.3); ctx.strokeStyle=col; ctx.globalAlpha=(1-k)*.7; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1; }
      ctx.beginPath(); ctx.arc(q[0],q[1],R,0,6.3); ctx.fillStyle=col; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=theme.dark?'#10161c':'#ffffff'; ctx.stroke();
      ctx.fillStyle=(p.id==='vis')?'#2a2100':'#ffffff'; ctx.font=`700 ${Math.round(R*1.05)}px system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.n,q[0],q[1]+.5);
      if(isSel){ const label=m3PartTxt(p,'t'); ctx.font='600 12px system-ui,sans-serif'; const w2=ctx.measureText(label).width+14; let lx=q[0]+R+8; if(lx+w2>W-4) lx=q[0]-R-8-w2; const ly=q[1]-11;
        ctx.fillStyle=theme.dark?'rgba(16,22,28,.92)':'rgba(255,255,255,.95)'; ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(lx,ly,w2,22,11); else ctx.rect(lx,ly,w2,22); ctx.fill(); ctx.stroke();
        ctx.fillStyle=theme.txt; ctx.textAlign='left'; ctx.fillText(label,lx+7,ly+11.5); }
      ctx.globalAlpha=1;
    });
  }

  function update(S,dt){
    M3S.t+=dt;
    M3S.xr+=(M3S.xrT-M3S.xr)*Math.min(1,dt*6);
    if(M3S.tgt){ const k=Math.min(1,dt*4.5), g=M3S.tgt; let dy=g.yaw-M3S.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy));
      M3S.yaw+=dy*k; M3S.pitch+=(g.pitch-M3S.pitch)*k; M3S.dist+=(g.dist-M3S.dist)*k; M3S.tx+=(g.t[0]-M3S.tx)*k; M3S.ty+=(g.t[1]-M3S.ty)*k; M3S.tz+=(g.t[2]-M3S.tz)*k;
      if(Math.abs(dy)<.004&&Math.abs(g.dist-M3S.dist)<.01) M3S.tgt=null; }
    else if(M3S.idle>0) M3S.idle-=dt; else if(M3S.auto&&!drag&&!M3S.sel) M3S.yaw+=dt*.18;
    if(M3S.flow&&M3S.xr>.03){
      M3S.spawn-=dt; if(M3S.spawn<=0&&M3S.parts.length<46){ spawn(S); M3S.spawn=.14+Math.random()*.14; }
    }
    {
      const k=M3S.flow?1:0;
      M3S.parts.forEach(p=>{
        p.age+=dt*k;
        /* repérage : la technologie qui voit ce grain l'entoure de sa couleur */
        if(p.g.det&&!p.det){
          const dd=p.g.det, tt=S.path.det[dd];
          const hit=dd==='ind'?(p.age>D.a+D.b*.78):(p.age>D.a+D.b+D.c*(tt||0));
          if(hit){ p.det=dd; p.mark=1; }
        }
        if(p.mark>0) p.mark=Math.max(.55,p.mark-dt*.6);
        if(p.g.det&&p.det&&!p.fired&&p.age>D.a+D.b+D.c){ p.fired=true; M3S.bursts.push({lz:p.z,w:S.T([.5,.52,p.z]),k:0}); }
      });
      M3S.parts=M3S.parts.filter(p=>p.age<D.a+D.b+D.c+D.d+.05);
      M3S.bursts.forEach(b=>b.k+=dt*5); M3S.bursts=M3S.bursts.filter(b=>b.k<1);
    }
  }

  /* --- souris / doigt --- */
  function pos(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; }
  cv.style.touchAction='none';
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,pos(e)); drag={x:e.clientX,y:e.clientY,moved:0,start:pos(e)}; M3S.idle=4; M3S.tgt=null; const h=$('m3hint'); if(h) h.classList.add('gone'); });
  cv.addEventListener('pointermove',e=>{
    if(!ptr.has(e.pointerId)) return; const prev=ptr.get(e.pointerId), cur=pos(e); ptr.set(e.pointerId,cur);
    if(ptr.size===2){ const [a,b]=[...ptr.values()]; const dd=Math.hypot(a[0]-b[0],a[1]-b[1]); if(pinch) M3S.dist=clamp(M3S.dist*(pinch/dd),2.4,10); pinch=dd; if(drag) drag.moved=99; return; }
    if(!drag) return; drag.moved+=Math.abs(cur[0]-prev[0])+Math.abs(cur[1]-prev[1]);
    M3S.yaw-=(cur[0]-prev[0])*.009; M3S.pitch=clamp(M3S.pitch+(cur[1]-prev[1])*.007,-.05,1.35); M3S.idle=4;
  });
  const up=e=>{
    if(!ptr.has(e.pointerId)) return; const was=ptr.size; ptr.delete(e.pointerId); if(ptr.size<2) pinch=0;
    if(drag&&drag.moved<7&&was===1){ const s=drag.start; let best=null,bd=1e9; pinHit.forEach(h=>{ const d=Math.hypot(h.x-s[0],h.y-s[1]); if(d<h.r&&d<bd){bd=d;best=h;} }); if(best) m3Select(best.id); }
    if(!ptr.size) drag=null;
  };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); M3S.dist=clamp(M3S.dist*(1+Math.sign(e.deltaY)*.08),2.4,10); M3S.idle=4; M3S.tgt=null; },{passive:false});
  cv.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') M3S.yaw-=.1; else if(e.key==='ArrowRight') M3S.yaw+=.1; else if(e.key==='+') M3S.dist=clamp(M3S.dist-.4,2.4,10); else if(e.key==='-') M3S.dist=clamp(M3S.dist+.4,2.4,10); });
  cv.tabIndex=0;

  readTheme(); let n=0;
  /* EXPLICATION SUPPLÉMENTAIRE : BOUCLE D'ANIMATION DE LA VISIONNEUSE
   Chaque image : dt = temps écoulé (plafonné à 0,05 s), relecture du thème clair/sombre toutes les 45 images, ajustement de la taille,
   update() puis draw(). S'arrête toute seule si on quitte la page (M3S.raf changé ou canvas retiré).
  */
  function loop(ts){
    if(M3S.raf!==id||!cv.isConnected) return;
    const dt=Math.min(.05,(ts-(last||ts))/1000); last=ts;
    if(n++%45===0) readTheme();
    resize(); const S=m3Build(M3S.brand); update(S,dt); draw(S,dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* ============================================================================
 ===================== 5. PROTECTION DES DONNEES (tutos, fiches, comptes) =====================
 PROBLEME : les tutos que vous créez sont gardés dans le navigateur de l'appareil (localStorage). Le navigateur peut les
 effacer (nettoyage du cache, manque de place, désinstallation...). Cette section ajoute 4 protections :
   1) "STOCKAGE PERSISTANT" : on demande au navigateur de ne JAMAIS effacer nos données tout seul (navigator.storage.persist).
   2) COPIE DE SECOURS AUTOMATIQUE : à chaque enregistrement, une 2e copie est faite dans IndexedDB (autre zone du navigateur,
      base "sibelco_backup"). Au démarrage, si les données principales ont disparu, elles sont RESTAUREES toutes seules.
   3) SAUVEGARDE COMPLETE EN FICHIER (Paramètres > "Sauvegarde des données") : tutos + fiches + comptes + scores dans un seul
      fichier .json à garder (mail, clé USB, Drive...) et à réimporter sur n'importe quel appareil.
   4) RAPPEL sur l'accueil (classes 3 et 4) si aucune sauvegarde fichier depuis 14 jours.
 LIMITES A CONNAITRE : les PDF/PowerPoint ajoutés aux fiches sont dans une autre zone (sibelco_files) : ils ne sont pas
 dans la copie de secours ni dans le fichier .json (trop volumineux). Et chaque appareil a SES données : pour partager
 des tutos entre téléphones, utilisez la sauvegarde en fichier (ou un vrai serveur, non prévu ici).
 ============================================================================ */
const BK_KEYS=[LBLKEY,NAVKEY,FHKEY,FLKEY,FZKEY,GLKEY,GLEKEY,M3_TXT_KEY,KEY,UKEY,FKEY,SKEY,GSKEY,G2KEY,LANG_KEY,'sibelco_seed_aa_v2','sibelco_last_export'];  // données à protéger
const LAST_EXPORT='sibelco_last_export';
// petite base IndexedDB "sibelco_backup" : un seul enregistrement "snap" = copie de toutes les clés ci-dessus
function bkDb(){ return new Promise((ok,ko)=>{ const r=indexedDB.open('sibelco_backup',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
async function bkPut(v){ const db=await bkDb(); return new Promise((ok,ko)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,'snap'); tx.oncomplete=()=>ok(); tx.onerror=()=>ko(tx.error); }); }
async function bkGet(){ const db=await bkDb(); return new Promise((ok,ko)=>{ const tx=db.transaction('kv','readonly'), rq=tx.objectStore('kv').get('snap'); tx.oncomplete=()=>ok(rq.result); tx.onerror=()=>ko(tx.error); }); }
function bkSnapshot(){ const data={}; BK_KEYS.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!==null) data[k]=v; }catch(e){} }); return data; }
let bkTimer=null;
function bkSchedule(){ clearTimeout(bkTimer); bkTimer=setTimeout(bkNow,700); }       // attend 700ms après le dernier enregistrement
async function bkNow(){ try{ const data=bkSnapshot(); if(data[KEY]||data[UKEY]) await bkPut({ts:Date.now(),data}); }catch(e){} }
// on "enveloppe" les fonctions d'enregistrement existantes : elles font leur travail PUIS déclenchent la copie de secours
(function(){
  const a=save, b=saveFiches, c=saveUsers;
  save=function(){ a(); bkSchedule(); };
  saveFiches=function(){ b(); bkSchedule(); };
  saveUsers=function(){ c(); bkSchedule(); };
  const e=exportJSON; exportJSON=function(){ e(); try{ localStorage.setItem(LAST_EXPORT,String(Date.now())); }catch(x){} bkSchedule(); };
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) bkNow(); });   // copie aussi quand on quitte l'appli
})();
// stockage persistant : le navigateur ne doit plus effacer nos données de lui-même
async function askPersist(){ try{ if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted())) await navigator.storage.persist(); }catch(e){} }
// RESTAURATION : appelée AVANT le démarrage. Si tout a disparu du stockage principal mais que la copie de secours existe -> on remet tout.

/* ============================================================================
 DONNEES PARTAGEES DU SITE : fichier donnees.json (à mettre à côté de index.html, dans le dépôt Git)
   - Paramètres > "Exporter pour le site" télécharge donnees.json (tutos, fiches, mots-clés, flowsheet, textes, photos d'accueil).
     Les comptes, mots de passe, scores et réglages personnels n'y sont JAMAIS mis (le dépôt peut être public).
   - Vous remplacez donnees.json dans le dépôt puis vous faites le commit : au prochain chargement, chaque appareil
     fusionne ce fichier avec ses données (même identifiant = la version du fichier gagne ; le reste est conservé).
   - La fusion n'a lieu que si le contenu du fichier a changé depuis la dernière fois (vos modifs locales ne sont pas écrasées à chaque ouverture).
 ============================================================================ */
const SH_ARR=[KEY,FKEY,GLKEY], SH_OBJ=[LBLKEY,NAVKEY,FHKEY,FLKEY,FZKEY,M3_TXT_KEY,TPKEY], SH_HASH='sibelco_shared_hash';
const shHash=t=>{ let h=5381; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return t.length+':'+h; };
async function sharedSync(){
  try{
    const r=await fetch('donnees.json',{cache:'no-store'}); if(!r.ok) return false;
    const txt=await r.text(), h=shHash(txt);
    if(localStorage.getItem(SH_HASH)===h) return false;
    const d=JSON.parse(txt); if(!d||d.app!=='sibelco-tutos'||!d.data||typeof d.data!=='object') return false;
    SH_ARR.forEach(k=>{
      if(typeof d.data[k]!=='string') return;
      const fa=JSON.parse(d.data[k]); if(!Array.isArray(fa)) return;
      let la=null; try{ la=JSON.parse(localStorage.getItem(k)); }catch(e){}
      if(!Array.isArray(la)){ localStorage.setItem(k,JSON.stringify(fa)); return; }
      fa.forEach(it=>{ const i=it&&it.id!==undefined?la.findIndex(x=>x&&x.id===it.id):-1; if(i>=0) la[i]=it; else la.push(it); });
      localStorage.setItem(k,JSON.stringify(la));
    });
    SH_OBJ.forEach(k=>{
      if(typeof d.data[k]!=='string') return;
      const fo=JSON.parse(d.data[k]); if(!fo||typeof fo!=='object'||Array.isArray(fo)) return;
      let lo={}; try{ lo=JSON.parse(localStorage.getItem(k))||{}; }catch(e){}
      localStorage.setItem(k,JSON.stringify(Object.assign(lo,fo)));
    });
    localStorage.setItem(SH_HASH,h);
    location.reload(); return true;
  }catch(e){ return false; }
}
function siteExport(){
  const data={}; [...SH_ARR,...SH_OBJ].forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!==null) data[k]=v; }catch(e){} });
  const blob=new Blob([JSON.stringify({app:'sibelco-tutos',version:2,date:new Date().toISOString(),data},null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='donnees.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast(L('donnees.json téléchargé : remplacez-le dans le dépôt puis faites le commit','donnees.json downloaded: replace it in the repo then commit'));
}
async function safeBoot(){
  let restored=false;
  try{
    const lost=localStorage.getItem(KEY)===null&&localStorage.getItem(UKEY)===null;
    if(lost&&!sessionStorage.getItem('sibelco_restoring')){
      const b=await bkGet();
      if(b&&b.data&&(b.data[KEY]||b.data[UKEY])){ Object.keys(b.data).forEach(k=>localStorage.setItem(k,b.data[k])); sessionStorage.setItem('sibelco_restoring','1'); restored=true; }
    }
  }catch(e){}
  if(restored){ location.reload(); return; }          // le script relit alors les données restaurées
  if(await sharedSync()) return;                      // nouveau donnees.json dans le dépôt : fusion puis rechargement
  try{ sessionStorage.removeItem('sibelco_restoring'); }catch(e){}
  boot(); askPersist(); setTimeout(bkNow,1500);
}
// SAUVEGARDE COMPLETE en fichier / RESTAURATION depuis un fichier
function fullBackup(){
  const data=bkSnapshot(); const blob=new Blob([JSON.stringify({app:'sibelco-tutos',version:2,date:new Date().toISOString(),data},null,1)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='sibelco-sauvegarde-complete-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{ localStorage.setItem(LAST_EXPORT,String(Date.now())); }catch(e){} bkSchedule();
  toast(L('Sauvegarde complète téléchargée','Full backup downloaded')); setTimeout(()=>{ if(state.view==='settings') renderSettings(); },300);
}
function fullRestore(ev){
  const f=ev.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result); if(!d||d.app!=='sibelco-tutos'||!d.data||typeof d.data!=='object') throw 0;
      if(!confirm(L('Remplacer TOUTES les données de cet appareil (tutos, fiches, comptes, scores) par celles de la sauvegarde ?','Replace ALL data on this device (tutorials, sheets, accounts, scores) with the backup?'))) return;
      Object.keys(d.data).forEach(k=>{ if(BK_KEYS.includes(k)&&typeof d.data[k]==='string') localStorage.setItem(k,d.data[k]); });
      localStorage.removeItem(SESS); location.reload();
    }catch(e){ toast(T('invalid')); } ev.target.value=''; };
  r.readAsText(f);
}
const fmtD=t=>t?new Date(+t).toLocaleString(lang,{dateStyle:'short',timeStyle:'short'}):L('jamais','never');
// Panneau "Sauvegarde des données" ajouté en bas des Paramètres
(function(){

    const adm=settings.cls>=3;
    $('app').insertAdjacentHTML('beforeend',`<div class="panel" id="safepanel"><h3 style="margin-top:0">${L('Sauvegarde des données','Data backup')}</h3>

      ${adm?`<div class="row" style="margin-top:10px"><button class="primary" onclick="fullBackup()">${L('Télécharger la sauvegarde complète','Download full backup')}</button>
      <button onclick="document.getElementById('fullimp').click()">${L('Restaurer depuis un fichier','Restore from file')}</button>
      <button onclick="siteExport()">${L('Exporter pour le site (donnees.json)','Export for the site (donnees.json)')}</button>
      <input id="fullimp" type="file" accept="application/json" class="hidden" onchange="fullRestore(event)"></div>`:''}</div>`);
    (async()=>{
      let per=false, use='', snap=null;
      try{ per=!!(navigator.storage&&navigator.storage.persisted&&await navigator.storage.persisted()); }catch(e){}
      try{ const es=await navigator.storage.estimate(); use=(es.usage/1048576).toFixed(1)+' Mo / '+(es.quota/1048576/1024).toFixed(1)+' Go'; }catch(e){}
      try{ snap=await bkGet(); }catch(e){}
      const el=$('safest'); if(!el) return;
      el.innerHTML=`<div>${per?'✅':'⚠️'} ${L('Protection du navigateur','Browser protection')} : <b>${per?L('activée (non effaçable automatiquement)','on (not auto-erased)'):L('non accordée','not granted')}</b>${per?'':` <button class="small" onclick="askPersist().then(()=>renderSettings())">${L('Activer','Enable')}</button>`}</div>
        <div>${snap?'✅':'⚠️'} ${L('Copie de secours automatique','Automatic safety copy')} : <b>${snap?fmtD(snap.ts):L('aucune pour l’instant','none yet')}</b></div>
        <div>${localStorage.getItem(LAST_EXPORT)?'✅':'⚠️'} ${L('Dernière sauvegarde en fichier','Last backup file')} : <b>${fmtD(localStorage.getItem(LAST_EXPORT))}</b></div>
        ${use?`<div>${L('Espace utilisé','Space used')} : ${use}</div>`:''}`;
    })();
  };
})();

/* PHOTOS DES CARTES : fitCover() choisit entre « remplir » et « afficher en entier sur fond flou » selon le format de la photo.
   Un observateur l'applique à toutes les cartes (accueil, tutos, fiches, dossiers...) dès qu'elles sont dessinées. */
function fitCover(img){
  const c=img.parentElement; if(!c||!c.classList.contains('cover')) return;
  const go=()=>{ if(!img.naturalWidth) return; const r=img.naturalWidth/img.naturalHeight, box=c.clientHeight?c.clientWidth/c.clientHeight:2;
    const near=Math.abs(Math.log(r/box))<0.3; c.classList.toggle('fitc',!near);
    if(!near) c.style.setProperty('--ci','url("'+img.src+'")'); };
  if(img.complete&&img.naturalWidth) go(); else img.addEventListener('load',go,{once:true});
}
(function(){
  const run=()=>document.querySelectorAll('.card .cover img:not([data-fit])').forEach(i=>{ i.dataset.fit='1'; fitCover(i); });
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true}); run();
})();
